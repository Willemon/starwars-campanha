        },
        "Tecnometria (Technometry)": {
                        "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                        "descriptor": "—",
                        "text": "Tempo: Ação padrão\nAlvo: Um droide, computador ou dispositivo eletrônico tocado\n\nVocê lê impressões tecnológicas pela Força, percebendo uso recente, função, falhas e traços de programação. Faça uma verificação de Usar a Força. O resultado determina a quantidade de informação obtida.",
                        "checks": [
                                        {
                                                        "cd": "15",
                                                        "effect": "Descubra a função básica do dispositivo e se ele está danificado ou adulterado."
                                        },
                                        {
                                                        "cd": "20",
                                                        "effect": "Descubra o último uso relevante, usuário recente ou comando executado."
                                        },
                                        {
                                                        "cd": "25",
                                                        "effect": "Identifique falhas, bloqueios, programação incomum ou sinais de sabotagem."
                                        },
                                        {
                                                        "cd": "30",
                                                        "effect": "Receba uma leitura detalhada de histórico recente e propósito oculto do sistema."
                                        }
                        ],
                        "special": "Tecnometria não substitui Mecânica ou Usar Computadores para reparar ou invadir sistemas. Você pode gastar 1 Ponto da Força para receber +5 em uma verificação relacionada ao dispositivo lido."
        },
        "Tempestade da Força (Force Storm)": {
                        "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                        "descriptor": "[Lado Sombrio], [Telequinético]",
                        "text": "Tempo: Ação padrão\nAlvo: Criaturas e objetos em uma área a até 12 quadrados e em sua linha de visão\n\nVocê convoca uma tempestade violenta de energia da Força, detritos e pressão telecinética. Faça uma verificação de Usar a Força contra a Defesa de Reflexos de cada alvo na área. Alvos atingidos sofrem dano e são arremessados pela tempestade.",
                        "checks": [
                                        {
                                                        "cd": "Defesa de Reflexos do alvo",
                                                        "effect": "O alvo sofre 4d6 de dano de Força e é empurrado 1 quadrado."
                                        },
                                        {
                                                        "cd": "Defesa de Reflexos +5",
                                                        "effect": "O alvo sofre 6d6 de dano de Força e é empurrado 2 quadrados."
                                        },
                                        {
                                                        "cd": "Defesa de Reflexos +10",
                                                        "effect": "O alvo sofre 8d6 de dano de Força, é empurrado 3 quadrados e cai prostrado."
                                        }
                        ],
                        "special": "Usar este poder conta como ato do Lado Sombrio. Você pode gastar 1 Ponto da Força para aumentar a área ou o dano em +2d6."
        },
        "Transferência de Essência (Essence Transfer)": {
                        "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom / conteúdo Sith da campanha",
                        "descriptor": "[Lado Sombrio]",
                        "text": "Tempo: Ação de rodada completa\nAlvo: Uma criatura viva adequada dentro do alcance definido pela cena\n\nVocê tenta deslocar sua consciência para outro corpo, usando o Lado Sombrio para sobreviver à destruição do próprio corpo. Faça uma verificação de Usar a Força contra a Defesa de Vontade do alvo. Se tiver sucesso, sua essência tenta dominar o hospedeiro.",
                        "checks": [
                                        {
                                                        "cd": "Defesa de Vontade do alvo",
                                                        "effect": "Você força contato mental com o alvo e pode iniciar a disputa de controle conforme a cena."
                                        },
                                        {
                                                        "cd": "Defesa de Vontade +5",
                                                        "effect": "Você recebe vantagem na disputa inicial de controle do corpo."
                                        },
                                        {
                                                        "cd": "Defesa de Vontade +10",
                                                        "effect": "O alvo sofre −5 na primeira tentativa de resistir à transferência."
                                        }
                        ],
                        "special": "Este poder é raro, extremo e ligado a tradições Sith. Usá-lo conta como ato grave do Lado Sombrio. Detalhes de permanência, morte do corpo original e resistência prolongada seguem a regra da campanha."
        },
        "Transferência Sombria (Dark Transfer)": {
                        "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                        "descriptor": "[Lado Sombrio]",
                        "text": "Tempo: Ação padrão\nAlvo: Uma criatura viva ao seu alcance\n\nVocê usa energia do Lado Sombrio para restaurar vitalidade, pagando o preço com degradação física e espiritual. Faça uma verificação de Usar a Força. O resultado determina a quantidade de PV curados no alvo.",
                        "checks": [
                                        {
                                                        "cd": "15",
                                                        "effect": "O alvo cura PV iguais ao nível de personagem dele."
                                        },
                                        {
                                                        "cd": "20",
                                                        "effect": "O alvo cura PV iguais a 2 × o nível de personagem dele."
                                        },
                                        {
                                                        "cd": "25",
                                                        "effect": "O alvo cura PV iguais a 3 × o nível de personagem dele."
                                        },
                                        {
                                                        "cd": "30",
                                                        "effect": "O alvo cura PV iguais a 4 × o nível de personagem dele."
                                        }
                        ],
                        "special": "Você desce −1 passo persistente na trilha de condição ao usar este poder. Essa condição só é removida após 8 horas de descanso. Você pode gastar 1 Ponto da Força para evitar esse passo na trilha."
        },
        "Transferência Vital (Vital Transfer)": {
                "source": "Star Wars Saga Edition Core Rulebook / Saga Edition RPG Omnibus",
                "descriptor": "[Lado Luminoso]",
                "text": "Tempo: Ação padrão\nAlvo: Uma criatura tocada\n\nVocê usa sua própria força vital para curar outra criatura viva, usando a Força como conduto. Faça uma verificação de Usar a Força. O resultado determina quantos pontos de vida o alvo recupera. Cada vez que usar Transferência Vital, você sofre dano igual à metade dos pontos de vida curados, arredondado para baixo.",
                "checks": [
                        { "cd": "15", "effect": "O alvo recupera pontos de vida iguais a 2 × o nível de personagem dele." },
                        { "cd": "20", "effect": "O alvo recupera pontos de vida iguais a 3 × o nível de personagem dele." },
                        { "cd": "25", "effect": "O alvo recupera pontos de vida iguais a 4 × o nível de personagem dele." }
                ],
                "special": "Você pode gastar 1 Ponto da Força para evitar o dano sofrido ao usar este poder. Você pode gastar 1 Ponto de Destino para mover o alvo +5 passos na trilha de condição além da cura normal. Você pode curar menos do que sua verificação permite. Você não pode curar a si mesmo com este poder."
        },
        "Truque Mental (Mind Trick)": {
                "source": "Star Wars Saga Edition Core Rulebook / Saga Edition RPG Omnibus",
                "descriptor": "[Afeta a Mente]",
                "text": "Tempo: Ação padrão\nAlvo: Uma criatura com Inteligência 3 ou maior, em sua linha de visão e a até 12 quadrados\n\nVocê usa a Força para alterar as percepções do alvo ou plantar uma sugestão em sua mente. Faça uma verificação de Usar a Força contra a Defesa de Vontade do alvo. Se tiver sucesso, escolha um dos efeitos: criar uma alucinação breve que distraia o alvo e permita usar Furtividade mesmo que ele esteja ciente de você; realizar uma finta para que seu próximo ataque contra o alvo ignore o bônus de Destreza dele na Defesa de Reflexos; fazer uma sugestão desagradável parecer razoável, desde que você possa se comunicar com o alvo e a sugestão não ameace claramente a vida dele; ou encher o alvo de terror, fazendo-o fugir de você em velocidade máxima por 1 minuto. A fuga termina se o alvo for ferido, e esse efeito de medo falha se o nível do alvo for igual ou maior que o seu nível de personagem.",
                "checks": [
                        { "cd": "Defesa de Vontade do alvo", "effect": "Escolha um dos efeitos de alteração de percepção, finta, sugestão ou medo descritos no texto do poder." }
                ],
                "special": "Ao fazer uma sugestão, você pode gastar 1 Ponto da Força para melhorar a atitude do alvo em um passo, mais um passo adicional para cada 5 pontos pelos quais sua verificação de Usar a Força superar a Defesa de Vontade do alvo. Criaturas sem mente ou imunes a efeitos mentais não são afetadas."
        },
        "Valor (Valor)": {
                        "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                        "descriptor": "[Lado Luminoso]",
                        "text": "Tempo: Ação rápida\nAlvo: Você ou um aliado a até 12 quadrados e em sua linha de visão\n\nVocê reforça coragem, disciplina e convicção através do Lado Luminoso. Faça uma verificação de Usar a Força. O resultado determina o bônus de moral concedido contra medo, efeitos de afeta a mente e influência do Lado Sombrio até o início do seu próximo turno.",
                        "checks": [
                                        {
                                                        "cd": "15",
                                                        "effect": "O alvo recebe +1 de bônus de moral na Defesa de Vontade."
                                        },
                                        {
                                                        "cd": "20",
                                                        "effect": "O alvo recebe +2 de bônus de moral na Defesa de Vontade e contra efeitos de medo."
                                        },
                                        {
                                                        "cd": "25",
                                                        "effect": "O alvo recebe +5 de bônus de moral na Defesa de Vontade contra efeitos de medo, afeta a mente e Lado Sombrio."
                                        }
                        ],
                        "special": "Bônus de moral não se acumulam com outros bônus de moral. Você pode gastar 1 Ponto da Força para afetar todos os aliados a até 6 quadrados."
        },
        "Varredura Sarlacc (Sarlacc Sweep)": {
                        "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                        "descriptor": "[Forma de Sabre]",
                        "text": "Tempo: Ação padrão\nAlvo: Inimigos ao seu alcance\n\nVocê executa uma varredura ampla com o sabre de luz, usando a Força para guiar a lâmina contra múltiplos oponentes. Faça uma verificação de Usar a Força. O resultado determina quantos alvos podem ser atacados.",
                        "checks": [
                                        {
                                                        "cd": "20",
                                                        "effect": "Faça um ataque com sabre de luz contra até dois inimigos ao seu alcance."
                                        },
                                        {
                                                        "cd": "25",
                                                        "effect": "Faça um ataque com sabre de luz contra até três inimigos ao seu alcance."
                                        },
                                        {
                                                        "cd": "30",
                                                        "effect": "Faça um ataque com sabre de luz contra todos os inimigos ao seu alcance."
                                        }
                        ],
                        "special": "Exige sabre de luz ativado. Você sofre −2 em cada ataque feito com este poder, salvo se possuir a Forma de Sabre apropriada indicada pela campanha."
        },
        "Visão Distante (Farseeing)": {
                        "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                        "descriptor": "—",
                        "text": "Tempo: Ação de rodada completa\nAlvo: Você\n\nVocê projeta seus sentidos pela Força para perceber eventos, pessoas ou lugares distantes. Faça uma verificação de Usar a Força. O resultado determina a clareza da visão e a distância simbólica que sua percepção consegue alcançar.",
                        "checks": [
                                        {
                                                        "cd": "15",
                                                        "effect": "Receba uma impressão vaga de uma pessoa ou local conhecido."
                                        },
                                        {
                                                        "cd": "20",
                                                        "effect": "Veja ou ouça uma cena breve ligada ao alvo da visão."
                                        },
                                        {
                                                        "cd": "25",
                                                        "effect": "Receba detalhes claros sobre o local, pessoa ou evento observado."
                                        },
                                        {
                                                        "cd": "30",
                                                        "effect": "Receba uma visão ampla, com contexto emocional e sinais de perigo iminente."
                                        }
                        ],
                        "special": "Visões podem ser simbólicas, fragmentadas ou influenciadas por forte presença na Força. Um vínculo pessoal com o alvo facilita a interpretação."
        },
        "Voo do Hawk-bat (Hawk-Bat Swoop)": {
                        "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                        "descriptor": "[Forma de Sabre]",
                        "text": "Tempo: Ação padrão\nAlvo: Um inimigo ao alcance após seu deslocamento\n\nVocê salta ou avança como um hawk-bat mergulhando sobre a presa, usando a Força para guiar um ataque veloz com sabre de luz. Faça uma verificação de Usar a Força e mova-se antes do ataque conforme o resultado.",
                        "checks": [
                                        {
                                                        "cd": "20",
                                                        "effect": "Mova-se até 2 quadrados e faça um ataque com sabre de luz contra o alvo."
                                        },
                                        {
                                                        "cd": "25",
                                                        "effect": "Mova-se até 4 quadrados e faça o ataque; esse movimento não provoca ataques de oportunidade do alvo."
                                        },
                                        {
                                                        "cd": "30",
                                                        "effect": "Mova-se até 6 quadrados, faça o ataque e cause +1 dado de dano se acertar."
                                        }
                        ],
                        "special": "Exige sabre de luz ativado. Forma de Sabre (Ataru): se você tiver a aptidão Ataru, pode gastar 1 Ponto da Força para tratar o ataque como investida sem sofrer a penalidade normal na Defesa de Reflexos."
        },
        "Cobertura Vantajosa (Advantageous Cover)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Quando você tem cobertura contra um ataque, recebe +2 de bônus de circunstância na Defesa de Reflexos contra esse ataque. Esse bônus se soma ao bônus normal de cobertura.\n\nNormal: Cobertura concede o bônus normal à Defesa de Reflexos, sem este bônus adicional."
        },
        "Combate Montado (Mounted Combat)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Treinado em Pilotar.\n\nBenefício: Uma vez por rodada, quando sua montaria for atingida em combate, você pode fazer uma verificação de Pilotar como reação. Se o resultado da sua verificação for maior que a jogada de ataque do oponente, o ataque erra a montaria. Você precisa estar montado e consciente do ataque para usar este benefício."
        },
        "Combate Veicular (Vehicular Combat)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Treinado em Pilotar.\n\nBenefício: Uma vez por rodada, quando o veículo que você pilota for atingido por um ataque, você pode fazer uma verificação de Pilotar como reação. Se o resultado da sua verificação for maior que a jogada de ataque do atacante, o ataque erra o veículo. Você precisa estar pilotando o veículo e capaz de reagir ao ataque."
        },
        "Combatente Imparável (Unstoppable Combatant)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisito: Limiar de Dano Aprimorado.\n\nBenefício: Quando você sofre dano que iguala ou supera seu limiar de dano, pode gastar uma reação para reduzir em 1 o número de passos que desceria na trilha de condição. Se o efeito faria você descer apenas 1 passo, você não desce nenhum passo por esse dano."
        },
        "Combo de Ataque (À Distância) (Attack Combo (Ranged))": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Bônus base de ataque +3.\n\nBenefício: Se você acertar um mesmo alvo com dois ataques à distância consecutivos durante o mesmo turno, qualquer ataque à distância adicional que você fizer contra esse alvo até o fim do seu próximo turno causa +1 dado de dano se acertar. Esse dano extra se acumula com dados extras concedidos por outros Talentos ou Aptidões."
        },
        "Combo de Ataque (Corpo a Corpo) (Attack Combo (Melee))": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Bônus base de ataque +3.\n\nBenefício: Se você acertar um mesmo alvo com dois ataques corpo a corpo ou desarmados consecutivos durante o mesmo turno, qualquer ataque corpo a corpo ou desarmado adicional que você fizer contra esse alvo até o fim do seu próximo turno causa +1 dado de dano se acertar. Esse dano extra se acumula com dados extras concedidos por outros Talentos ou Aptidões."
        },
        "Combo de Ataque (Disparar e Golpear) (Attack Combo (Fire and Strike))": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisitos: Combo de Ataque (Corpo a Corpo), Combo de Ataque (À Distância), bônus base de ataque +9.\n\nBenefício: Se você acertar um mesmo alvo com dois ataques consecutivos durante o mesmo turno, usando qualquer combinação de ataques à distância, corpo a corpo ou desarmados, qualquer ataque adicional que você fizer contra esse alvo até o fim do seu turno causa +1 dado de dano se acertar. Esse benefício inclui ataques de oportunidade e ataques feitos como reação."
        },
        "Condicionamento (Conditioning)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Você recebe +5 de bônus de competência em verificações de Resistência. Esse bônus representa treino físico, controle respiratório e preparo para esforço prolongado."
        },
        "Condutor de Banthas (Bantha Herder)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Proficiência com a arma usada, bônus base de ataque +1.\n\nBenefício: Quando você causa dano a uma criatura Grande ou menor com um ataque à distância, compare o resultado da sua jogada de ataque com a Defesa de Vontade do alvo. Se o resultado igualar ou superar essa Defesa, você pode mover o alvo 1 quadrado em qualquer direção como ação livre. Se o ataque causar dano a múltiplas criaturas elegíveis, você pode aplicar esse benefício a cada uma delas. Você não pode mover um alvo agarrado, preso em agarrão, para dentro de objeto sólido ou para dentro do espaço de luta de outra criatura."
        },
        "Conhecimento de Droides (Droidcraft)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisito: Treinado em Mecânica.\n\nBenefício: Você recebe +5 de bônus de competência em verificações de Conhecimento relacionadas a droides, modelos de droides, sistemas de droides e funcionamento de chassis. Quando fizer uma verificação de Mecânica para reparar, modificar ou diagnosticar um droide, pode usar esse conhecimento para reconhecer características incomuns, limitações do modelo e alterações instaladas."
        },
        "Conhecimento dos Anciões (Elder’s Knowledge)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Idade adulta avançada ou característica equivalente aprovada para a espécie.\n\nBenefício: Escolha uma perícia de Conhecimento. Você recebe +5 de bônus de competência nas verificações dessa perícia. Uma vez por encontro, você pode repetir uma verificação dessa perícia de Conhecimento e ficar com o melhor resultado."
        },
        "Construtor Naval Mon Calamari (Mon Calamari Shipwright)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Espécie Mon Calamari.\n\nBenefício: Você recebe +5 de bônus de competência em verificações de Mecânica feitas para construir, modificar, reparar ou diagnosticar veículos aquáticos, espaçonaves e sistemas navais ou espaciais. Quando participa do projeto de uma nave ou veículo, pode reduzir erros de construção, melhorar a integração dos sistemas e identificar falhas estruturais durante o trabalho."
        },
        "Contra-Agarrão (Grab Back)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Força 13, Treinado em Acrobacia ou Iniciativa.\n\nBenefício: Quando uma criatura erra uma tentativa de agarrar você, você pode fazer uma tentativa de agarrar contra essa criatura como reação. Se tiver sucesso, você se torna o agressor do agarrão. Esse benefício só pode ser usado contra uma criatura ao seu alcance corpo a corpo."
        },
        "Conversão de Dano (Damage Conversion)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: Droide, Destreza 13.\n\nBenefício: Quando você sofre dano de um ataque que não seja ataque de área, dano iônico ou dano da Força, e esse dano iguala ou supera seu limiar de dano, pode sofrer 10 pontos de dano adicionais para não descer na trilha de condição. Cada uso adicional deste Talento no mesmo encontro aumenta o dano adicional em 5 pontos."
        },
        "Cortar a Burocracia (Cut the Red Tape)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Treinado em Persuasão.\n\nBenefício: Quando você faz uma verificação de Persuasão ou Conhecimento (burocracia) para lidar com oficiais, formulários, autorizações, licenças, inspeções ou procedimentos administrativos, pode repetir a verificação e ficar com o melhor resultado. Você também reduz pela metade o tempo necessário para obter aprovações burocráticas comuns quando tem acesso aos canais adequados."
        },
        "Crítico Triplo (Triple Crit)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Proficiência com a arma escolhida, Foco em Arma com a arma escolhida, bônus base de ataque +8.\n\nBenefício: Escolha uma arma específica. Quando você obtém um acerto crítico com essa arma, causa dano triplo em vez de dano dobrado.\n\nEspecial: Você pode escolher este Talento mais de uma vez. Cada vez que escolher, ele se aplica a uma arma diferente."
        },
        "Cura Regenerativa (Regenerative Healing)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Espécie Trandoshana.\n\nBenefício: Quando você usa seu segundo fôlego, recupera pontos de vida adicionais iguais ao seu modificador de Constituição, mínimo +1. Se estiver sob cuidados médicos ou repouso prolongado, sua recuperação natural também recebe esse bônus em cada período de cura aplicável."
        },
        "Dádiva da Força (Force Boon)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Sensibilidade à Força.\n\nBenefício: Você recebe 3 Pontos da Força adicionais em cada nível. Esses pontos são adicionados ao total que você normalmente recebe ao ganhar um novo nível."
        },
        "Dano Colateral (Collateral Damage)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisito: Droide.\n\nBenefício: Quando você erra um ataque à distância contra um alvo que recebe cobertura de outro alvo, pode comparar a mesma jogada de ataque com a Defesa de Reflexos da criatura ou objeto que concedia cobertura. Se o resultado igualar ou superar essa Defesa, esse alvo de cobertura sofre o dano do ataque. Esse benefício se aplica apenas quando a linha de tiro realmente passa pela cobertura."
        },
        "Defensor Cauteloso (Wary Defender)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Quando você usa a ação lutar defensivamente, recebe +2 de bônus de competência na Defesa de Fortitude e na Defesa de Vontade até o início do seu próximo turno."
        },
        "Defesa Acrobática (Tumble Defense)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisitos: Destreza 13, treinado em Acrobacia.\n\nBenefício: Quando você usa Acrobacia para evitar ataques de oportunidade ao se mover por áreas ameaçadas, recebe +5 de bônus de competência nessa verificação. Se a verificação for bem-sucedida, você também recebe +2 de bônus de esquiva na Defesa de Reflexos contra o primeiro ataque feito contra você antes do início do seu próximo turno."
        },
        "Defesa Brilhante (Brilliant Defense)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Inteligência 13.\n\nBenefício: Uma vez por encontro, como reação, você pode somar seu bônus de Inteligência à sua Defesa de Reflexos contra um ataque. Você precisa estar ciente do ataque e capaz de reagir. O bônus se aplica apenas ao ataque que desencadeou a reação."
        },
        "Defesa Corpo a Corpo (Melee Defense)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Inteligência 13.\n\nBenefício: Quando fizer um ataque corpo a corpo, você pode escolher sofrer uma penalidade de até −5 na jogada de ataque e receber o mesmo valor como bônus de esquiva na Defesa de Reflexos até o início do seu próximo turno. O valor escolhido não pode exceder seu bônus base de ataque.\n\nNormal: Um personagem não pode converter precisão de ataque corpo a corpo em defesa dessa forma."
        },
        "Defesa Instintiva (Instinctive Defense)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisito: Não ser droide.\n\nBenefício: Como reação, você pode gastar 1 Ponto da Força para receber +2 de bônus em todas as Defesas por 1 rodada. Esse bônus representa uma resposta imediata guiada por instinto e percepção sobrenatural."
        },
        "Defesa Montada (Mounted Defense)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Combate Montado, treinado em Pilotar.\n\nBenefício: Enquanto estiver montado, você pode aplicar o benefício de Combate Montado a ataques feitos contra você ou contra sua montaria. Quando fizer a verificação de Pilotar para negar o ataque, use o mesmo procedimento de Combate Montado."
        },
        "Defesa Preditiva (Predictive Defense)": {
                "source": "Star Wars Saga Edition Wiki-Fandom",
                "text": "Pré-requisito: Inteligência 13.\n\nBenefício: Você pode usar seu modificador de Inteligência no lugar do modificador de Destreza para determinar sua Defesa de Reflexos. Essa escolha reflete antecipação tática, leitura de padrões e posicionamento cuidadoso."
        },
        "Defesas Aprimoradas (Improved Defenses)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Você recebe +1 de bônus em todas as suas Defesas: Reflexos, Fortitude e Vontade."
        },
        "Derrubar (Trip)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Bônus base de ataque +1.\n\nBenefício: Se você estiver agarrando um oponente, pode tentar derrubá-lo. Faça a tentativa conforme as regras de agarrão. Se tiver sucesso, o alvo cai prostrado no espaço dele.\n\nNormal: Sem este Talento, você pode agarrar o alvo, mas não usa essa manobra especial para derrubá-lo durante o agarrão."
        },
        "Desafio de Perícia: Evasão Catastrófica (Skill Challenge: Catastrophic Avoidance)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Participar de desafios de perícia.\n\nBenefício: Uma vez por desafio de perícia, quando você falharia em uma verificação por 5 ou mais, pode gastar 1 Ponto da Força para transformar essa falha em uma falha comum. Esse benefício ajuda a evitar consequências agravadas em cenas de tensão, perseguição, infiltração, negociação ou crise técnica."
        },
        "Desafio de Perícia: Recuperação (Skill Challenge: Recovery)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Participar de desafios de perícia.\n\nBenefício: Uma vez por desafio de perícia, depois que você ou um aliado obtiver uma falha em uma verificação do desafio, você pode gastar 1 Ponto da Força para permitir uma nova verificação apropriada como tentativa de recuperação. Se a nova verificação tiver sucesso, ela reduz o impacto da falha anterior conforme as regras do desafio."
        },
        "Desafio de Perícia: Último Recurso (Skill Challenge: Last Resort)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Participar de desafios de perícia.\n\nBenefício: Uma vez por desafio de perícia, quando o grupo estiver a uma falha de perder o desafio, você pode gastar 1 Ponto da Força antes de fazer uma verificação. Se essa verificação tiver sucesso, ela conta como um sucesso adicional para o desafio."
        },
        "Desarmar Aprimorado (Improved Disarm)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Inteligência 13, Defesa Corpo a Corpo.\n\nBenefício: Você recebe +5 de bônus em jogadas de ataque feitas para desarmar um oponente. Se a tentativa falhar, o alvo não pode tentar desarmar você como reação à sua falha.\n\nNormal: Uma tentativa de desarme falha pode permitir que o defensor tente desarmar você em resposta."
        },
        "Descendente de Dorin (Scion of Dorin)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Espécie Kel Dor.\n\nBenefício: Você recebe +5 de bônus de espécie em verificações e Defesas contra atmosferas hostis, gases, vapores, fumaça, venenos inalados e efeitos ambientais ligados à respiração. Esse benefício se soma às proteções naturais e ao equipamento respiratório adequado."
        },
        "Determinação Inabalável (Unswerving Resolve)": {
                "source": "Star Wars Saga Edition Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Você recebe +5 de bônus de competência em verificações para resistir a tentativas de mudar sua atitude, intimidá-lo, desviá-lo de uma missão assumida ou forçá-lo a abandonar uma decisão tomada. Esse bônus se aplica a usos apropriados de Persuasão, Enganação ou efeitos semelhantes que pressionem sua vontade."
        },
        "Disparo de Artilharia (Artillery Shot)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Proficiência com a arma usada.\n\nBenefício: Quando você faz um ataque com uma arma de explosão ou dispersão contra um alvo além do alcance à queima-roupa, pode afetar dois quadrados adicionais adjacentes à área normal de explosão ou dispersão. Esses quadrados precisam tocar a área original e estar dentro da linha de efeito do ataque."
        },
        "Disparo Poderoso (Power Blast)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Força 13, Tiro à Queima-Roupa.\n\nBenefício: Antes de fazer um ataque à distância, você pode escolher sofrer uma penalidade na jogada de ataque e somar o mesmo valor ao dano se o ataque acertar. A penalidade não pode exceder seu bônus base de ataque. Esse benefício funciona apenas com armas à distância que causem dano direto."
        },
        "Dispositivo Característico (Signature Device)": {
                "source": "Star Wars Saga Edition Scum and Villainy / Wiki-Fandom",
                "text": "Pré-requisito: Treinado em Mecânica.\n\nBenefício: Escolha um dispositivo, arma, armadura, veículo ou equipamento específico de sua posse. Você recebe +2 de bônus de competência em verificações de perícia feitas para usar, reparar, modificar ou manter esse item. O item escolhido também recebe +2 em sua Defesa de Fortitude contra tentativas de danificá-lo ou sabotá-lo."
        },
        "Droide Distraidor (Distracting Droid)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisito: Droide.\n\nBenefício: Como ação padrão, faça uma verificação de Persuasão contra a Defesa de Vontade de todos os inimigos a até 6 quadrados que possam ver ou ouvir você. Cada inimigo cuja Defesa de Vontade seja igualada ou superada perde uma ação de movimento no próximo turno. Se o resultado superar a Defesa de Vontade de um inimigo por 10 ou mais, esse inimigo também fica desprevenido até o início do seu próximo turno. Este é um efeito de afeta a mente."
        },
        "Encurralado (Cornered)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Quando você estiver adjacente a dois ou mais inimigos, ou quando não tiver caminho livre para se afastar de um inimigo adjacente, recebe +2 de bônus de moral em jogadas de ataque corpo a corpo e +2 de bônus de moral na Defesa de Vontade até deixar de estar encurralado."
        },
        "Engenhoqueiro (Gearhead)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Você recebe +2 de bônus de competência em verificações de Mecânica e Usar Computadores. Esse bônus representa familiaridade prática com máquinas, códigos, circuitos, reparos e sistemas técnicos."
        },
        "Enxamear (Swarm)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Quando você estiver adjacente a um inimigo e pelo menos um aliado também estiver adjacente a esse mesmo inimigo, você recebe +1 de bônus nas jogadas de ataque corpo a corpo contra ele. Se dois ou mais aliados estiverem adjacentes ao mesmo alvo, o bônus aumenta para +2."
        },
        "Equipe Ágil (Nimble Team)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Você recebe +2 de bônus de competência em verificações de Acrobacia. Para cada aliado a até 12 quadrados que também possua este Talento e possa ver ou ouvir você, esse bônus aumenta em +1, até o máximo de +5."
        },
        "Equipe de Slicers (Slicer Team)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Você recebe +2 de bônus de competência em verificações de Usar Computadores. Para cada aliado a até 12 quadrados que também possua este Talento e possa se comunicar com você, esse bônus aumenta em +1, até o máximo de +5."
        },
        "Equipe Médica (Medical Team)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Você recebe +2 de bônus de competência em verificações de Tratar Ferimentos. Para cada aliado a até 12 quadrados que também possua este Talento e possa ajudar no atendimento, esse bônus aumenta em +1, até o máximo de +5."
        },
        "Escalador Seguro (Sure Climber)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Espécie Sullustana.\n\nBenefício: Você ganha deslocamento de escalada de 4 quadrados. Quando escala, pode se mover sem fazer verificações de Escalar para superfícies comuns que ofereçam apoios adequados, e recebe +5 de bônus de espécie em verificações de Escalar em superfícies difíceis."
        },
        "Escudo de Carne (Meat Shield)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Tiro à Queima-Roupa, Tiro Preciso, bônus base de ataque +4.\n\nBenefício: Quando um inimigo recebe cobertura de uma criatura entre você e ele, você pode usar essa cobertura contra o próprio alvo. Ao atacar esse inimigo, você recebe um bônus de cobertura na sua Defesa de Reflexos igual ao bônus de cobertura que ele recebe contra o seu ataque até o início do seu próximo turno."
        },
        "Esmagador de Ossos (Bone Crusher)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Esmagar, Imobilizar.\n\nBenefício: Quando você causa dano a um oponente que está agarrando ou imobilizando, esse oponente desce −1 passo na trilha de condição além do dano normal. Esse efeito representa pressão direta sobre articulações, ossos e pontos vulneráveis."
        },
        "Esmagamento do Rancor (Rancor Crush)": {
                "source": "Star Wars Saga Edition Wiki-Fandom",
                "text": "Pré-requisitos: Força 15, Esmagar, Imobilizar, bônus base de ataque +1.\n\nBenefício: Quando usa o Talento Esmagar contra um oponente imobilizado, você também move o alvo −1 passo na trilha de condição. Esse passo se acumula com outros efeitos que o ataque ou agarrão causem ao mesmo alvo."
        },
        "Esmagar (Crush)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Imobilizar, bônus base de ataque +1.\n\nBenefício: Se você estiver imobilizando um oponente, pode causar seu dano desarmado ou de garra ao alvo como ação padrão. O dano é resolvido normalmente e mantém as demais regras de agarrão e imobilização."
        },
                "Espacial Veterano (Veteran Spacer)": {
            category: 'Talentos',
            source: "Star Wars Saga Edition Rebellion Era Campaign Guide / Wiki-Fandom",
            sourceUrl: "https://swse.fandom.com/wiki/Veteran_Spacer",
            text: `Pré-requisito: Duros.

Benefício: Você recebe +5 de bônus de espécie em testes de Usar Computadores feitos para Astrogation a bordo de uma nave estelar.`
        },
        "Recuperar o Fôlego (Second Wind)": {
                "source": "Guia de Cura Star Wars RPG - Edição Saga",
                "text": "Categoria: Cura\n\nTipo: Recuperação básica sem item.\n\nRegra: Uma vez por dia, quando você estiver com menos da metade de seus Pontos de Vida totais, pode usar uma ação padrão para recuperar o fôlego.\n\nEfeito: Você recupera Pontos de Vida iguais a 1/4 do seu total de Pontos de Vida ou um valor baseado no seu nível, usando o maior valor.\n\nClasses, talentos ou outros recursos podem permitir usos adicionais de Recuperar o Fôlego."
        },
        "Cura Natural (Descanso)": {
                "source": "Guia de Cura Star Wars RPG - Edição Saga",
                "text": "Categoria: Cura\n\nTipo: Recuperação básica sem item.\n\nRegra: O corpo recupera Pontos de Vida por meio de descanso.\n\nDescanso de 8 horas: Você recupera metade do total de seus Pontos de Vida.\n\nDescanso de 24 horas: Você recupera totalmente seus Pontos de Vida."
        },
        "Primeiros Socorros": {
                "source": "Guia de Cura Star Wars RPG - Edição Saga",
                "text": "Categoria: Cura\n\nUso: Fechar feridas abertas no meio da batalha.\n\nRequisito: Exige um Medpac.\n\nAção: Rodada completa.\n\nCD: 15.\n\nEfeito: O alvo recupera Pontos de Vida iguais a 2 vezes o nível dele, mais 1 Ponto de Vida para cada ponto pelo qual a verificação superar a CD."
        },
        "Cirurgia": {
                "source": "Guia de Cura Star Wars RPG - Edição Saga",
                "text": "Categoria: Cura\n\nUso: Procedimento médico avançado para estabilizar o corpo, reparar ferimentos graves, restaurar Pontos de Vida e tratar condições persistentes.\n\nRequisito: Kit de Cirurgia.\n\nTempo: 1 hora de trabalho ininterrupto.\n\nCD: 30.\n\nEfeito: Com sucesso, o paciente recupera todos os Pontos de Vida.\n\nCondição persistente: Se a cirurgia for feita para tratar uma condição persistente causada por ferimento físico, trauma, veneno, radiação, doença ou dano corporal, uma cirurgia bem-sucedida também remove essa condição.\n\nSem treinamento: Um personagem que não seja treinado em Tratar Ferimentos pode tentar realizar a cirurgia, mas sofre –10 na verificação.\n\nSucesso excepcional: Se a verificação superar a CD por 10 ou mais, o paciente também sobe +1 passo na Trilha de Condição.\n\nFalha: Se a verificação falhar, o paciente recupera apenas Pontos de Vida iguais ao nível dele, e os recursos usados são perdidos.\n\nFalha grave: Se a verificação falhar por 5 ou mais, o paciente não recupera Pontos de Vida e recebe dano igual ao seu Limiar de Dano. Se esse dano reduzir seus Pontos de Vida a 0, ele morre.\n\nAutocirurgia: Você pode realizar cirurgia em si mesmo, mas sofre –5 na verificação de Tratar Ferimentos e não pode obter o benefício de sucesso excepcional."
        },
        "Reanimar": {
                "source": "Guia de Cura Star Wars RPG - Edição Saga",
                "text": "Categoria: Cura\n\nUso: Trazer alguém de volta do limiar da morte.\n\nAção: Rodada completa.\n\nTempo limite: Deve ser feito na rodada seguinte à morte.\n\nCD: 30.\n\nEfeito: Se a verificação tiver sucesso, o personagem fica inconsciente em vez de morto."
        },
        "Injetor de Adrenalina": {
                "source": "Guia de Cura Star Wars RPG - Edição Saga",
                "text": "Categoria: Cura\n\nTipo: Equipamento médico.\n\nDescrição: Estimulante químico usado para ignorar dor e manter o corpo em atividade extrema por pouco tempo.\n\nAção: Rápida.\n\nEfeito: Por 3 rodadas, você ignora todas as penalidades da Trilha de Condição e ganha uma ação total extra por turno.\n\nCusto: Ao final do efeito, você desce 2 passos na Trilha de Condição automaticamente pelo cansaço.\n\nPreço: 250 créditos."
        },
        "Microrrobôs de Reparação": {
                "source": "Guia de Cura Star Wars RPG - Edição Saga",
                "text": "Categoria: Cura\n\nTipo: Equipamento médico.\n\nDescrição: Cura automática aplicada ao alvo, permitindo que o médico continue atuando em combate.\n\nAção: Padrão para aplicar.\n\nEfeito: O alvo recupera 2 Pontos de Vida no início de cada turno dele por uma quantidade de rodadas igual ao bônus de Sabedoria do aplicador, mínimo de 1 rodada.\n\nEfeito adicional, CD 20: Se aplicado por um personagem treinado em Tratar Ferimentos, o alvo recupera 5 Pontos de Vida no início de cada turno dele pela mesma duração. Esse valor substitui a cura de 2 Pontos de Vida.\n\nPreço: 1200 créditos."
        },
        "Medpac de Combate": {
                "source": "Guia de Cura Star Wars RPG - Edição Saga",
                "text": "Categoria: Cura\n\nTipo: Equipamento médico.\n\nDescrição: Injeção rápida de bacta concentrado para uso em situação de combate.\n\nAção: Movimento. Se o personagem for treinado em Tratar Ferimentos, a ação é rápida.\n\nEfeito: Cura 2d8 + modificador de Sabedoria.\n\nBônus de especialista, CD 30: Se o personagem for treinado em Tratar Ferimentos, soma +1d6 à cura total, mais +1d6 adicional para cada 5 pontos pelos quais superar a CD.\n\nPreço: 1000 créditos."
        },
        "Medpac de Combate Avançado": {
                "source": "Guia de Cura Star Wars RPG - Edição Saga",
                "text": "Categoria: Cura\n\nTipo: Equipamento médico.\n\nDescrição: Cartucho pressurizado de bacta densa com seladores dérmicos.\n\nAção: Padrão. Se o personagem for treinado em Tratar Ferimentos, a ação é de movimento.\n\nEfeito: Cura 3d10 + modificador de Sabedoria.\n\nBônus de especialista, CD 30: Se o personagem for treinado em Tratar Ferimentos, soma +1d8 à cura total, mais +1d8 adicional para cada 5 pontos pelos quais superar a CD.\n\nPreço: 1500 créditos."
        },
                "Especialista da Natureza (Nature Specialist)": {
            category: 'Talentos',
            source: "Star Wars Saga Edition Rebellion Era Campaign Guide / Wiki-Fandom",
            sourceUrl: "https://swse.fandom.com/wiki/Nature_Specialist",
            text: `Pré-requisito: Ithoriano.

Benefício: Sempre que gastar um Ponto da Força para somar a um teste de Conhecimento (ciências da vida), aumente o tipo de dado do Ponto da Força em dois passos: de d6 para d10, ou de d8 para d12.`
        },
                "Especialista em Artilharia (Gunnery Specialist)": {
            category: 'Talentos',
            source: "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
            sourceUrl: "https://swse.fandom.com/wiki/Gunnery_Specialist",
            text: `Pré-requisito: Bônus base de ataque +1.

Benefício: Enquanto atuar como artilheiro de um veículo, você é considerado proficiente com armas veiculares. Além disso, uma vez por encontro, pode rolar novamente uma jogada de ataque feita com uma arma veicular. Você deve manter o segundo resultado, mesmo que seja pior. Pode declarar essa nova rolagem depois de saber o resultado da jogada de ataque, mas antes de resolver o dano.

                "Especialista em Biotecnologia (Biotech Specialist)": {
            category: 'Talentos',

            sourceUrl: "https://swse.fandom.com/wiki/Biotech_Specialist",
            text: `Pré-requisito: Treinado em Mecânica.

Benefício: Você pode modificar um dispositivo biotecnológico, armadura, arma ou veículo para conceder a ele uma característica específica. Só pode realizar uma modificação por vez. Salvo indicação em contrário, você não pode conceder mais de um benefício ao mesmo dispositivo, armadura, arma ou veículo, e não pode aplicar o mesmo benefício mais de uma vez.

Antes de iniciar a modificação, você deve pagar um décimo do custo do item a ser modificado, ou 1.000 créditos, o que for maior. A modificação exige 1 dia para cada 1.000 créditos do custo da modificação. Ao fim desse período, faça um teste de Mecânica CD 20; você não pode escolher 10 nem escolher 20 nesse teste. Se tiver sucesso, a modificação é concluída e o objeto recebe a característica desejada. Se falhar, os créditos gastos são perdidos e o objeto não recebe a característica, embora você possa começar de novo.

Devido à natureza especializada da biotecnologia, apenas personagens com Especialista em Biotecnologia podem auxiliá-lo. Eles reduzem proporcionalmente o tempo necessário e, ao fim do processo, podem fazer um teste de Mecânica para ajudar no seu teste.

O valor de mercado de um item modificado é igual ao custo base do item mais o dobro do custo das modificações feitas nele, sem contar créditos perdidos em tentativas fracassadas.

Características de Armadura:
Armadura Ágil: o bônus máximo de Destreza da armadura aumenta em 1.
Armadura Fortificante: o bônus de equipamento da armadura à Defesa de Fortitude aumenta em 1.
Armadura Protetora: o bônus de armadura à Defesa de Reflexos aumenta em 1.

Características de Dispositivo:
Adicionar Dispositivo à Criatura: altera uma criatura bioengenheirada para aceitar um aprimoramento biotecnológico ou tecnológico padrão, como um pacote de sensores miniaturizado.
Força Aprimorada: aumenta o valor de Força do dispositivo em 2.
Durabilidade Aprimorada: a Redução de Dano do dispositivo aumenta em 1, e ele recebe Pontos de Vida extras iguais a um quarto de seus Pontos de Vida máximos.
Dispositivo Obra-prima: testes de perícia feitos usando o dispositivo recebem +1 de bônus de equipamento, ou o bônus de equipamento já existente aumenta em 1.

Características de Veículo:
Aprimoramento de Dovin Basal: aumenta os efeitos de um dovin basal para conceder um dos seguintes benefícios a uma nave: +1 quadrado adicional de movimento em escala de nave, +2 de SR, ou +1 dado de dano ao usar um dovin basal.
Destreza Aprimorada: aumenta o valor de Destreza do veículo em 2.
Velocidade Aprimorada: aumenta a velocidade do veículo em um quarto da velocidade base, mínimo de 1 quadrado.

Características de Arma:
Precisão Aprimorada: a arma recebe +1 de bônus de equipamento em jogadas de ataque.
Dano Aprimorado: a arma causa +2 pontos de dano em um acerto. Se a arma possui multiplicador de dano, aplique o dano extra antes do multiplicador.
Fogo Seletivo: uma arma à distância apenas de fogo automático pode ser configurada para disparos únicos, ou uma arma de disparo único pode receber modo de fogo automático. Isso não pode ser aplicado a armas com raio de explosão ou raio de respingo.

Especial: Este Talento permite fazer testes de Tratar Ferimentos em biotecnologia sem a penalidade normal de -5.`
        },

Especial: Este Talento não se aplica a armas veiculares nem armas pesadas. Você deve estar com a arma em mãos para usar este Talento. Pode escolher este Talento várias vezes. Cada vez que escolher, aplique-o a um grupo de armas ou arma exótica diferente.

Efeito combinado com Reflexos de Combate: você pode usar este Talento um número de vezes por encontro igual ao seu bônus de Destreza, mas nunca mais de uma vez durante o turno de um mesmo inimigo.`
        },
                "Fogo de Supressão (Suppression Fire)": {
            category: 'Talentos',
            source: "Star Wars Saga Edition Threats of the Galaxy / Wiki-Fandom",
            sourceUrl: "https://swse.fandom.com/wiki/Suppression_Fire",
            text: `Pré-requisitos: Força 13, Fogo em Rajada, Proficiência com Arma (armas pesadas).

        },
                "Fogo em Investida (Charging Fire)": {
            category: 'Talentos',
            source: "Star Wars Saga Edition Core Rulebook / Knights of the Old Republic Campaign Guide / Wiki-Fandom",
            sourceUrl: "https://swse.fandom.com/wiki/Charging_Fire",
            text: `Pré-requisito: Bônus base de ataque +4.

        },
                "Fogo em Rajada (Burst Fire)": {
            category: 'Talentos',
            source: "Star Wars Saga Edition Core Rulebook / Starships of the Galaxy / Wiki-Fandom",
            sourceUrl: "https://swse.fandom.com/wiki/Burst_Fire",
            text: `Pré-requisito: Proficiente com armas pesadas.

Benefício: Ao usar uma arma à distância com capacidade de fogo automático, e com a qual você seja proficiente, em modo de fogo automático, você pode disparar uma rajada curta como um único ataque contra um único alvo. Você sofre -5 de penalidade na jogada de ataque, mas causa +2 dados de dano.

Os efeitos deste Talento não se acumulam com o dano extra concedido por Olho Morto ou Tiro Rápido.

Se você não tiver Força 13 ou maior, a penalidade aumenta para -10 ao usar este Talento com armas que não sejam veiculares.

Especial: Disparar uma rajada gasta cinco disparos e só pode ser feito se a arma ainda tiver pelo menos cinco disparos restantes.

Efeito adicional em armas veiculares: armas veiculares capazes de fogo automático podem ser usadas normalmente com este Talento. Os dados adicionais de dano são somados antes de qualquer multiplicador da arma veicular.`

            sourceUrl: "https://swse.fandom.com/wiki/Force_of_Personality",

            sourceUrl: "https://swse.fandom.com/wiki/Tool_Frenzy",

            text: `Pré-requisitos: Táticas de Nave, Combate Veicular, treinado em Pilotar.

                "Golpe Acelerado (Accelerated Strike)": {
            category: 'Talentos',

            sourceUrl: "https://swse.fandom.com/wiki/Accelerated_Strike",
            text: `Pré-requisito: Bônus base de ataque +6.

        "Golpe Acrobático (Acrobatic Strike)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Treinado em Acrobacia.\n\nBenefício: Se você usar Acrobacia para atravessar o espaço ameaçado de um oponente e passar por ele com sucesso, recebe +2 de bônus de competência na próxima jogada de ataque que fizer contra esse oponente antes do fim do seu turno."
        },
        "Golpe Crítico (Critical Strike)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +9, Foco em Arma com a arma escolhida.\n\nBenefício: Escolha uma arma para a qual possua Foco em Arma. Com essa arma, você amplia a ameaça de crítico de um ataque, aumentando a chance de transformar uma jogada alta em acerto crítico."
        },
        "Golpe de Haste Longa (Long Haft Strike)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "text": "Pré-requisitos: Nenhum.\n\nBenefício: Você pode usar certas armas de haste longa como armas duplas. Ao fazê-lo, trata extremidades da arma como partes distintas para ataques compatíveis com armas duplas e estilos de luta relacionados."
        },
        "Golpe de Impulso (Momentum Strike)": {
                "source": "Star Wars Saga Edition Threats of the Galaxy / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado em Pilotar ou Cavalgar.\n\nBenefício: Quando ataca enquanto conduz uma montaria, speeder bike ou veículo adequado, você usa o peso e a velocidade do movimento para fortalecer o golpe, aumentando o impacto do ataque."
        },
        "Golpe de Retirada (Withdrawal Strike)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "text": "Pré-requisito: Bônus base de ataque +5.\n\nBenefício: Inimigos adjacentes a você não podem usar a ação Retirar para deixar seu alcance com segurança. Eles ainda podem se mover, mas provocam ataques de oportunidade normalmente se o movimento permitir."
        },
        "Golpe Debilitante (Hobbling Strike)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Ataque Furtivo, Tiro Rápido ou Golpe Rápido.\n\nBenefício: Quando você acerta um ataque que receberia dano extra por um dos pré-requisitos, pode abrir mão desse dano extra para reduzir o deslocamento do alvo. A penalidade de deslocamento representa ferimentos nas pernas, desequilíbrio ou limitação de movimento."
        },
        "Golpe Desmoralizante (Demoralizing Strike)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisito: Carisma 13.\n\nBenefício: Quando você causa dano com um ataque de oportunidade, pode fazer uma verificação de Persuasão para intimidar o alvo. Se tiver sucesso, o golpe abala a confiança do inimigo e prejudica sua atuação imediata."
        },
        "Golpe Perverso (Wicked Strike)": {
                "source": "Star Wars Saga Edition Scum and Villainy / Wiki-Fandom",
                "text": "Pré-requisito: Golpe Rápido.\n\nBenefício: Quando você causa dano a um alvo com um ataque único que não seja ataque de área usando Golpe Rápido, uma vez por turno no seu turno, pode fazer imediatamente um segundo ataque com –2 de penalidade contra outro alvo ao seu alcance. Se acertar, causa metade do dano do ataque original a esse segundo alvo."
        },
        "Golpe Poderoso (Mighty Swing)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Força 13.\n\nBenefício: Antes de fazer um ataque corpo a corpo, você pode gastar duas ações rápidas na mesma rodada para preparar um golpe pesado. Se o ataque acertar, causa +1 dado de dano. Esse benefício não se acumula com o dano extra de Golpe Rápido."
        },
        "Golpe Rápido (Rapid Strike)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Bônus base de ataque +1.\n\nBenefício: Ao usar uma arma corpo a corpo com a qual seja proficiente, você pode fazer dois golpes como um único ataque contra um alvo. Você sofre –2 de penalidade na jogada de ataque, mas causa +1 dado de dano se acertar.\n\nEspecial: Esse dano extra não se acumula com Golpe Poderoso. Se você não tiver Destreza 13 ou maior, a penalidade aumenta para –5 ao usar este talento com armas que não sejam leves."
        },
        "Golpe Rápido Aprimorado (Improved Rapid Strike)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Golpe Rápido.\n\nBenefício: Ao usar Golpe Rápido com uma arma corpo a corpo leve, você pode sofrer –5 de penalidade na jogada de ataque para causar +2 dados de dano se acertar, em vez do benefício normal de Golpe Rápido."
        },
        "Golpe Sádico (Sadistic Strike)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Ataque Furtivo ou outro recurso que conceda dano extra contra alvos desprevenidos.\n\nBenefício: Quando você causa dano extra a um alvo desprevenido ou incapaz de reagir plenamente, pode abrir mão de parte do dano extra para mover o alvo –1 passo na Trilha de Condição. Esse efeito representa ferimentos cruéis, pressão psicológica e exploração de pontos vulneráveis."
        },
        "Golpeador (Slammer)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Força 13.\n\nBenefício: Quando você empurra, arremessa ou desloca um inimigo com um ataque corpo a corpo, o alvo sofre dano adicional se colidir com uma parede, objeto sólido, veículo, criatura ou outra barreira apropriada. O deslocamento precisa ser causado pelo seu ataque ou manobra."
        },
        "Golpeador Pesado (Heavy Hitter)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Força 15, Golpeador.\n\nBenefício: Quando seu ataque corpo a corpo causa dano a um alvo e também o move contra uma superfície sólida ou obstáculo, o dano da colisão aumenta. Se o alvo for empurrado contra outro inimigo, ambos podem sofrer o impacto conforme a posição e a linha de movimento."
        },
        "Guerreiro de Trincheira (Trench Warrior)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Tiro à Queima-Roupa.\n\nBenefício: Você recebe vantagem tática em combate a curta distância dentro de corredores, trincheiras, bunkers, passarelas estreitas e áreas de cobertura pesada. Quando estiver adjacente a cobertura ou em espaço apertado, recebe +1 de bônus nas jogadas de ataque com armas à distância contra alvos a até 6 quadrados."
        },
        "Guerreiro Impiedoso (Pitiless Warrior)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Quando você reduz um inimigo a 0 Pontos de Vida ou o move para baixo na Trilha de Condição com um ataque corpo a corpo, recebe +2 de bônus de moral na próxima jogada de ataque corpo a corpo feita antes do fim do seu próximo turno."
        },
        "Guerreiro Primitivo (Primitive Warrior)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Proficiência com armas simples.\n\nBenefício: Você recebe +1 de bônus nas jogadas de ataque e +1 de bônus nas rolagens de dano com armas primitivas, armas simples de baixa tecnologia e ataques naturais apropriados à sua espécie. Esse benefício se aplica quando a arma usada depende mais de força, técnica corporal e treinamento tradicional do que de sistemas avançados."
        },
        "Habitante da Escuridão (Darkness Dweller)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Visão no escuro ou adaptação natural a ambientes escuros.\n\nBenefício: Você recebe +5 de bônus de competência em verificações de Furtividade feitas em penumbra ou escuridão. Além disso, em ambientes escuros, pode repetir uma verificação de Percepção para notar criaturas escondidas, ficando com o segundo resultado."
        },
        "Herança Guerreira (Warrior Heritage)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Escolha uma arma ou grupo de armas ligado à tradição marcial de sua espécie, cultura ou ordem. Você recebe +1 de bônus em jogadas de ataque com essa arma ou grupo quando estiver usando equipamento apropriado à sua herança guerreira."
        },
        "Herança Jedi (Jedi Heritage)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "text": "Pré-requisito: Sensibilidade à Força.\n\nBenefício: Você recebe +2 de bônus de competência em verificações de Usar a Força feitas para sentir a Força, perceber distúrbios, reconhecer tradições Jedi ou resistir a efeitos ligados ao Lado Sombrio. Esse benefício representa treinamento, linhagem, tradição ou exposição prolongada aos ensinamentos Jedi."
        },
        "Hiperblaster (Hyperblazer)": {
                "source": "Star Wars Saga Edition Starships of the Galaxy / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado em Pilotar.\n\nBenefício: Você conhece rotas de alta velocidade, manobras de aceleração e procedimentos arriscados de navegação. Quando pilota um veículo ou nave em deslocamento extremo, recebe +2 de bônus de competência em verificações de Pilotar feitas para aumentar velocidade, manter controle ou evitar colisões durante aceleração intensa."
        },
        "Imobilizar (Pin)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Força 13, bônus base de ataque +1.\n\nBenefício: Se você estiver agarrando um oponente, pode tentar imobilizá-lo. Faça uma tentativa de agarrão contra o alvo. Se tiver sucesso, o alvo fica imobilizado até escapar ou até você soltar o agarrão. Enquanto mantém a imobilização, você também fica limitado pelas regras normais de agarrão."
        },
        "Incapacitar (Disabler)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado em Mecânica ou Usar Computadores.\n\nBenefício: Você recebe +2 de bônus em ataques ou verificações feitas para desativar, sabotar, desligar ou comprometer o funcionamento de droides, dispositivos eletrônicos e sistemas mecânicos. Quando causa dano iônico a um droide ou veículo, pode aplicar esse conhecimento para dificultar sua recuperação."
        },
        "Influência Duradoura (Lasting Influence)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado em Persuasão.\n\nBenefício: Quando você altera a atitude de uma criatura por meio de Persuasão, o efeito dura mais tempo que o normal. A criatura mantém a nova atitude enquanto as circunstâncias sociais continuarem compatíveis com o resultado obtido e enquanto você não agir contra os interesses evidentes dela."
        },
        "Informante (Informer)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado em Obter Informação.\n\nBenefício: Você pode usar Obter Informação em menos tempo e com menor exposição. Quando busca rumores, nomes, rotas, contatos ou atividades ilegais em uma comunidade, recebe +2 de bônus de competência na verificação e reduz o tempo necessário para obter respostas úteis."
        },
        "Inseto Retornante (Returning Bug)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Proficiência com a arma usada.\n\nBenefício: Quando arremessa uma arma própria de retorno, como um inseto treinado, lâmina exótica ou arma cultural equivalente, ela retorna à sua mão após o ataque se houver caminho livre e se você ainda puder segurá-la. Esse benefício se aplica apenas a armas apropriadas a esse uso."
        },
        "Instintos do Caçador (Hunter’s Instincts)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado em Sobrevivência.\n\nBenefício: Você recebe +2 de bônus de competência em verificações de Percepção e Sobrevivência feitas para rastrear, seguir, localizar ou antecipar o comportamento de uma presa. Quando está seguindo um alvo que já feriu ou observou diretamente, esse bônus aumenta para +5."
        },
        "Intimidador (Intimidator)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Carisma 13.\n\nBenefício: Você recebe +5 de bônus de competência em verificações de Persuasão feitas para intimidar. Esse benefício se aplica quando usa ameaça, presença, reputação, demonstração de força ou violência controlada para forçar hesitação, cooperação ou recuo."
        },
        "Intuição Perfeita (Perfect Intuition)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Sabedoria 13.\n\nBenefício: Uma vez por encontro, você pode repetir uma verificação de Percepção ou Iniciativa, ficando com o melhor resultado. Esse benefício representa leitura instintiva da situação, percepção de pequenos sinais e resposta imediata antes que o perigo se manifeste por completo."
        },
        "Investida Aprimorada (Improved Charge)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Quando faz uma investida, você pode se mover por terreno difícil e contornar obstáculos leves, desde que ainda consiga terminar o movimento no espaço necessário para atacar. Você precisa manter uma rota coerente até o alvo e cumprir as demais exigências da investida."
        },
        "Investida Bantha (Bantha Rush)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Força 13, Ataque Poderoso.\n\nBenefício: Quando você acerta um ataque corpo a corpo no fim de uma investida, pode empurrar o alvo 1 quadrado para longe de você, além de causar o dano normal. O alvo precisa ser de tamanho Grande ou menor e o quadrado de destino precisa estar livre."
        },
        "Investida Bantha Aprimorada (Improved Bantha Rush)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Força 15, Ataque Poderoso, Investida Bantha.\n\nBenefício: Quando usa Investida Bantha com sucesso, você pode empurrar o alvo 2 quadrados em vez de 1. Se o alvo colidir com uma barreira sólida durante esse movimento, sofre dano adicional conforme o impacto e para no primeiro espaço válido antes da barreira."
        },
        "Investida Hábil (Deft Charge)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Destreza 13, treinado em Acrobacia.\n\nBenefício: Quando faz uma investida, você pode usar Acrobacia para atravessar terreno difícil, passar por espaços apertados ou evitar ataques de oportunidade durante o movimento. Se a verificação falhar, a investida termina antes do ponto em que o movimento deixaria de ser válido."
        },
        "Investida Maníaca (Maniacal Charge)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Quando faz uma investida, você pode sofrer uma penalidade adicional na Defesa de Reflexos até o início do seu próximo turno para receber bônus adicional na jogada de ataque da investida. Esse benefício representa avanço imprudente, agressivo e difícil de deter."
        },
        "Investida Poderosa (Powerful Charge)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Força 13.\n\nBenefício: Quando você faz uma investida e acerta o ataque corpo a corpo no fim do movimento, causa dano adicional. O dano extra representa o impacto direto da corrida, massa corporal e impulso acumulado antes do golpe."
        },
        "Ler os Ventos (Read the Winds)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado em Sobrevivência.\n\nBenefício: Você pode interpretar vento, pressão, poeira, umidade, cheiro e pequenos sinais ambientais para prever mudanças de clima e perigos naturais. Recebe +5 de bônus de competência em verificações de Sobrevivência feitas para prever tempestades, gases, dispersão de fumaça, trilhas pelo ar ou deslocamento de partículas."
        },
        "Liberado (Unleashed)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Sensibilidade à Força.\n\nBenefício: Quando usa um poder da Força em uma situação dramática, pode gastar 1 Ponto da Força para aumentar a intensidade do efeito conforme as regras de poderes liberados. Esse uso amplia alcance, dano, área, duração ou efeito narrativo mecânico do poder, conforme o poder usado."
        },
        "Líder de Droides (Leader of Droids)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado em Mecânica ou Usar Computadores.\n\nBenefício: Droides aliados que possam receber suas ordens recebem +1 de bônus de moral em jogadas de ataque enquanto estiverem a até 12 quadrados de você e puderem ver, ouvir ou receber suas instruções por comunicação eletrônica. Esse bônus termina se você ficar inconsciente ou incapaz de comandar."
        },
        "Limite de Dano Aprimorado (Improved Damage Threshold)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Seu limiar de dano aumenta em +5. Esse aumento torna mais difícil que ataques fortes, explosões, quedas e outros danos relevantes façam você descer na Trilha de Condição."
        },
        "Língua de Prata (Silver Tongue)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Carisma 13, treinado em Persuasão.\n\nBenefício: Quando você usa Persuasão para mudar a atitude de uma criatura, pode fazê-lo como uma ação padrão. Além disso, quando tenta convencer uma criatura com argumentos rápidos durante um encontro, recebe +2 de bônus de competência na verificação."
        },
        "Linguista (Linguist)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Inteligência 13.\n\nBenefício: Você aprende um número de idiomas adicionais igual a 1 + seu modificador de Inteligência. Sempre que seu modificador de Inteligência aumentar, você aprende um idioma adicional.\n\nEspecial: Você pode escolher este Talento várias vezes. Cada vez que escolher, aprende idiomas adicionais novamente."
        },
        "Lutar Apesar da Dor (Fight Through Pain)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Tolerância treinada.\n\nBenefício: Quando sofrer dano que iguale ou supere seu limiar de dano, você pode fazer uma verificação de Tolerância como reação. Se o resultado for bem-sucedido contra uma CD apropriada ao dano sofrido, reduz em 1 o número de passos que desceria na Trilha de Condição por esse dano."
        },
        "Maestria em Armas Improvisadas (Improvised Weapon Mastery)": {
                "source": "Star Wars Saga Edition Scum and Villainy / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Você reduz a penalidade por usar armas improvisadas e causa dano maior com objetos usados como armas. Objetos comuns, ferramentas, móveis, peças soltas, garrafas, bastões e equipamentos semelhantes podem ser usados com mais eficiência em combate."
        },
        "Maestria em Duas Armas (I, II e III) (Dual Weapon Mastery (I, II, and III))": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Destreza 13 para Maestria em Duas Armas I; Destreza 15 e bônus base de ataque +6 para II; Destreza 17 e bônus base de ataque +11 para III.\n\nBenefício: Você reduz as penalidades por lutar com duas armas. Cada grau melhora sua eficiência ao atacar com uma arma em cada mão ou com uma arma dupla.\n\nNormal: Atacar com duas armas impõe penalidades maiores nas jogadas de ataque."
        },
        "Maestria em Escudo de Droides (Droid Shield Mastery)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: Droide, proficiência ou sistema de escudo instalado.\n\nBenefício: Você opera escudos de droide com eficiência superior. Quando ativa ou mantém um escudo pessoal de droide, melhora sua resistência, estabilidade ou recuperação conforme o modelo instalado, reduzindo falhas e ampliando a proteção em combate."
        },
        "Maestria em Regimes da Força (Force Regimen Mastery)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "text": "Pré-requisitos: Sensibilidade à Força, treinado em Usar a Força.\n\nBenefício: Você domina regimes da Força por meio de disciplina repetida. Quando realiza um regime da Força, recebe +5 de bônus de competência na verificação de Usar a Força associada e pode obter benefícios mais consistentes em meditação, treino físico, foco mental ou preparação espiritual."
        },
        "Manobra Escorregadia (Slippery Maneuver)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Destreza 13, treinado em Acrobacia.\n\nBenefício: Quando um inimigo erra um ataque de oportunidade contra você, você pode se mover 1 quadrado como reação. Esse movimento precisa terminar em um espaço legal e não pode exceder seu deslocamento disponível para a situação."
        },
        "Manter Unido (Hold Together)": {
                "source": "Star Wars Saga Edition Starships of the Galaxy / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado em Mecânica.\n\nBenefício: Quando um veículo, nave, droide ou equipamento sofre dano suficiente para ficar desabilitado, você pode fazer uma verificação de Mecânica como reação ou ação apropriada para mantê-lo funcionando temporariamente. O objeto permanece operacional por tempo limitado ou até sofrer novo dano relevante."
        },
        "Manter-se Firme (Stand Tall)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Constituição 13 ou Tolerância treinada.\n\nBenefício: Quando um efeito tenta derrubá-lo, empurrá-lo ou movê-lo contra sua vontade, você recebe +5 de bônus nas verificações ou Defesas usadas para resistir. Esse benefício representa postura firme, equilíbrio e disciplina sob pressão."
        },
        "Manto do Lado Sombrio (Pall of the Dark Side)": {
