<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Saga Edition - Ficha de Personagem</title>
    <style>
        :root {
            --sw-yellow: #FFE81F;
            --sw-blue: #2E67F8;
            --sw-red: #D62828;
            --sw-bg: #000000;
            --sw-panel: #1A1A1A;
            --sw-border: #333333;
            --sw-text: #E0E0E0;
            --sw-accent: #4A4A4A;
        }

        body {
            background-color: var(--sw-bg);
            color: var(--sw-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        h1, h2, h3 {
            color: var(--sw-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--sw-yellow);
            padding-bottom: 5px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Tabs Styling */
        .tabs-container {
            margin-bottom: 20px;
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            border-bottom: 2px solid var(--sw-accent);
        }

        .tab-btn {
            background: var(--sw-panel);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            white-space: nowrap;
            display: inline-block;
            margin-right: 5px;
        }

        .tab-btn.active {
            background: var(--sw-yellow);
            color: black;
            font-weight: bold;
            border-color: var(--sw-yellow);
        }

        .add-tab-btn {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .remove-tab {
            color: var(--sw-red);
            font-weight: bold;
            cursor: pointer;
            padding: 0 5px;
            margin-left: 8px;
        }

        /* Sheet Styling */
        .sheet-content {
            display: none;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid var(--sw-border);
            padding: 20px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 0 20px rgba(255, 232, 31, 0.1);
        }

        .sheet-content.active {
            display: block;
        }

        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            padding: 15px;
            border-radius: 5px;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.8em;
            color: var(--sw-yellow);
            margin-bottom: 3px;
            font-weight: bold;
        }

        input, select, textarea {
            background: #222;
            border: 1px solid var(--sw-accent);
            color: white;
            padding: 8px;
            border-radius: 3px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--sw-yellow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            font-size: 0.7em;
            color: var(--sw-yellow);
            padding: 5px;
            border-bottom: 1px solid var(--sw-accent);
        }

        td {
            padding: 5px;
            border-bottom: 1px solid var(--sw-accent);
        }

        .attr-input {
            width: 50px;
            text-align: center;
        }

        .dynamic-list {
            list-style: none;
            padding: 0;
        }

        .dynamic-item {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .dynamic-item input {
            flex-grow: 1;
        }

        .btn-add {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .btn-remove {
            background: var(--sw-red);
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        .save-load {
            margin-top: 20px;
            text-align: right;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }

        .btn-save { background: #28a745; color: white; border: none; }
        .btn-export { background: var(--sw-yellow); color: black; border: none; }

        #loginScreen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px), radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px); background-size: 550px 550px, 350px 350px; }
        #loginBox { background: rgba(26,26,26,0.97); border: 2px solid var(--sw-yellow); border-radius: 10px; padding: 40px; width: 340px; box-shadow: 0 0 40px rgba(255,232,31,0.15); text-align: center; }
        #loginBox h2 { color: var(--sw-yellow); margin-bottom: 5px; border: none; }
        #loginBox p { color: #888; font-size: 0.85em; margin-bottom: 25px; }
        #loginBox input { width: 100%; margin-bottom: 12px; padding: 10px; background: #111; border: 1px solid var(--sw-accent); color: white; border-radius: 4px; box-sizing: border-box; font-size: 0.95em; }
        #btnLogin { width: 100%; padding: 11px; background: var(--sw-yellow); color: black; border: none; border-radius: 4px; font-weight: bold; font-size: 1em; cursor: pointer; margin-top: 4px; }
        #loginError { color: #ff6b6b; font-size: 0.82em; margin-top: 10px; min-height: 18px; }

        #userBar { display: none; align-items: center; gap: 12px; font-size: 0.82em; color: #aaa; margin-bottom: 8px; }
        #btnLogout { background: transparent; border: 1px solid #555; color: #aaa; padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 0.8em; }
        #syncStatus { font-size: 0.75em; color: #555; margin-left: auto; }

        .tab-btn.user-mestre { border-bottom: 3px solid #D62828 !important; }
        .tab-btn.user-dede { border-bottom: 3px solid #8e44ad !important; }
        .tab-btn.user-paulo { border-bottom: 3px solid #2E67F8 !important; }
        .tab-btn.user-vinicius { border-bottom: 3px solid #27ae60 !important; }
        
        .tab-btn.active.user-mestre { background: #D62828 !important; color: white !important; }
        .tab-btn.active.user-dede { background: #8e44ad !important; color: white !important; }
        .tab-btn.active.user-paulo { background: #2E67F8 !important; color: white !important; }
        .tab-btn.active.user-vinicius { background: #27ae60 !important; color: white !important; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .grid-section { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>

<div id="loginScreen">
    <div id="loginBox">
        <h2>⚔ Star Wars RPG</h2>
        <p>Campanha: Will &mdash; 3980 BBY</p>
        <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">
        <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password">
        <button id="btnLogin">Entrar</button>
        <div id="loginError"></div>
    </div>
</div>

<div class="container">
    <div id="userBar">
        <span>👤 <span id="userEmail"></span></span>
        <button id="btnLogout">Sair</button>
        <span id="syncStatus"></span>
    </div>
    <header>
        <h1>Star Wars Saga Edition</h1>
        <p>Gerenciador de Fichas de Personagem - Campanha: Will (3980 BBY)</p>
    </header>

    <div class="tabs-container">
        <div class="tabs-header" id="tabsHeader"></div>
    </div>

    <div id="sheetsContainer"></div>

    <div class="save-load">
        <button class="btn-action btn-export" onclick="exportAsHTML()">📄 Exportar Ficha (HTML)</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey:            "AIzaSyBg2cN9SeufSfgBUV0oieAEnexQTvpanS0",
    authDomain:        "campanha-star-wars.firebaseapp.com",
    projectId:         "campanha-star-wars",
    storageBucket:     "campanha-star-wars.firebasestorage.app",
    messagingSenderId: "158883017246",
    appId:             "1:158883017246:web:ccc0b90d1e77578256f40f"
};

const MASTER_EMAIL = "mestre@campanhawill.com";
const PLAYER_INFO = {
    "mestre@campanhawill.com":   { id: "mestre",   color: "user-mestre",   label: "Mestre" },
    "dede@campanhawill.com":     { id: "dede",     color: "user-dede",     label: "Dedé" },
    "paulo@campanhawill.com":    { id: "paulo",    color: "user-paulo",    label: "Paulo" },
    "vinicius@campanhawill.com": { id: "vinicius", color: "user-vinicius", label: "Vinícius" }
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

let unsubListeners = [];
let sheets = [];
let activeSheetId = null;
let currentUser = null;
let isMaster = false;

// Expor funções globais para o HTML
window.addNewSheet = addNewSheet;
window.removeSheet = removeSheet;
window.switchSheet = switchSheet;
window.updateAttr = updateAttr;
window.updateNestedField = updateNestedField;
window.addDynamicItem = addDynamicItem;
window.removeDynamicItem = removeDynamicItem;
window.updateDynamicItem = updateDynamicItem;
window.exportAsHTML = exportAsHTML;

onAuthStateChanged(auth, user => {
    unsubListeners.forEach(u => u());
    unsubListeners = [];
    sheets = [];
    activeSheetId = null;

    if (user) {
        currentUser = user;
        isMaster = (user.email === MASTER_EMAIL);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('userBar').style.display = 'flex';
        document.getElementById('userEmail').textContent = isMaster ? '👑 Mestre' : user.email;
        startListeners();
    } else {
        currentUser = null;
        isMaster = false;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('userBar').style.display = 'none';
        renderSheets();
    }
});

function startListeners() {
    if (isMaster) {
        Object.values(PLAYER_INFO).forEach(info => {
            const unsub = onSnapshot(collection(db, `sheets_${info.id}`), snap => {
                const currentIds = snap.docs.map(doc => doc.id);
                sheets = sheets.filter(s => s.owner !== info.id || currentIds.includes(s.firebaseId));
                snap.docs.forEach(doc => mergeSheet({ ...doc.data(), firebaseId: doc.id, owner: info.id }));
            });
            unsubListeners.push(unsub);
        });
    } else {
        const userInfo = PLAYER_INFO[currentUser.email];
        if (userInfo) {
            const unsub = onSnapshot(collection(db, `sheets_${userInfo.id}`), snap => {
                const currentIds = snap.docs.map(doc => doc.id);
                sheets = sheets.filter(s => currentIds.includes(s.firebaseId));
                if (snap.empty) {
                    const empty = createEmptySheet();
                    empty.name = userInfo.label;
                    empty.owner = userInfo.id;
                    empty.firebaseId = 'char_' + empty.id;
                    saveToFirebase(empty);
                } else {
                    snap.docs.forEach(doc => mergeSheet({ ...doc.data(), firebaseId: doc.id, owner: userInfo.id }));
                }
            });
            unsubListeners.push(unsub);
        }
    }
}

function mergeSheet(data) {
    const idx = sheets.findIndex(s => s.firebaseId === data.firebaseId);
    if (idx >= 0) sheets[idx] = data;
    else sheets.push(data);
    if (!activeSheetId && sheets.length > 0) activeSheetId = sheets[0].id;
    renderSheets();
}

async function saveToFirebase(sheet) {
    if (!sheet || !currentUser) return;
    const statusEl = document.getElementById('syncStatus');
    if (statusEl) statusEl.textContent = '💾 Salvando...';
    try {
        await setDoc(doc(db, `sheets_${sheet.owner}`, sheet.firebaseId), sheet);
        if (statusEl) { statusEl.textContent = '✓ Salvo'; setTimeout(() => statusEl.textContent = '', 2000); }
    } catch (e) {
        if (statusEl) statusEl.textContent = '❌ Erro';
    }
}

function createEmptySheet() {
    return {
        id: Date.now(),
        name: "Novo Personagem",
        player: "",
        classes: [{ name: "Jedi", level: 1 }],
        attributes: {
            FOR: { val: 10, mod: 0 }, DES: { val: 10, mod: 0 }, CON: { val: 10, mod: 0 },
            INT: { val: 10, mod: 0 }, SAB: { val: 10, mod: 0 }, CAR: { val: 10, mod: 0 }
        },
        forcePowers: [], owner: ""
    };
}

function renderSheets() {
    const container = document.getElementById('sheetsContainer');
    const tabsHeader = document.getElementById('tabsHeader');
    container.innerHTML = '';
    tabsHeader.innerHTML = isMaster ? '' : '<button class="add-tab-btn" onclick="addNewSheet()">+ Nova Ficha</button>';

    sheets.forEach(sheet => {
        const ownerInfo = Object.values(PLAYER_INFO).find(i => i.id === sheet.owner) || { color: '' };
        const btn = document.createElement('button');
        btn.className = `tab-btn ${ownerInfo.color} ${sheet.id === activeSheetId ? 'active' : ''}`;
        btn.innerHTML = `${sheet.owner === 'mestre' ? '👑 ' : ''}${sheet.name} <span class="remove-tab" onclick="event.stopPropagation(); removeSheet(${sheet.id})">✕</span>`;
        btn.onclick = () => switchSheet(sheet.id);
        tabsHeader.appendChild(btn);

        if (sheet.id === activeSheetId) {
            const content = document.createElement('div');
            content.className = 'sheet-content active';
            content.innerHTML = `
                <div class="panel">
                    <h3>Informações Básicas</h3>
                    <div class="grid-section">
                        <div class="input-group">
                            <label>Nome do Personagem</label>
                            <input type="text" value="${sheet.name}" onchange="updateNestedField(${sheet.id}, null, 'name', this.value)">
                        </div>
                        <div class="input-group">
                            <label>Jogador</label>
                            <input type="text" value="${sheet.player}" onchange="updateNestedField(${sheet.id}, null, 'player', this.value)">
                        </div>
                    </div>
                </div>
                <div class="grid-section">
                    <div class="panel">
                        <h3>Atributos</h3>
                        <table>
                            ${Object.keys(sheet.attributes).map(attr => `
                                <tr>
                                    <td><strong>${attr}</strong></td>
                                    <td><input type="number" class="attr-input" value="${sheet.attributes[attr].val}" onchange="updateAttr(${sheet.id}, '${attr}', this.value)"></td>
                                    <td>Mod: ${sheet.attributes[attr].mod}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                    <div class="panel">
                        <h3>Poderes da Força</h3>
                        <div class="dynamic-list">
                            ${sheet.forcePowers.map((p, i) => `
                                <div class="dynamic-item">
                                    <input type="text" value="${p}" onchange="updateDynamicItem(${sheet.id}, 'forcePowers', ${i}, this.value)">
                                    <button class="btn-remove" onclick="removeDynamicItem(${sheet.id}, 'forcePowers', ${i})">✕</button>
                                </div>
                            `).join('')}
                        </div>
                        <button class="btn-add" onclick="addDynamicItem(${sheet.id}, 'forcePowers')">+ Adicionar</button>
                    </div>
                </div>
            `;
            container.appendChild(content);
        }
    });
}

function switchSheet(id) { activeSheetId = id; renderSheets(); }

function addNewSheet() {
    const userInfo = PLAYER_INFO[currentUser.email];
    if (!userInfo) return;
    const newSheet = createEmptySheet();
    newSheet.owner = userInfo.id;
    newSheet.firebaseId = 'char_' + newSheet.id;
    saveToFirebase(newSheet).then(() => { activeSheetId = newSheet.id; });
}

function removeSheet(id) {
    const sheet = sheets.find(s => s.id === id);
    if (!sheet) return;
    if (!isMaster && sheet.owner !== PLAYER_INFO[currentUser.email].id) return alert('Acesso negado');
    if (confirm('Remover ficha?')) deleteDoc(doc(db, `sheets_${sheet.owner}`, sheet.firebaseId));
}

function updateAttr(id, attr, val) {
    const s = sheets.find(x => x.id === id);
    if (s) {
        s.attributes[attr].val = parseInt(val);
        s.attributes[attr].mod = Math.floor((parseInt(val) - 10) / 2);
        saveToFirebase(s); renderSheets();
    }
}

function updateNestedField(id, parent, field, val) {
    const s = sheets.find(x => x.id === id);
    if (s) {
        if (parent) s[parent][field] = val; else s[field] = val;
        saveToFirebase(s); renderSheets();
    }
}

function addDynamicItem(id, field) {
    const s = sheets.find(x => x.id === id);
    if (s) { s[field].push(""); saveToFirebase(s); renderSheets(); }
}

function removeDynamicItem(id, field, idx) {
    const s = sheets.find(x => x.id === id);
    if (s) { s[field].splice(idx, 1); saveToFirebase(s); renderSheets(); }
}

function updateDynamicItem(id, field, idx, val) {
    const s = sheets.find(x => x.id === id);
    if (s) { s[field][idx] = val; saveToFirebase(s); }
}

function exportAsHTML() {
    const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ficha_star_wars.html';
    a.click();
}

document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    try { await signInWithEmailAndPassword(auth, email, pass); }
    catch(e) { document.getElementById('loginError').textContent = 'Erro de login'; btn.disabled = false; }
});

document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));
</script>
</body>
</html>
