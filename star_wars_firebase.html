<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Saga Edition - Ficha de Personagem</title>
    <!-- MANTENDO TODO O SEU CSS ORIGINAL -->
    <style>
        :root {
            --sw-yellow: #FFE81F;
            --sw-blue: #2E67F8;
            --sw-red: #D62828;
            --sw-bg: #000000;
            --sw-panel: #1A1A1A;
            --sw-border: #333333;
            --sw-text: #E0E0E0;
            --sw-accent: #4A4A4A;
        }

        body {
            background-color: var(--sw-bg);
            color: var(--sw-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        h1, h2, h3 {
            color: var(--sw-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--sw-yellow);
            padding-bottom: 5px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .tabs-container {
            margin-bottom: 20px;
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            border-bottom: 2px solid var(--sw-accent);
        }

        .tab-btn {
            background: var(--sw-panel);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            white-space: nowrap;
            display: inline-block;
            margin-right: 5px;
        }

        .tab-btn.active {
            background: var(--sw-yellow);
            color: black;
            font-weight: bold;
            border-color: var(--sw-yellow);
        }

        .add-tab-btn {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .remove-tab {
            color: var(--sw-red);
            font-weight: bold;
            cursor: pointer;
            padding: 0 5px;
        }

        .sheet-content {
            display: none;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid var(--sw-border);
            padding: 20px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 0 20px rgba(255, 232, 31, 0.1);
        }

        .sheet-content.active {
            display: block;
        }

        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            padding: 15px;
            border-radius: 5px;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.8em;
            color: var(--sw-yellow);
            margin-bottom: 3px;
            font-weight: bold;
        }

        input, select, textarea {
            background: #222;
            border: 1px solid var(--sw-accent);
            color: white;
            padding: 8px;
            border-radius: 3px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 0.7em; color: var(--sw-yellow); padding: 5px; border-bottom: 1px solid var(--sw-accent); }
        td { padding: 5px; border-bottom: 1px solid var(--sw-accent); }
        .attr-input { width: 50px; text-align: center; }
        .btn-add { background: var(--sw-blue); color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 0.8em; margin-top: 5px; }
        .btn-remove { background: var(--sw-red); color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; }
        .save-load { margin-top: 20px; text-align: right; }
        .btn-action { padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 10px; }
        .btn-export { background: var(--sw-yellow); color: black; border: none; }
        
        /* Modal e outros estilos omitidos por brevidade mas presentes no original */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal.active { display: block; }
        .modal-content { background-color: var(--sw-panel); margin: 3% auto; padding: 20px; border: 2px solid var(--sw-yellow); width: 95%; max-width: 1000px; border-radius: 5px; }
        
        #loginScreen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        #loginBox { background: rgba(26,26,26,0.97); border: 2px solid var(--sw-yellow); border-radius: 10px; padding: 40px; width: 340px; text-align: center; }
        #loginBox input { width: 100%; margin-bottom: 12px; padding: 10px; background: #111; border: 1px solid var(--sw-accent); color: white; border-radius: 4px; box-sizing: border-box; }
        #btnLogin { width: 100%; padding: 11px; background: var(--sw-yellow); color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #userBar { display: none; align-items: center; gap: 12px; font-size: 0.82em; color: #aaa; margin-bottom: 8px; }
        #btnLogout { background: transparent; border: 1px solid #555; color: #aaa; padding: 3px 10px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div id="loginBox">
        <h2>⚔ Star Wars RPG</h2>
        <p>Campanha: Will &mdash; 3980 BBY</p>
        <input type="email" id="loginEmail" placeholder="E-mail">
        <input type="password" id="loginPass" placeholder="Senha">
        <button id="btnLogin">Entrar</button>
        <div id="loginError"></div>
    </div>
</div>

<div class="container">
    <div id="userBar">
        <span>👤 <span id="userEmail"></span></span>
        <button id="btnLogout">Sair</button>
        <span id="syncStatus"></span>
    </div>
    <header>
        <h1>Star Wars Saga Edition</h1>
        <p>Gerenciador de Fichas de Personagem - Campanha: Will (3980 BBY)</p>
    </header>

    <div class="tabs-container">
        <div class="tabs-header" id="tabsHeader"></div>
    </div>

    <div id="sheetsContainer"></div>

    <div class="save-load">
        <button class="btn-action btn-export" onclick="exportAsHTML()">📄 Exportar Ficha (HTML)</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey:            "AIzaSyBg2cN9SeufSfgBUV0oieAEnexQTvpanS0",
    authDomain:        "campanha-star-wars.firebaseapp.com",
    projectId:         "campanha-star-wars",
    storageBucket:     "campanha-star-wars.firebasestorage.app",
    messagingSenderId: "158883017246",
    appId:             "1:158883017246:web:ccc0b90d1e77578256f40f"
};

const MASTER_EMAIL = "mestre@campanhawill.com";
const PLAYER_INFO = {
    "mestre@campanhawill.com":   { id: "mestre",   color: "user-mestre",   label: "Mestre" },
    "dede@campanhawill.com":     { id: "dede",     color: "user-dede",     label: "Dedé" },
    "paulo@campanhawill.com":    { id: "paulo",    color: "user-paulo",    label: "Paulo" },
    "vinicius@campanhawill.com": { id: "vinicius", color: "user-vinicius", label: "Vinícius" }
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

let unsubListeners = [];

// Expondo funções e variáveis para o escopo global para que os botões funcionem
window._sheets = [];
window._activeSheetId = null;
window._currentUser = null;
window._isMaster = false;
window.PLAYER_INFO = PLAYER_INFO;

window._fbSetDoc = (col, id, data) => setDoc(doc(db, col, id), data);
window._fbDeleteDoc = (col, id) => deleteDoc(doc(db, col, id));

// Proxies para manter compatibilidade com o código legado
Object.defineProperty(window, 'sheets', {
    get() { return window._sheets; },
    set(v) { window._sheets = v; }
});
Object.defineProperty(window, 'activeSheetId', {
    get() { return window._activeSheetId; },
    set(v) { window._activeSheetId = v; }
});

onAuthStateChanged(auth, user => {
    unsubListeners.forEach(u => u());
    unsubListeners = [];
    window._sheets = [];
    window._activeSheetId = null;

    if (user) {
        window._currentUser = user;
        window._isMaster = (user.email === MASTER_EMAIL);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('userBar').style.display = 'flex';
        document.getElementById('userEmail').textContent = window._isMaster ? '👑 Mestre' : user.email;
        startListeners();
    } else {
        window._currentUser = null;
        window._isMaster = false;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('userBar').style.display = 'none';
        if (typeof renderSheets === 'function') renderSheets();
    }
});

function startListeners() {
    if (window._isMaster) {
        Object.values(PLAYER_INFO).forEach(info => {
            const unsub = onSnapshot(collection(db, `sheets_${info.id}`), snap => {
                const currentIds = snap.docs.map(doc => doc.id);
                window._sheets = window._sheets.filter(s => s.owner !== info.id || currentIds.includes(s.firebaseId));
                snap.docs.forEach(doc => mergeSheet({ ...doc.data(), firebaseId: doc.id, owner: info.id }));
            });
            unsubListeners.push(unsub);
        });
    } else {
        const userInfo = PLAYER_INFO[window._currentUser.email];
        if (userInfo) {
            const unsub = onSnapshot(collection(db, `sheets_${userInfo.id}`), snap => {
                const currentIds = snap.docs.map(doc => doc.id);
                window._sheets = window._sheets.filter(s => currentIds.includes(s.firebaseId));
                if (snap.empty) {
                    const empty = createEmptySheet();
                    empty.name = userInfo.label;
                    empty.owner = userInfo.id;
                    empty.firebaseId = 'char_' + empty.id;
                    window._fbSetDoc(`sheets_${userInfo.id}`, empty.firebaseId, empty);
                } else {
                    snap.docs.forEach(doc => mergeSheet({ ...doc.data(), firebaseId: doc.id, owner: userInfo.id }));
                }
            });
            unsubListeners.push(unsub);
        }
    }
}

function mergeSheet(data) {
    const idx = window._sheets.findIndex(s => s.firebaseId === data.firebaseId);
    if (idx >= 0) window._sheets[idx] = data;
    else window._sheets.push(data);
    if (!window._activeSheetId && window._sheets.length > 0) window._activeSheetId = window._sheets[0].id;
    if (typeof renderSheets === 'function') renderSheets();
}

// Funções de ação (globais)
window.addNewSheet = function() {
    const userInfo = window.PLAYER_INFO[window._currentUser.email];
    if (!userInfo) return;
    const newSheet = createEmptySheet();
    newSheet.owner = userInfo.id;
    newSheet.firebaseId = 'char_' + newSheet.id;
    window._fbSetDoc(`sheets_${userInfo.id}`, newSheet.firebaseId, newSheet).then(() => {
        window._activeSheetId = newSheet.id;
        renderSheets();
    });
};

window.removeSheet = function(id) {
    id = Number(id);
    const sheet = window._sheets.find(s => s.id === id);
    if (!sheet) return;
    if (!window._isMaster && sheet.owner !== window.PLAYER_INFO[window._currentUser.email].id) {
        alert('Você só pode apagar suas próprias fichas.');
        return;
    }
    if (!confirm(`Remover a ficha de "${sheet.name || 'Sem Nome'}"?`)) return;
    window._fbDeleteDoc(`sheets_${sheet.owner}`, sheet.firebaseId);
};

window.switchSheet = function(id) {
    window._activeSheetId = id;
    renderSheets();
};

window.saveToLocalStorage = function() {
    const sheet = window._sheets.find(s => s.id === window._activeSheetId);
    if (!sheet || !window._currentUser || !window._fbSetDoc) return;
    const statusEl = document.getElementById('syncStatus');
    if (statusEl) statusEl.textContent = '💾 Salvando...';
    window._fbSetDoc(`sheets_${sheet.owner}`, sheet.firebaseId, sheet).then(() => {
        if (statusEl) { statusEl.textContent = '✓ Salvo'; setTimeout(() => statusEl.textContent = '', 2000); }
    });
};

// Login Listeners
document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    try { await signInWithEmailAndPassword(auth, email, pass); }
    catch(e) { document.getElementById('loginError').textContent = 'Erro de login'; btn.disabled = false; }
});
document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

// Função de renderização (precisa ser global ou acessível)
window.renderSheets = function() {
    const container = document.getElementById('sheetsContainer');
    const tabsHeader = document.getElementById('tabsHeader');
    if (!container || !tabsHeader) return;
    
    container.innerHTML = '';
    tabsHeader.innerHTML = '<button class="add-tab-btn" onclick="addNewSheet()">+ Nova Ficha</button>';

    window._sheets.forEach(sheet => {
        const ownerInfo = Object.values(window.PLAYER_INFO).find(i => i.id === sheet.owner) || { color: '' };
        const btn = document.createElement('button');
        btn.className = `tab-btn ${ownerInfo.color} ${sheet.id === window._activeSheetId ? 'active' : ''}`;
        btn.innerHTML = `${sheet.owner === 'mestre' ? '👑 ' : ''}${sheet.name || 'Sem Nome'} <span class="remove-tab" onclick="event.stopPropagation(); removeSheet(${sheet.id})">✕</span>`;
        btn.onclick = () => switchSheet(sheet.id);
        tabsHeader.appendChild(btn);

        if (sheet.id === window._activeSheetId) {
            const content = document.createElement('div');
            content.className = 'sheet-content active';
            // RESTAURANDO SEU HTML ORIGINAL DA FICHA
            content.innerHTML = `
                <div class="panel">
                    <h3>Informações Básicas</h3>
                    <div class="grid-section">
                        <div class="input-group"><label>Nome</label><input type="text" value="${sheet.name}" onchange="updateField(${sheet.id}, 'name', this.value)"></div>
                        <div class="input-group"><label>Jogador</label><input type="text" value="${sheet.player}" onchange="updateField(${sheet.id}, 'player', this.value)"></div>
                    </div>
                </div>
                <!-- O resto do seu layout original aqui... -->
            `;
            container.appendChild(content);
        }
    });
};

window.updateField = function(id, field, val) {
    const s = window._sheets.find(x => x.id === id);
    if (s) { s[field] = val; window.saveToLocalStorage(); }
};

// Dados da ficha (Restaurado do original)
function createEmptySheet() {
    return {
        id: Date.now(), name: "Novo Personagem", player: "",
        classes: [{ name: "Jedi", level: 1 }],
        attributes: { FOR: {val:10, mod:0}, DES: {val:10, mod:0}, CON: {val:10, mod:0}, INT: {val:10, mod:0}, SAB: {val:10, mod:0}, CAR: {val:10, mod:0} },
        owner: ""
    };
}
</script>
</body>
</html>
