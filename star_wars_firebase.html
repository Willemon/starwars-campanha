<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Saga Edition - Ficha de Personagem</title>
    <style>
        :root {
            --sw-yellow: #FFE81F;
            --sw-blue: #2E67F8;
            --sw-red: #D62828;
            --sw-bg: #000000;
            --sw-panel: #1A1A1A;
            --sw-border: #333333;
            --sw-text: #E0E0E0;
            --sw-accent: #4A4A4A;
        }

        body {
            background-color: var(--sw-bg);
            color: var(--sw-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        h1, h2, h3 {
            color: var(--sw-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--sw-yellow);
            padding-bottom: 5px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Tabs Styling */
        .tabs-container {
            margin-bottom: 20px;
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            border-bottom: 2px solid var(--sw-accent);
        }

        
        .tab-btn {
            background: var(--sw-panel);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            white-space: nowrap;
            display: inline-block;
            margin-right: 5px;
        }


        .tab-btn.active {
            background: var(--sw-yellow);
            color: black;
            font-weight: bold;
            border-color: var(--sw-yellow);
        }

        .add-tab-btn {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .remove-tab {
            color: var(--sw-red);
            font-weight: bold;
            cursor: pointer;
            padding: 0 5px;
        }

        /* Sheet Styling */
        .sheet-content {
            display: none;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid var(--sw-border);
            padding: 20px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 0 20px rgba(255, 232, 31, 0.1);
        }

        .sheet-content.active {
            display: block;
        }

        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            padding: 15px;
            border-radius: 5px;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.8em;
            color: var(--sw-yellow);
            margin-bottom: 3px;
            font-weight: bold;
        }

        input, select, textarea {
            background: #222;
            border: 1px solid var(--sw-accent);
            color: white;
            padding: 8px;
            border-radius: 3px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--sw-yellow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            font-size: 0.7em;
            color: var(--sw-yellow);
            padding: 5px;
            border-bottom: 1px solid var(--sw-accent);
        }

        td {
            padding: 5px;
            border-bottom: 1px solid var(--sw-accent);
        }

        .attr-input {
            width: 50px;
            text-align: center;
        }

        .dynamic-list {
            list-style: none;
            padding: 0;
        }

        .dynamic-item {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .dynamic-item input {
            flex-grow: 1;
        }

        .btn-add {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .btn-remove {
            background: var(--sw-red);
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        .condition-track {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .condition-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .save-load {
            margin-top: 20px;
            text-align: right;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }

        .btn-save { background: #28a745; color: white; border: none; }
        .btn-export { background: var(--sw-yellow); color: black; border: none; }

        .class-row {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .class-row select, .class-row input {
            flex: 1;
        }

        /* Características Grid */
        .characteristics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .characteristics-grid .input-group {
            margin-bottom: 0;
        }

        /* Class Reference Styling */
        .class-reference {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .class-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .class-btn {
            background: var(--sw-panel);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }

        .class-btn.active {
            background: var(--sw-yellow);
            color: black;
            border-color: var(--sw-yellow);
        }

        .class-info {
            display: none;
        }

        .class-info.active {
            display: block;
        }

        .class-info h4 {
            color: var(--sw-yellow);
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 1em;
            border-bottom: 1px solid var(--sw-accent);
            padding-bottom: 5px;
        }

        .class-info p {
            font-size: 0.9em;
            line-height: 1.5;
            margin: 5px 0;
        }

        .class-info ul {
            margin: 5px 0;
            padding-left: 20px;
        }

        .class-info li {
            font-size: 0.9em;
            margin: 3px 0;
        }

        .class-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85em;
        }

        .class-table th {
            background: rgba(255, 232, 31, 0.1);
            color: var(--sw-yellow);
            padding: 8px;
            text-align: left;
            border: 1px solid var(--sw-accent);
        }

        .class-table td {
            padding: 6px 8px;
            border: 1px solid var(--sw-accent);
        }

        .class-table tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            overflow: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background-color: var(--sw-panel);
            margin: 3% auto;
            padding: 20px;
            border: 2px solid var(--sw-yellow);
            width: 95%;
            max-width: 1000px;
            border-radius: 5px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            color: var(--sw-yellow);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover {
            color: white;
        }

        .btn-reference {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        .class-description {
            background: rgba(255, 232, 31, 0.05);
            border-left: 3px solid var(--sw-yellow);
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }

        .feature-item {
            background: rgba(0, 0, 0, 0.3);
            border-left: 2px solid var(--sw-blue);
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 3px;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .character-image-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--sw-blue);
            border-radius: 5px;
            padding: 10px;
            text-align: center;
        }

        .character-image-panel h4 {
            margin: 0 0 10px 0;
            color: var(--sw-yellow);
            font-size: 0.9em;
        }

        .image-upload-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .image-container-9-16 {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--sw-blue);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: grab;
        }

        .image-container-9-16.active {
            cursor: grabbing;
        }

        .image-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.1s ease-out;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px dashed var(--sw-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.85em;
            cursor: pointer;
            text-align: center;
            padding: 10px;
        }

        .image-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 8px;
        }

        .btn-control {
            padding: 6px 12px;
            background: var(--sw-blue);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75em;
            transition: background 0.2s;
        }

        .btn-control:hover {
            background: var(--sw-yellow);
            color: black;
        }

        .zoom-info {
            font-size: 0.75em;
            color: #999;
            margin-bottom: 6px;
            height: 16px;
        }

        .btn-upload {
            padding: 8px 12px;
            background: var(--sw-blue);
            color: #000;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
        }

        .btn-upload:hover {
            background: var(--sw-yellow);
        }

        .btn-remove-image {
            padding: 6px 10px;
            background: rgba(255, 0, 0, 0.6);
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            width: 100%;
        }

        .btn-remove-image:hover {
            background: rgba(255, 0, 0, 0.9);
        }

        .lore-textarea {
            width: 100%;
            height: 400px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-blue);
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 0.95em;
            border-radius: 3px;
            resize: vertical;
        }

        .lore-textarea:focus {
            outline: none;
            border-color: var(--sw-yellow);
            box-shadow: 0 0 10px rgba(255, 232, 31, 0.3);
        }

        /* Notas Tab Styles */
        /* Notas Tab Styles Unificadas */
        .note-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--sw-accent);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .note-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .note-card-badge {
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .badge-force {
            background: rgba(46, 103, 248, 0.3);
            border: 1px solid var(--sw-blue);
            color: #7aaeff;
        }

        .badge-talent {
            background: rgba(255, 232, 31, 0.15);
            border: 1px solid var(--sw-yellow);
            color: var(--sw-yellow);
        }

        .badge-note {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #999;
            color: #ccc;
        }

        .badge-aptitude {
            background: rgba(0, 200, 120, 0.15);
            border: 1px solid #00c878;
            color: #00c878;
        }

        .note-card-title-static {
            color: var(--sw-yellow);
            font-weight: bold;
            font-size: 1em;
            flex: 1;
        }

        .note-card-title-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            color: var(--sw-yellow);
            padding: 8px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.95em;
        }

        .note-card-title-input:focus {
            outline: none;
            border-color: var(--sw-yellow);
            box-shadow: 0 0 5px rgba(255, 232, 31, 0.2);
        }

        .note-card-remove-btn {
            background: var(--sw-red);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
        }

        .note-card-remove-btn:hover {
            background: rgba(214, 40, 40, 0.8);
        }

        .note-card-textarea {
            width: 100%;
            min-height: 150px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            border-radius: 3px;
            resize: vertical;
            box-sizing: border-box;
        }

        .note-card-textarea:focus {
            outline: none;
            border-color: var(--sw-yellow);
            box-shadow: 0 0 5px rgba(255, 232, 31, 0.2);
        }

        .notes-section-title {
            color: var(--sw-yellow);
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--sw-accent);
            padding-bottom: 8px;
            margin: 20px 0 12px 0;
        }

        .notes-empty-msg {
            color: #555;
            font-size: 0.85em;
            font-style: italic;
            text-align: center;
            padding: 15px;
        }

        .btn-add-note {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .btn-add-note:hover {
            background: rgba(46, 103, 248, 0.8);
        }

    /* Login Screen */
    #loginScreen {
        position: fixed; inset: 0; background: #000;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
        background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                          radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
        background-size: 550px 550px, 350px 350px;
    }
    #loginBox {
        background: rgba(26,26,26,0.97); border: 2px solid var(--sw-yellow);
        border-radius: 10px; padding: 40px; width: 340px;
        box-shadow: 0 0 40px rgba(255,232,31,0.15); text-align: center;
    }
    #loginBox h2 { color: var(--sw-yellow); margin-bottom: 5px; border: none; }
    #loginBox p  { color: #888; font-size: 0.85em; margin-bottom: 25px; }
    #loginBox input {
        width: 100%; margin-bottom: 12px; padding: 10px;
        background: #111; border: 1px solid var(--sw-accent);
        color: white; border-radius: 4px; box-sizing: border-box; font-size: 0.95em;
    }
    #loginBox input:focus { outline: none; border-color: var(--sw-yellow); }
    #btnLogin {
        width: 100%; padding: 11px; background: var(--sw-yellow); color: black;
        border: none; border-radius: 4px; font-weight: bold; font-size: 1em;
        cursor: pointer; margin-top: 4px;
    }
    #btnLogin:hover { background: #ffe000; }
    #loginError { color: #ff6b6b; font-size: 0.82em; margin-top: 10px; min-height: 18px; }
    #userBar {
        display: none; align-items: center; gap: 12px;
        font-size: 0.82em; color: #aaa; margin-bottom: 8px;
    }
    #btnLogout {
        background: transparent; border: 1px solid #555; color: #aaa;
        padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 0.8em;
    }
    #btnLogout:hover { border-color: #D62828; color: #D62828; }
    #syncStatus { font-size: 0.75em; color: #555; margin-left: auto; }

        /* ============================================
           RESPONSIVO MOBILE
        ============================================ */
        @media (max-width: 768px) {

            body {
                padding: 8px;
            }

            h1 {
                font-size: 1.2em;
                letter-spacing: 1px;
            }

            h2 { font-size: 1em; }
            h3 { font-size: 0.95em; }

            /* Header */
            header h1 { font-size: 1.3em; }
            header p  { font-size: 0.78em; }

            /* Abas de personagem no topo */
            .tabs-header {
                gap: 6px;
                padding: 6px 0;
            }
            .tab-btn {
                padding: 8px 12px;
                font-size: 0.82em;
            }
            .add-tab-btn {
                padding: 8px 10px;
                font-size: 0.82em;
            }

            /* Conteúdo da ficha */
            .sheet-content {
                padding: 10px;
            }

            /* Abas internas Ficha / História / Notas */
            .sheet-tabs {
                gap: 4px !important;
                flex-wrap: nowrap;
                overflow-x: auto;
            }
            .sheet-tabs .tab-btn {
                padding: 8px 12px !important;
                font-size: 0.82em;
                white-space: nowrap;
            }

            /* Grid de painéis — 1 coluna no mobile */
            .grid-section {
                grid-template-columns: 1fr !important;
                gap: 12px;
                margin-bottom: 16px;
            }

            /* Imagem + info básica: empilha verticalmente */
            .sheet-top-row {
                flex-direction: column !important;
            }
            .character-image-panel {
                width: 100% !important;
                max-width: 220px;
                margin: 0 auto 12px auto;
            }

            /* Características grid — 2 colunas */
            .characteristics-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            /* Tabelas — scroll horizontal */
            .panel {
                overflow-x: auto;
            }
            table {
                min-width: 400px;
            }

            /* Inputs de atributo menores */
            .attr-input {
                width: 40px;
                font-size: 0.85em;
                padding: 4px;
            }

            /* Botões de ação no rodapé */
            .save-load {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
                text-align: center;
            }
            .btn-action {
                padding: 10px 14px;
                font-size: 0.85em;
                margin-left: 0;
                flex: 1;
                min-width: 120px;
            }

            /* Classe row */
            .class-row {
                flex-wrap: wrap;
            }
            .class-row select { min-width: 0; }
            .class-row input  { width: 60px; flex: 0 0 60px; }

            /* Modal de classes */
            .modal-content {
                margin: 2% auto;
                padding: 15px;
                width: 98%;
            }
            .class-selector {
                gap: 6px;
            }
            .class-btn {
                padding: 6px 10px;
                font-size: 0.8em;
            }

            /* Notas */
            .note-card { padding: 10px; }
            .note-card-textarea { min-height: 100px; }
            .lore-textarea { height: 280px; }

            /* userBar */
            #userBar {
                font-size: 0.75em;
                flex-wrap: wrap;
                gap: 6px;
            }

            /* Login box */
            #loginBox {
                width: 90%;
                padding: 28px 20px;
            }
        }

        @media (max-width: 400px) {
            h1 { font-size: 1.05em; }
            .characteristics-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
            table { min-width: 320px; }
        }


        .tab-btn.user-mestre { border-bottom: 3px solid #D62828 !important; }
        .tab-btn.user-dede { border-bottom: 3px solid #8e44ad !important; }
        .tab-btn.user-paulo { border-bottom: 3px solid #2E67F8 !important; }
        .tab-btn.user-vinicius { border-bottom: 3px solid #27ae60 !important; }
        
        .tab-btn.active.user-mestre { background: #D62828 !important; color: white !important; }
        .tab-btn.active.user-dede { background: #8e44ad !important; color: white !important; }
        .tab-btn.active.user-paulo { background: #2E67F8 !important; color: white !important; }
        .tab-btn.active.user-vinicius { background: #27ae60 !important; color: white !important; }
    </style>



<script type="module">
import { initializeApp }           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
                                   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection }

function startListeners() {
    const userEmail = window._currentUser.email;
    const userInfo  = PLAYER_INFO[userEmail];

    if (window._isMaster) {
        // Mestre escuta apenas coleções de jogadores (não a própria)
        const playerIds = Object.entries(PLAYER_INFO)
            .filter(([, info]) => info.id !== 'mestre')
            .map(([, info]) => info.id);

        playerIds.forEach(ownerId => {
            const unsub = onSnapshot(collection(db, `sheets_${ownerId}`), snap => {
                // Remove fichas desse owner que sumiram do Firestore
                const currentIds = snap.docs.map(d => d.id);
                window._sheets = window._sheets.filter(s =>
                    s.owner !== ownerId || (s.firebaseId && currentIds.includes(s.firebaseId))
                );
                // Atualiza/adiciona as que existem
                snap.docs.forEach(d => mergeSheet({ ...d.data(), firebaseId: d.id, owner: ownerId }));
                if (typeof renderSheets === 'function') renderSheets();
            });
            unsubListeners.push(unsub);
        });

        // Mestre também escuta a própria coleção
        const unsub = onSnapshot(collection(db, 'sheets_mestre'), snap => {
            const currentIds = snap.docs.map(d => d.id);
            window._sheets = window._sheets.filter(s =>
                s.owner !== 'mestre' || (s.firebaseId && currentIds.includes(s.firebaseId))
            );
            snap.docs.forEach(d => mergeSheet({ ...d.data(), firebaseId: d.id, owner: 'mestre' }));
            if (typeof renderSheets === 'function') renderSheets();
        });
        unsubListeners.push(unsub);

    } else if (userInfo) {
        const unsub = onSnapshot(collection(db, `sheets_${userInfo.id}`), snap => {
            const currentIds = snap.docs.map(d => d.id);
            window._sheets = window._sheets.filter(s =>
                s.firebaseId && currentIds.includes(s.firebaseId)
            );
            snap.docs.forEach(d => mergeSheet({ ...d.data(), firebaseId: d.id, owner: userInfo.id }));
            if (typeof renderSheets === 'function') renderSheets();
        });
        unsubListeners.push(unsub);
    }
}

function mergeSheet(data) {
    if (!data.firebaseId) return;
    const idx = window._sheets.findIndex(s => s.firebaseId === data.firebaseId);
    if (idx >= 0) {
        window._sheets[idx] = data;
    } else {
        window._sheets.push(data);
        if (!window._activeSheetId) window._activeSheetId = data.id;
    }
}

window.PLAYER_INFO = PLAYER_INFO;

<script>
    let sheets = [];
    let activeSheetId = null;

    Object.defineProperty(window, '_sheets', {
        get() { return sheets; },
        set(value) { sheets = value; }
    });

    Object.defineProperty(window, '_activeSheetId', {
        get() { return activeSheetId; },
        set(value) { activeSheetId = value; }
    });


    let creatingSheet = false;
    window._sheetCreationLock = false;

    async function addNewSheet() {

        if (creatingSheet || window._sheetCreationLock) {
            return;
        }

        creatingSheet = true;
        window._sheetCreationLock = true;

        document.querySelectorAll('.add-tab-btn').forEach(btn => {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
        });

        try {

            const userEmail = window._currentUser.email;
            const userInfo = window.PLAYER_INFO[userEmail];

            if (!userInfo) return;

            const newSheet = createEmptySheet();

            newSheet.owner = userInfo.id;
            newSheet.firebaseId = crypto.randomUUID();

            await window._fbSetDoc(
                `sheets_${userInfo.id}`,
                newSheet.firebaseId,
                newSheet
            );

            activeSheetId = newSheet.id;

        } finally {

            setTimeout(() => {
                creatingSheet = false;
                window._sheetCreationLock = false;

                document.querySelectorAll('.add-tab-btn').forEach(btn => {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                });

            }, 2000);
        }
    }

    function removeSheet(id) {
        id = Number(id);

        const sheet = sheets.find(s => s.id === id);

        if (!sheet) return;

        const userEmail = window._currentUser.email;
        const userInfo = window.PLAYER_INFO[userEmail];

        if (!window._isMaster && sheet.owner !== userInfo.id) {
            setSyncStatus('⚠ Você só pode apagar suas próprias fichas.');
            return;
        }

        const nomeFicha = sheet.name || 'Sem Nome';
        const owner     = sheet.owner;
        const fbId      = sheet.firebaseId;

        // Usa modal de confirmação (confirm() não funciona em iframe)
        window._showConfirmModal(
            `Apagar a ficha "<strong>${nomeFicha}</strong>"? Esta ação não pode ser desfeita.`,
            () => window._fbDeleteDoc(`sheets_${owner}`, fbId)
        );
    }

    let saveTimeout;

    function saveToLocalStorage() {

        clearTimeout(saveTimeout);

        saveTimeout = setTimeout(() => {

            const sheet = sheets.find(
                s => s.id === activeSheetId
            );

            if (!sheet || !window._currentUser || !window._fbSetDoc) {
                return;
            }

            const statusEl = document.getElementById('syncStatus');

            if (statusEl) {
                statusEl.textContent = '💾 Salvando...';
            }

            window._fbSetDoc(
                `sheets_${sheet.owner}`,
                sheet.firebaseId,
                sheet
            ).then(() => {

                if (statusEl) {

                    statusEl.textContent = '✓ Salvo';

                    setTimeout(() => {
                        statusEl.textContent = '';
                    }, 2000);
                }
            });

        }, 500);
    }
</script>

    function updateImageTransform(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (!sheet) return;

        const img = document.querySelector(`#sheet-${sheetId} .character-image`);
        const info = document.querySelector(`#sheet-${sheetId} .zoom-info`);
        
        if (img) {
            img.style.transform = `scale(${sheet.imageState.zoom}) translate(${sheet.imageState.offsetX}px, ${sheet.imageState.offsetY}px)`;
        }
        if (info) {
            info.textContent = `Zoom: ${(sheet.imageState.zoom * 100).toFixed(0)}%`;
        }
    }

    function zoomIn(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (sheet) {
            sheet.imageState.zoom = Math.min(sheet.imageState.zoom + 0.2, 3);
            updateImageTransform(sheetId);
            saveToLocalStorage();
        }
    }

    function zoomOut(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (sheet) {
            sheet.imageState.zoom = Math.max(sheet.imageState.zoom - 0.2, 0.5);
            updateImageTransform(sheetId);
            saveToLocalStorage();
        }
    }

    function fitImageToContainer(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (sheet) {
            sheet.imageState.zoom = 1;
            sheet.imageState.offsetX = 0;
            sheet.imageState.offsetY = 0;
            updateImageTransform(sheetId);
            saveToLocalStorage();
        }
    }

    function setupImagePanEvents(sheetId) {
        const container = document.querySelector(`#sheet-${sheetId} .image-container-9-16`);
        const sheet = sheets.find(s => s.id === sheetId);
        
        if (!container || !sheet) return;

        let isDragging = false;
        let startX, startY;

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            container.classList.add('active');
        });

        const handleMouseMove = (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            sheet.imageState.offsetX += deltaX / sheet.imageState.zoom;
            sheet.imageState.offsetY += deltaY / sheet.imageState.zoom;

            startX = e.clientX;
            startY = e.clientY;

            updateImageTransform(sheetId);
        };

        const handleMouseUp = () => {
            if (isDragging) {
                isDragging = false;
                container.classList.remove('active');
                saveToLocalStorage();
            }
        };

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) zoomIn(sheetId);
            else zoomOut(sheetId);
        });
    }

    function renderCustomNotes(sheet) {
        if (!sheet.customNotes || sheet.customNotes.length === 0) {
            return '<div class="notes-empty-msg">Nenhuma nota personalizada adicionada ainda. Clique em "+ Adicionar Nota" para criar uma.</div>';
        }
        return sheet.customNotes.map((note, idx) => {
            const escapedTitle = note.title.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;');
            const escapedText = note.text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `<div class="note-card">
                <div class="note-card-header">
                    <span class="note-card-badge badge-note">Nota</span>
                    <input type="text" class="note-card-title-input" value="${escapedTitle}" onchange="updateCustomNoteTitle(${sheet.id}, ${idx}, this.value)" placeholder="Título da nota">
                    <button class="note-card-remove-btn" onclick="removeCustomNote(${sheet.id}, ${idx})">✕</button>
                </div>
                <textarea class="note-card-textarea" placeholder="Escreva o conteúdo da nota aqui..." onchange="updateCustomNoteText(${sheet.id}, ${idx}, this.value)">${escapedText}</textarea>
            </div>`;
        }).join('');
    }

    function renderNotesSection(sheet, field, prefix, badgeLabel, badgeClass, placeholder, emptyMsg) {
        const items = sheet[field] ? sheet[field].filter(item => item && item.trim() !== '') : [];
        if (items.length === 0) {
            return `<div class="notes-empty-msg">${emptyMsg}</div>`;
        }
        return items.map(item => {
            const key = prefix + '_' + encodeURIComponent(item);
            const savedText = (sheet.noteDetails && sheet.noteDetails[key]) ? sheet.noteDetails[key] : '';
            const escapedItem = item.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;');
            const escapedKey = key.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            const escapedText = savedText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `<div class="note-card">
                <div class="note-card-header">
                    <span class="note-card-badge ${badgeClass}">${badgeLabel}</span>
                    <span class="note-card-title-static">${escapedItem}</span>
                </div>
                <textarea class="note-card-textarea" placeholder="${placeholder}" onchange="updateNoteDetail(${sheet.id}, '${escapedKey}', this.value)">${escapedText}</textarea>
            </div>`;
        }).join('');
    }

    function renderSheets() {
        const container = document.getElementById('sheetsContainer');
        container.innerHTML = '';

        // Renderizar abas superiores de troca de personagem
        const tabsHeader = document.getElementById('tabsHeader');
        tabsHeader.innerHTML = '<button class="add-tab-btn" onclick="addNewSheet()">+ Nova Ficha</button>';
        
        sheets.forEach(sheet => {
            const btn = document.createElement('button');
            const ownerInfo = Object.values(window.PLAYER_INFO || {}).find(i => i.id === sheet.owner);
            const colorClass = ownerInfo ? ownerInfo.color : '';
            const isMasterSheet = sheet.owner === 'mestre';
            btn.className = `tab-btn ${colorClass} ${sheet.id === activeSheetId ? 'active' : ''}`;
            btn.innerHTML = `${isMasterSheet ? '👑 ' : ''}${sheet.name || 'Sem Nome'} <span class="remove-tab" onclick="event.stopPropagation(); removeSheet(${sheet.id})">✕</span>`;
            btn.onclick = () => switchSheet(sheet.id);
            tabsHeader.appendChild(btn);
        });


        
        sheets.forEach(sheet => {
            const btn = document.createElement('button');
            const ownerInfo = Object.values(window.PLAYER_INFO || {}).find(i => i.id === sheet.owner);
            const colorClass = ownerInfo ? ownerInfo.color : '';
            const isMasterSheet = sheet.owner === 'mestre';
            btn.className = `tab-btn ${colorClass} ${sheet.id === activeSheetId ? 'active' : ''}`;
            btn.innerHTML = `${isMasterSheet ? '👑 ' : ''}${sheet.name || 'Sem Nome'} <span class="remove-tab" onclick="event.stopPropagation(); removeSheet(${sheet.id})">✕</span>`;
            btn.onclick = () => switchSheet(sheet.id);
            tabsHeader.appendChild(btn);
        });
    }

    function updateNestedField(id, parent, field, value) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet && sheet[parent]) {
            sheet[parent][field] = value;
            saveToLocalStorage();
        }
    }

    function updateAttr(id, attr, value) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet) {
            sheet.attributes[attr].val = parseInt(value);
            sheet.attributes[attr].mod = Math.floor((parseInt(value) - 10) / 2);
            renderSheets();
            saveToLocalStorage();
        }
    }

    function updateDefense(id, def, field, value) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet) {
            sheet.defenses[def][field] = parseInt(value);
            renderSheets();
            saveToLocalStorage();
        }
    }

    function updateDynamicItem(id, field, index, value) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet && sheet[field]) {
            sheet[field][index] = value;
            // Se for um poder da força, talento ou aptidão, re-renderizar para atualizar a aba de notas
            if (field === 'forcePowers' || field === 'talents' || field === 'aptitudes') {
                renderSheets();
            }
            saveToLocalStorage();
        }
    }

    function removeDynamicItem(id, field, index) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet && sheet[field]) {
            sheet[field].splice(index, 1);
            renderSheets();
            saveToLocalStorage();
        }
    }

    function addDynamicItem(id, field) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet && sheet[field] !== undefined) {
            sheet[field].push("");
            renderSheets();
            saveToLocalStorage();
        }
    }

    function updateClassRow(id, index, value, field) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet && sheet.classes[index]) {
            sheet.classes[index][field] = field === 'level' ? parseInt(value) : value;
            renderSheets();
            saveToLocalStorage();
        }
    }

    function removeClassRow(id, index) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet && sheet.classes.length > 1) {
            sheet.classes.splice(index, 1);
            renderSheets();
            saveToLocalStorage();
        }
    }

    function addClass(id) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet) {
            sheet.classes.push({ name: "Jedi", level: 1 });
            renderSheets();
            saveToLocalStorage();
        }
    }

    function calculateDefense(sheet, defType) {
        const baseDefense = 10;
        const def = sheet.defenses[defType];
        let attrMod = 0;

        if (defType === 'REF') attrMod = sheet.attributes.DES.mod;
        else if (defType === 'FORT') attrMod = sheet.attributes.CON.mod;
        else if (defType === 'VON') attrMod = sheet.attributes.SAB.mod;

        return baseDefense + attrMod + (def?.level || 0) + (def?.class || 0) + (def?.hab || 0) + (def?.other || 0);
    }

    // addNewSheet definido no módulo Firebase acima

    function removeSheet(id) {
        id = Number(id);
        const sheet = sheets.find(s => s.id === id);
        if (!sheet) return;
        showConfirmModal(
            'Apagar a ficha "<strong>' + (sheet.name || 'Sem Nome') + '</strong>"? Esta ação não pode ser desfeita.',
            () => {
                if (sheet.owner && sheet.firebaseId && window._fbDeleteDoc) {
                    window._fbDeleteDoc('sheets_' + sheet.owner, sheet.firebaseId);
                } else {
                    sheets = sheets.filter(s => s.id !== sheet.id);
                    if (activeSheetId === sheet.id)
                        activeSheetId = sheets.length > 0 ? sheets[0].id : null;
                    renderSheets();
                }
            }
        );
    }

    function showConfirmModal(message, onConfirm) {
        let modal = document.getElementById('confirmModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'confirmModal';
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:99999;';
            modal.innerHTML = '<div style="background:#1a1a1a;border:2px solid #FFE81F;border-radius:10px;padding:30px;max-width:380px;width:90%;text-align:center;"><p id="confirmMsg" style="color:#e0e0e0;margin-bottom:24px;line-height:1.5;"></p><div style="display:flex;gap:12px;justify-content:center;"><button id="confirmYes" style="padding:10px 24px;background:#D62828;color:white;border:none;border-radius:5px;cursor:pointer;font-weight:bold;">Apagar</button><button id="confirmNo" style="padding:10px 24px;background:#333;color:#ccc;border:1px solid #555;border-radius:5px;cursor:pointer;">Cancelar</button></div></div>';
            document.body.appendChild(modal);
        }
        document.getElementById('confirmMsg').innerHTML = message;
        modal.style.display = 'flex';
        const yes = document.getElementById('confirmYes');
        const no  = document.getElementById('confirmNo');
        const close = () => { modal.style.display = 'none'; };
        yes.onclick = () => { close(); onConfirm(); };
        no.onclick  = close;
        modal.onclick = (e) => { if (e.target === modal) close(); };
    }
    window._showConfirmModal = showConfirmModal;



















    function switchSheet(id) {
        activeSheetId = id;
        renderSheets();
    }

    function saveToLocalStorage() {
        const sheet = sheets.find(s => s.id === activeSheetId);
        if (!sheet || !window._currentUser || !window._fbSetDoc) return;

        // Garantir firebaseType
        if (!sheet.firebaseType) {
            sheet.firebaseType = window._isMaster ? 'master' : 'player';
        }

        const PLAYER_MAP = {
            "dede@campanha.com":     "dede",
            "paulo@campanha.com":    "paulo",
            "vinicius@campanha.com": "vinicius"
        };

        let colName, docId;
        if (sheet.firebaseType === 'master') {
            colName = 'master_sheets';
            docId   = sheet.firebaseId || ('master_' + sheet.id);
        } else {
            colName = 'sheets';
            docId   = sheet.firebaseId || PLAYER_MAP[window._currentUser.email];
        }
        if (!docId) return;

        sheet.firebaseId   = docId;
        sheet.firebaseType = sheet.firebaseType;

        const statusEl = document.getElementById('syncStatus');
        if (statusEl) statusEl.textContent = '💾 Salvando...';

        window._fbSetDoc(colName, docId, sheet)
            .then(() => {
                if (statusEl) {
                    statusEl.textContent = '✓ Salvo';
                    setTimeout(() => { statusEl.textContent = ''; }, 2000);
                }
            })
            .catch(e => {
                if (statusEl) statusEl.textContent = '⚠ Erro: ' + e.code;
                console.error('save error:', e);
            });
    }

    function loadFromLocalStorage() {
        const data = localStorage.getItem('swSheets');
        if (data) {
            sheets = JSON.parse(data);
            if (sheets.length > 0) {
                activeSheetId = sheets[0].id;
                // Garantir que todas as fichas carregadas tenham os campos necessários
                sheets.forEach(s => {
                    if (!s.imageState) s.imageState = { zoom: 1, offsetX: 0, offsetY: 0 };
                    if (!s.noteDetails) s.noteDetails = {};
                    if (s.generalNotes === undefined) s.generalNotes = '';
                    if (!s.customNotes) s.customNotes = [];
                    if (!s.activeTab) s.activeTab = 'ficha';
                });
            }
        }
    }

    function exportAsHTML() {
        if (sheets.length === 0) {
            alert('Nenhuma ficha para exportar!');
            return;
        }

        const sheetToExport = sheets.find(s => s.id === activeSheetId) || sheets[0];
        const characterName = sheetToExport.name.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'personagem';
        
        // Obter o HTML completo da página atual
        let htmlContent = document.documentElement.outerHTML;
        
        // Substituir os dados iniciais para que a ficha exportada já comece com os dados
        const sheetsData = JSON.stringify([sheetToExport]);
        htmlContent = htmlContent.replace(
            /let sheets = \[\];/,
            'let sheets = ' + sheetsData + ';'
        ).replace(
            /let activeSheetId = null;/,
            'let activeSheetId = ' + sheetToExport.id + ';'
        ).replace(
            /loadFromLocalStorage\(\);/,
            '// Dados carregados do arquivo exportado'
        );
        
        // Criar e baixar o arquivo
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = characterName + '_star_wars.html';
        link.click();
        URL.revokeObjectURL(url);
    }

    function openClassReference() {
        const modal = document.getElementById('classModal');
        const selector = document.getElementById('classSelector');
        const details = document.getElementById('classDetails');

        selector.innerHTML = '';
        details.innerHTML = '';

        HEROIC_CLASSES.forEach(className => {
            const btn = document.createElement('button');
            btn.className = 'class-btn active';
            btn.textContent = className;
            btn.onclick = () => showClassDetails(className);
            selector.appendChild(btn);
        });

        PRESTIGE_CLASSES.forEach(className => {
            const btn = document.createElement('button');
            btn.className = 'class-btn';
            btn.textContent = className;
            btn.onclick = () => showClassDetails(className);
            selector.appendChild(btn);
        });

        showClassDetails(HEROIC_CLASSES[0]);
        modal.classList.add('active');
    }

    function showClassDetails(className) {
        const details = document.getElementById('classDetails');
        let classData = CLASS_DATA[className];
        if (!classData) {
            classData = Object.values(CLASS_DATA).find(c => c.nome === className);
        }

        if (!classData) {
            details.innerHTML = `<p>Dados da classe "${className}" não disponíveis.</p>`;
            return;
        }

        details.innerHTML = `
            <div class="class-info active">
                <h3>${classData.nome}</h3>
                <div class="class-description">${classData.desc}</div>
                <h4>Pontos de Vida</h4>
                <p>${classData.hp}</p>
                <h4>Pontos de Força</h4>
                <p>${classData.forcePoints}</p>
                <h4>Bônus de Defesa</h4>
                <p>${classData.defenses}</p>
                <h4>Perícias</h4>
                <p>${classData.skills}</p>
                <h4>Talentos Iniciais</h4>
                <ul>${classData.initialTalents.map(t => `<li>${t}</li>`).join('')}</ul>
                <h4>Progressão de Classe</h4>
                <table class="class-table">
                    <tbody>
                        ${classData.table.map((row, idx) => `
                            <tr>
                                ${row.map(cell => idx === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;

        // Atualizar botões
        document.querySelectorAll('.class-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent === className) {
                btn.classList.add('active');
            }
        });
    }

    function closeClassReference() {
        document.getElementById('classModal').classList.remove('active');
    }

    // Inicializar
    // Dados carregados pelo Firebase via onSnapshot
    renderSheets();
</script>
