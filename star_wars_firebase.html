<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Saga Edition - Ficha de Personagem</title>
    <style>
        :root {
            --sw-yellow: #FFE81F;
            --sw-blue: #2E67F8;
            --sw-red: #D62828;
            --sw-bg: #000000;
            --sw-panel: #1A1A1A;
            --sw-border: #333333;
            --sw-text: #E0E0E0;
            --sw-accent: #4A4A4A;
        }

        body {
            background-color: var(--sw-bg);
            color: var(--sw-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        h1, h2, h3 {
            color: var(--sw-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--sw-yellow);
            padding-bottom: 5px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Tabs Styling */
        .tabs-container {
            margin-bottom: 20px;
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            border-bottom: 2px solid var(--sw-accent);
        }

        
        .tab-btn {
            background: var(--sw-panel);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            white-space: nowrap;
            display: inline-block;
            margin-right: 5px;
        }


        .tab-btn.active {
            background: var(--sw-yellow);
            color: black;
            font-weight: bold;
            border-color: var(--sw-yellow);
        }

        .add-tab-btn {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .remove-tab {
            color: var(--sw-red);
            font-weight: bold;
            cursor: pointer;
            padding: 0 5px;
        }

        /* Sheet Styling */
        .sheet-content {
            display: none;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid var(--sw-border);
            padding: 20px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 0 20px rgba(255, 232, 31, 0.1);
        }

        .sheet-content.active {
            display: block;
        }

        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            padding: 15px;
            border-radius: 5px;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.8em;
            color: var(--sw-yellow);
            margin-bottom: 3px;
            font-weight: bold;
        }

        input, select, textarea {
            background: #222;
            border: 1px solid var(--sw-accent);
            color: white;
            padding: 8px;
            border-radius: 3px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--sw-yellow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            font-size: 0.7em;
            color: var(--sw-yellow);
            padding: 5px;
            border-bottom: 1px solid var(--sw-accent);
        }

        td {
            padding: 5px;
            border-bottom: 1px solid var(--sw-accent);
        }

        .attr-input {
            width: 50px;
            text-align: center;
        }

        .dynamic-list {
            list-style: none;
            padding: 0;
        }

        .dynamic-item {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .dynamic-item input {
            flex-grow: 1;
        }

        .btn-add {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .btn-remove {
            background: var(--sw-red);
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        .condition-track {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .condition-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .save-load {
            margin-top: 20px;
            text-align: right;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }

        .btn-save { background: #28a745; color: white; border: none; }

        .class-row {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .class-row select, .class-row input {
            flex: 1;
        }

        /* Características Grid */
        .characteristics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .characteristics-grid .input-group {
            margin-bottom: 0;
        }

        /* Class Reference Styling */
        .class-reference {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .class-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .class-btn {
            background: var(--sw-panel);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }

        .class-btn.active {
            background: var(--sw-yellow);
            color: black;
            border-color: var(--sw-yellow);
        }

        .class-info {
            display: none;
        }

        .class-info.active {
            display: block;
        }

        .class-info h4 {
            color: var(--sw-yellow);
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 1em;
            border-bottom: 1px solid var(--sw-accent);
            padding-bottom: 5px;
        }

        .class-info p {
            font-size: 0.9em;
            line-height: 1.5;
            margin: 5px 0;
        }

        .class-info ul {
            margin: 5px 0;
            padding-left: 20px;
        }

        .class-info li {
            font-size: 0.9em;
            margin: 3px 0;
        }

        .library-layout {
            display: grid;
            grid-template-columns: minmax(220px, 280px) 1fr;
            gap: 20px;
        }

        .library-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .library-item-btn {
            background: rgba(0, 0, 0, 0.35);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            border-radius: 3px;
            padding: 10px;
            text-align: left;
            cursor: pointer;
            font-weight: bold;
        }

        .library-item-btn:hover,
        .library-item-btn.active {
            border-color: var(--sw-yellow);
            color: var(--sw-yellow);
        }

        .library-panel {
            background: rgba(255, 232, 31, 0.05);
            border-left: 3px solid var(--sw-yellow);
            padding: 15px;
            min-height: 180px;
        }

        .library-tree-title {
            color: var(--sw-yellow);
            margin-top: 0;
        }

        .class-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85em;
        }

        .class-table th {
            background: rgba(255, 232, 31, 0.1);
            color: var(--sw-yellow);
            padding: 8px;
            text-align: left;
            border: 1px solid var(--sw-accent);
        }

        .class-table td {
            padding: 6px 8px;
            border: 1px solid var(--sw-accent);
        }

        .class-table tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            overflow: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background-color: var(--sw-panel);
            margin: 3% auto;
            padding: 20px;
            border: 2px solid var(--sw-yellow);
            width: 95%;
            max-width: 1000px;
            border-radius: 5px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            color: var(--sw-yellow);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover {
            color: white;
        }

        .btn-reference {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        .class-description {
            background: rgba(255, 232, 31, 0.05);
            border-left: 3px solid var(--sw-yellow);
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }

        .feature-item {
            background: rgba(0, 0, 0, 0.3);
            border-left: 2px solid var(--sw-blue);
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 3px;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .character-image-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--sw-blue);
            border-radius: 5px;
            padding: 10px;
            text-align: center;
        }

        .character-image-panel h4 {
            margin: 0 0 10px 0;
            color: var(--sw-yellow);
            font-size: 0.9em;
        }

        .image-upload-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .image-container-9-16 {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--sw-blue);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: grab;
        }

        .image-container-9-16.active {
            cursor: grabbing;
        }

        .image-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.1s ease-out;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px dashed var(--sw-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.85em;
            cursor: pointer;
            text-align: center;
            padding: 10px;
        }

        .image-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 8px;
        }

        .btn-control {
            padding: 6px 12px;
            background: var(--sw-blue);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75em;
            transition: background 0.2s;
        }

        .btn-control:hover {
            background: var(--sw-yellow);
            color: black;
        }

        .zoom-info {
            font-size: 0.75em;
            color: #999;
            margin-bottom: 6px;
            height: 16px;
        }

        .btn-upload {
            padding: 8px 12px;
            background: var(--sw-blue);
            color: #000;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
        }

        .btn-upload:hover {
            background: var(--sw-yellow);
        }

        .btn-remove-image {
            padding: 6px 10px;
            background: rgba(255, 0, 0, 0.6);
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            width: 100%;
        }

        .btn-remove-image:hover {
            background: rgba(255, 0, 0, 0.9);
        }

        .lore-textarea {
            width: 100%;
            height: 400px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-blue);
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 0.95em;
            border-radius: 3px;
            resize: vertical;
        }

        .lore-textarea:focus {
            outline: none;
            border-color: var(--sw-yellow);
            box-shadow: 0 0 10px rgba(255, 232, 31, 0.3);
        }

        /* Notas Tab Styles */
        /* Notas Tab Styles Unificadas */
        .note-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--sw-accent);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .note-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .note-card-badge {
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .badge-force {
            background: rgba(46, 103, 248, 0.3);
            border: 1px solid var(--sw-blue);
            color: #7aaeff;
        }

        .badge-talent {
            background: rgba(255, 232, 31, 0.15);
            border: 1px solid var(--sw-yellow);
            color: var(--sw-yellow);
        }

        .badge-note {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #999;
            color: #ccc;
        }

        .badge-aptitude {
            background: rgba(0, 200, 120, 0.15);
            border: 1px solid #00c878;
            color: #00c878;
        }

        .note-card-title-static {
            color: var(--sw-yellow);
            font-weight: bold;
            font-size: 1em;
            flex: 1;
        }

        .note-card-title-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            color: var(--sw-yellow);
            padding: 8px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.95em;
        }

        .note-card-title-input:focus {
            outline: none;
            border-color: var(--sw-yellow);
            box-shadow: 0 0 5px rgba(255, 232, 31, 0.2);
        }

        .note-card-remove-btn {
            background: var(--sw-red);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
        }

        .note-card-remove-btn:hover {
            background: rgba(214, 40, 40, 0.8);
        }

        .note-card-textarea {
            width: 100%;
            min-height: 150px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            border-radius: 3px;
            resize: vertical;
            box-sizing: border-box;
        }

        .note-card-textarea:focus {
            outline: none;
            border-color: var(--sw-yellow);
            box-shadow: 0 0 5px rgba(255, 232, 31, 0.2);
        }

        .notes-section-title {
            color: var(--sw-yellow);
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--sw-accent);
            padding-bottom: 8px;
            margin: 20px 0 12px 0;
        }

        .notes-empty-msg {
            color: #555;
            font-size: 0.85em;
            font-style: italic;
            text-align: center;
            padding: 15px;
        }

        .btn-add-note {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .btn-add-note:hover {
            background: rgba(46, 103, 248, 0.8);
        }

    /* Login Screen */
    #loginScreen {
        position: fixed; inset: 0; background: #000;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
        background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                          radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
        background-size: 550px 550px, 350px 350px;
    }
    #loginBox {
        background: rgba(26,26,26,0.97); border: 2px solid var(--sw-yellow);
        border-radius: 10px; padding: 40px; width: 340px;
        box-shadow: 0 0 40px rgba(255,232,31,0.15); text-align: center;
    }
    #loginBox h2 { color: var(--sw-yellow); margin-bottom: 5px; border: none; }
    #loginBox p  { color: #888; font-size: 0.85em; margin-bottom: 25px; }
    #loginBox input {
        width: 100%; margin-bottom: 12px; padding: 10px;
        background: #111; border: 1px solid var(--sw-accent);
        color: white; border-radius: 4px; box-sizing: border-box; font-size: 0.95em;
    }
    #loginBox input:focus { outline: none; border-color: var(--sw-yellow); }
    #btnLogin {
        width: 100%; padding: 11px; background: var(--sw-yellow); color: black;
        border: none; border-radius: 4px; font-weight: bold; font-size: 1em;
        cursor: pointer; margin-top: 4px;
    }
    #btnLogin:hover { background: #ffe000; }
    #loginError { color: #ff6b6b; font-size: 0.82em; margin-top: 10px; min-height: 18px; }
    #userBar {
        display: none; align-items: center; gap: 12px;
        font-size: 0.82em; color: #aaa; margin-bottom: 8px;
    }
    #btnLogout {
        background: transparent; border: 1px solid #555; color: #aaa;
        padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 0.8em;
    }
    #btnLogout:hover { border-color: #D62828; color: #D62828; }
    #syncStatus { font-size: 0.75em; color: #555; margin-left: auto; }

        /* ============================================
           RESPONSIVO MOBILE
        ============================================ */
        @media (max-width: 768px) {

            body {
                padding: 8px;
            }

            h1 {
                font-size: 1.2em;
                letter-spacing: 1px;
            }

            h2 { font-size: 1em; }
            h3 { font-size: 0.95em; }

            /* Header */
            header h1 { font-size: 1.3em; }
            header p  { font-size: 0.78em; }

            /* Abas de personagem no topo */
            .tabs-header {
                gap: 6px;
                padding: 6px 0;
            }
            .tab-btn {
                padding: 8px 12px;
                font-size: 0.82em;
            }
            .add-tab-btn {
                padding: 8px 10px;
                font-size: 0.82em;
            }

            /* Conteúdo da ficha */
            .sheet-content {
                padding: 10px;
            }

            /* Abas internas Ficha / História / Notas */
            .sheet-tabs {
                gap: 4px !important;
                flex-wrap: nowrap;
                overflow-x: auto;
            }
            .sheet-tabs .tab-btn {
                padding: 8px 12px !important;
                font-size: 0.82em;
                white-space: nowrap;
            }

            /* Grid de painéis — 1 coluna no mobile */
            .grid-section {
                grid-template-columns: 1fr !important;
                gap: 12px;
                margin-bottom: 16px;
            }

            /* Imagem + info básica + atributos: empilha verticalmente */
            .sheet-top-row {
                flex-direction: column !important;
            }
            .sheet-top-row > * {
                width: 100% !important;
                min-width: 0 !important;
                flex-shrink: 1 !important;
            }
            .character-image-panel {
                width: 100% !important;
                max-width: 220px;
                margin: 0 auto 12px auto;
            }

            /* Características grid — 2 colunas */
            .characteristics-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            /* Tabelas — scroll horizontal */
            .panel {
                overflow-x: auto;
            }
            table {
                min-width: 400px;
            }

            /* Inputs de atributo menores */
            .attr-input {
                width: 40px;
                font-size: 0.85em;
                padding: 4px;
            }

            /* Botões de ação no rodapé */
            .save-load {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
                text-align: center;
            }
            .btn-action {
                padding: 10px 14px;
                font-size: 0.85em;
                margin-left: 0;
                flex: 1;
                min-width: 120px;
            }

            /* Classe row */
            .class-row {
                flex-wrap: wrap;
            }
            .class-row select { min-width: 0; }
            .class-row input  { width: 60px; flex: 0 0 60px; }

            /* Modal de classes */
            .modal-content {
                margin: 2% auto;
                padding: 15px;
                width: 98%;
            }
            .class-selector {
                gap: 6px;
            }
            .class-btn {
                padding: 6px 10px;
                font-size: 0.8em;
            }
            .library-layout {
                grid-template-columns: 1fr;
            }
            .library-list {
                max-height: 45vh;
            }

            /* Notas */
            .note-card { padding: 10px; }
            .note-card-textarea { min-height: 100px; }
            .lore-textarea { height: 280px; }

            /* userBar */
            #userBar {
                font-size: 0.75em;
                flex-wrap: wrap;
                gap: 6px;
            }

            /* Login box */
            #loginBox {
                width: 90%;
                padding: 28px 20px;
            }
        }

        @media (max-width: 400px) {

const PLAYER_INFO = {
    "mestre@campanhawill.com":   { id: "mestre",   color: "user-mestre",   label: "Mestre" },

const db    = getFirestore(fbApp);

let unsubListeners = [];
window._creatingInitialSheet = false;

document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('btnLogin');

document.getElementById('loginPass').addEventListener('keydown', e => {

});

document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, user => {
    unsubListeners.forEach(u => u());
    unsubListeners = [];
    window._sheets.splice(0, window._sheets.length);
    window._activeSheetId = null;
    if (user) {
        window._currentUser = user;
        window._isMaster = (user.email === MASTER_EMAIL);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('userBar').style.display = 'flex';
        document.getElementById('userEmail').textContent = window._isMaster ? '👑 Mestre' : user.email;
        document.getElementById('btnLogin').disabled = false;
        startListeners();
    } else {
        window._currentUser = null;
        window._isMaster = false;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('userBar').style.display = 'none';
        if (typeof window._debouncedRender === 'function') window._debouncedRender();
    }
});

function startListeners() {
    const userEmail = window._currentUser.email;
    const userInfo  = PLAYER_INFO[userEmail];

    if (window._isMaster) {
        // Mestre escuta apenas coleções de jogadores (não a própria)
        const playerIds = Object.entries(PLAYER_INFO)
            .filter(([, info]) => info.id !== 'mestre')
            .map(([, info]) => info.id);

        playerIds.forEach(ownerId => {
            const unsub = onSnapshot(collection(db, `sheets_${ownerId}`), snap => {
                // Remove fichas desse owner que sumiram do Firestore
                const currentIds = snap.docs.map(d => d.id);
                const toRemove1 = window._sheets.filter(s =>
                    s.owner === ownerId && !(s.firebaseId && currentIds.includes(s.firebaseId))
                );
                toRemove1.forEach(s => {
                    const i = window._sheets.indexOf(s);
                    if (i >= 0) window._sheets.splice(i, 1);
                });
                // Atualiza/adiciona as que existem
                let needsRender = toRemove1.length > 0;
                snap.docs.forEach(d => {
                    const data = { ...d.data(), firebaseId: d.id, owner: ownerId };
                    const existing = window._sheets.find(s => s.firebaseId === d.id);
                    if (!existing) needsRender = true; // nova ficha
                    const changed = mergeSheet(data);
                    if (changed) needsRender = true;
                });
                if (needsRender && typeof window._debouncedRender === 'function') window._debouncedRender();
            });
            unsubListeners.push(unsub);
        });

        // Mestre também escuta a própria coleção
        const unsub = onSnapshot(collection(db, 'sheets_mestre'), snap => {
            const currentIds = snap.docs.map(d => d.id);
            const toRemove2 = window._sheets.filter(s =>
                s.owner === 'mestre' && !(s.firebaseId && currentIds.includes(s.firebaseId))
            );
            toRemove2.forEach(s => {
                const i = window._sheets.indexOf(s);
                if (i >= 0) window._sheets.splice(i, 1);
            });
            let needsRender2 = toRemove2.length > 0;
            snap.docs.forEach(d => {
                const data = { ...d.data(), firebaseId: d.id, owner: 'mestre' };
                const existing = window._sheets.find(s => s.firebaseId === d.id);
                if (!existing) needsRender2 = true;
                const changed = mergeSheet(data);
                if (changed) needsRender2 = true;
            });
            if (needsRender2 && typeof window._debouncedRender === 'function') window._debouncedRender();
        });
        unsubListeners.push(unsub);

    } else if (userInfo) {
        const unsub = onSnapshot(collection(db, `sheets_${userInfo.id}`), snap => {
            const currentIds = snap.docs.map(d => d.id);
            const toRemove3 = window._sheets.filter(s =>
                !(s.firebaseId && currentIds.includes(s.firebaseId))
            );
            toRemove3.forEach(s => {
                const i = window._sheets.indexOf(s);
                if (i >= 0) window._sheets.splice(i, 1);
            });
            let needsRender3 = toRemove3.length > 0;
            snap.docs.forEach(d => {
                const data = { ...d.data(), firebaseId: d.id, owner: userInfo.id };
                const existing = window._sheets.find(s => s.firebaseId === d.id);
                if (!existing) needsRender3 = true;
                const changed = mergeSheet(data);
                if (changed) needsRender3 = true;
            });
            if (needsRender3 && typeof window._debouncedRender === 'function') window._debouncedRender();
        });
        unsubListeners.push(unsub);
    }
}

function mergeSheet(data) {
    if (!data.firebaseId) return false;
    const arr = window._sheets;
    const idx = arr.findIndex(s => s.firebaseId === data.firebaseId);
    if (idx >= 0) {
        // Se esse update veio do nosso próprio save, ignora silenciosamente
        if (window._suppressNextRender === data.firebaseId) {
            window._suppressNextRender = null;
            return false; // indica: não precisa re-render por este doc
        }
        Object.assign(arr[idx], data);
    } else {
        arr.push(data);
        if (!window._activeSheetId) window._activeSheetId = data.id;
    }
    return true; // indica: houve mudança real
}

window.PLAYER_INFO  = PLAYER_INFO;
window._fbSetDoc    = (col, id, data) => setDoc(doc(db, col, id), data);
window._fbDeleteDoc = (col, id)       => deleteDoc(doc(db, col, id));

// Debounced render para evitar cascata de re-renders
let _renderTimer = null;
window._debouncedRender = function() {
    clearTimeout(_renderTimer);
    _renderTimer = setTimeout(() => {
        if (typeof renderSheets === 'function') renderSheets();
    }, 50);
};

<script>
    let sheets = [];
    let activeSheetId = null;

    Object.defineProperty(window, '_sheets', {
        get() { return sheets; },
        set(value) { sheets = value; }
    });

    Object.defineProperty(window, '_activeSheetId', {
        get() { return activeSheetId; },
        set(value) { activeSheetId = value; }
    });


    let creatingSheet = false;
    window._sheetCreationLock = false;

    async function addNewSheet() {

        if (creatingSheet || window._sheetCreationLock) {
            return;
        }

        creatingSheet = true;
        window._sheetCreationLock = true;

        document.querySelectorAll('.add-tab-btn').forEach(btn => {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
        });

        try {

            const userEmail = window._currentUser.email;
            const userInfo = window.PLAYER_INFO[userEmail];

            if (!userInfo) return;

            const newSheet = createEmptySheet();

            newSheet.owner = userInfo.id;
            newSheet.firebaseId = crypto.randomUUID();

            await window._fbSetDoc(
                `sheets_${userInfo.id}`,
                newSheet.firebaseId,
                newSheet
            );

            activeSheetId = newSheet.id;

        } finally {

            setTimeout(() => {
                creatingSheet = false;
                window._sheetCreationLock = false;

                document.querySelectorAll('.add-tab-btn').forEach(btn => {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                });

            }, 2000);
        }
    }

    function removeSheet(id) {
        id = Number(id);

        const sheet = sheets.find(s => s.id === id);

        if (!sheet) return;

        const userEmail = window._currentUser.email;
        const userInfo = window.PLAYER_INFO[userEmail];

        if (!window._isMaster && sheet.owner !== userInfo.id) {
            setSyncStatus('⚠ Você só pode apagar suas próprias fichas.');
            return;
        }

        const nomeFicha = sheet.name || 'Sem Nome';
        const owner     = sheet.owner;
        const fbId      = sheet.firebaseId;

        // Usa modal de confirmação (confirm() não funciona em iframe)
        window._showConfirmModal(
            `Apagar a ficha "<strong>${nomeFicha}</strong>"? Esta ação não pode ser desfeita.`,
            () => window._fbDeleteDoc(`sheets_${owner}`, fbId)
        );
    }

    let saveTimeout;

    function saveToLocalStorage() {

        clearTimeout(saveTimeout);

        saveTimeout = setTimeout(() => {

            const sheet = sheets.find(
                s => s.id === activeSheetId
            );

            if (!sheet || !window._currentUser || !window._fbSetDoc) {
                return;
            }

            const statusEl = document.getElementById('syncStatus');

            if (statusEl) {
                statusEl.textContent = '💾 Salvando...';
            }

            // Suprime o re-render do onSnapshot para saves locais
            window._suppressNextRender = sheet.firebaseId;

            window._fbSetDoc(
                `sheets_${sheet.owner}`,
                sheet.firebaseId,
                sheet
            ).then(() => {

                if (statusEl) {

                    statusEl.textContent = '✓ Salvo';

                    setTimeout(() => {
                        statusEl.textContent = '';
                    }, 2000);
                }
            });

        }, 500);
    }
</script>

    // Persistir estado visual da imagem
    function updateImageTransform(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (!sheet) return;

        const img = document.querySelector(`#sheet-${sheetId} .character-image`);
        const info = document.querySelector(`#sheet-${sheetId} .zoom-info`);
        
        if (img) {
            img.style.transform = `scale(${sheet.imageState.zoom}) translate(${sheet.imageState.offsetX}px, ${sheet.imageState.offsetY}px)`;
        }
        if (info) {
            info.textContent = `Zoom: ${(sheet.imageState.zoom * 100).toFixed(0)}%`;
        }
    }

    function zoomIn(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (sheet) {
            sheet.imageState.zoom = Math.min(sheet.imageState.zoom + 0.2, 3);
            updateImageTransform(sheetId);
            saveToLocalStorage();
        }
    }

    function zoomOut(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (sheet) {
            sheet.imageState.zoom = Math.max(sheet.imageState.zoom - 0.2, 0.5);
            updateImageTransform(sheetId);
            saveToLocalStorage();
        }
    }

    function fitImageToContainer(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (sheet) {
            sheet.imageState.zoom = 1;
            sheet.imageState.offsetX = 0;
            sheet.imageState.offsetY = 0;
            updateImageTransform(sheetId);
            saveToLocalStorage();
        }
    }

    function setupImagePanEvents(sheetId) {
        const container = document.querySelector(`#sheet-${sheetId} .image-container-9-16`);
        const sheet = sheets.find(s => s.id === sheetId);
        
        if (!container || !sheet) return;

        let isDragging = false;
        let startX, startY;

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            container.classList.add('active');
        });

        const handleMouseMove = (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            sheet.imageState.offsetX += deltaX / sheet.imageState.zoom;
            sheet.imageState.offsetY += deltaY / sheet.imageState.zoom;

            startX = e.clientX;
            startY = e.clientY;

            updateImageTransform(sheetId);
        };

        const handleMouseUp = () => {
            if (isDragging) {
                isDragging = false;
                container.classList.remove('active');
                saveToLocalStorage();
            }
        };

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) zoomIn(sheetId);
            else zoomOut(sheetId);
        });
    }

    function renderCustomNotes(sheet) {
        if (!sheet.customNotes || sheet.customNotes.length === 0) {
            return '<div class="notes-empty-msg">Nenhuma nota personalizada adicionada ainda. Clique em "+ Adicionar Nota" para criar uma.</div>';
        }
        return sheet.customNotes.map((note, idx) => {
            const escapedTitle = note.title.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;');
            const escapedText = note.text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `<div class="note-card">
                <div class="note-card-header">
                    <span class="note-card-badge badge-note">Nota</span>
                    <input type="text" class="note-card-title-input" value="${escapedTitle}" onchange="updateCustomNoteTitle(${sheet.id}, ${idx}, this.value)" placeholder="Título da nota">
                    <button class="note-card-remove-btn" onclick="removeCustomNote(${sheet.id}, ${idx})">✕</button>
                </div>
                <textarea class="note-card-textarea" placeholder="Escreva o conteúdo da nota aqui..." onchange="updateCustomNoteText(${sheet.id}, ${idx}, this.value)">${escapedText}</textarea>
            </div>`;
        }).join('');
    }

    function renderNotesSection(sheet, field, prefix, badgeLabel, badgeClass, placeholder, emptyMsg) {
        const items = sheet[field] ? sheet[field].filter(item => item && item.trim() !== '') : [];
        if (items.length === 0) {
            return `<div class="notes-empty-msg">${emptyMsg}</div>`;
        }
        return items.map(item => {
            const key = prefix + '_' + encodeURIComponent(item);
            const savedText = (sheet.noteDetails && sheet.noteDetails[key]) ? sheet.noteDetails[key] : '';
            const escapedItem = item.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;');
            const escapedKey = key.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            const escapedText = savedText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return `<div class="note-card">
                <div class="note-card-header">
                    <span class="note-card-badge ${badgeClass}">${badgeLabel}</span>
                    <span class="note-card-title-static">${escapedItem}</span>
                </div>
                <textarea class="note-card-textarea" placeholder="${placeholder}" onchange="updateNoteDetail(${sheet.id}, '${escapedKey}', this.value)">${escapedText}</textarea>
            </div>`;
        }).join('');
    }

    // Logic Functions
    function uploadCharacterImage(id, input) {
        const sheet = sheets.find(s => s.id === id);

        if (!sheet || !input.files || !input.files[0]) return;

        const file = input.files[0];

        const reader = new FileReader();

        reader.onload = function(e) {

            const img = new Image();

            img.onload = function() {

                // comprime a imagem para caber no Firestore
                const canvas = document.createElement('canvas');

                let width = img.width;
                let height = img.height;

                const MAX_WIDTH = 600;

                if (width > MAX_WIDTH) {
                    height = Math.round(height * (MAX_WIDTH / width));
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d');

                ctx.drawImage(img, 0, 0, width, height);

                // jpeg comprimido
                const compressedData = canvas.toDataURL('image/jpeg', 0.65);

                sheet.image = compressedData;

                if (!sheet.imageState) {
                    sheet.imageState = {
                        zoom: 1,
                        offsetX: 0,
                        offsetY: 0
                    };
                }

                const container = document.querySelector(`#sheet-${id} .image-container-9-16`);

                if (container) {

                    container.innerHTML = `
                        <div class="image-wrapper">
                            <img
                                src="${compressedData}"
                                alt="Personagem"
                                class="character-image"
                                style="transform: scale(1) translate(0px, 0px)">
                        </div>
                    `;
                }

                saveImageNow(sheet);

                if (typeof renderSheets === 'function') {
                    setTimeout(() => {
                        renderSheets();
                    }, 100);
                }
            };

            img.src = e.target.result;
        };

        reader.readAsDataURL(file);
    }

    function saveImageNow(sheet) {
        if (!sheet || !window._currentUser || !window._fbSetDoc || !sheet.owner || !sheet.firebaseId) return;
        window._fbSetDoc(`sheets_${sheet.owner}`, sheet.firebaseId, sheet)

                if (s) { s.textContent = '✓ Salvo'; setTimeout(() => { s.textContent = ''; }, 2000); }

            .catch(e => console.error('image save error:', e));
    }

    function switchSheetTab(id, tabName) {
        // 1. Atualizar dados (sem salvar — estado visual não precisa persistir)
        const sheet = sheets.find(s => s.id == id);
        if (sheet) {
            sheet.activeTab = tabName;
        }

        // 2. Localizar elementos da ficha
        const sheetDiv = document.getElementById('sheet-' + id);
        if (!sheetDiv) return;

        // 3. Trocar visibilidade dos conteúdos
        const contents = sheetDiv.getElementsByClassName('sheet-tab-content');
        for (let content of contents) {
            content.style.display = 'none';
        }
        
        const target = document.getElementById('tab-' + tabName + '-' + id);
        if (target) target.style.display = 'block';

        // 4. Trocar estilos dos botões
        const buttons = sheetDiv.getElementsByClassName('tab-btn');
        for (let btn of buttons) {
            btn.style.borderBottom = '3px solid transparent';
            btn.style.color = '#ccc';
            
            // Se o botão corresponde à aba, destaca
            const onclick = btn.getAttribute('onclick') || '';
            if (onclick.includes("'" + tabName + "'")) {
                btn.style.borderBottom = '3px solid var(--sw-blue)';
                btn.style.color = 'var(--sw-yellow)';
            }
        }
    }

    function updateSkill(id, skillKey, field, value) {
        const sheet = sheets.find(s => s.id === id);
        if (!sheet) return;
        if (!sheet.skills) sheet.skills = {};
        if (!sheet.skills[skillKey]) sheet.skills[skillKey] = { treinada: false, bonus: 0 };
        sheet.skills[skillKey][field] = field === 'treinada' ? value : (parseInt(value) || 0);
        // Atualiza o total no DOM sem re-renderizar
        const row = document.querySelector(`#tab-pericias-${id} [data-skill="${skillKey}"]`);
        if (row) {
            const sk = sheet.skills[skillKey];
            const attr = row.getAttribute('data-attr');
            const attrMod = sheet.attributes[attr]?.mod || 0;
            const condPenalty = sheet.condition === -99 ? -10 : (sheet.condition || 0);
            const total = attrMod + (sk.treinada ? 5 : 0) + (sk.bonus || 0) + condPenalty;
            const totalEl = row.querySelector('.skill-total');
            if (totalEl) {
                totalEl.textContent = (total >= 0 ? '+' : '') + total;
                totalEl.style.color = total >= 0 ? 'var(--sw-yellow)' : '#ff6b6b';
            }
        }
        saveToLocalStorage();
    }

    function updateField(id, field, value) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet) {
            sheet[field] = value;
            saveToLocalStorage();
            if (field === 'name') {
                const tabsHeader = document.getElementById('tabsHeader');
                tabsHeader.innerHTML = '<button class="add-tab-btn" onclick="addNewSheet()">+ Nova Ficha</button>';
                // Ordenar igual ao renderSheets: mestre primeiro, depois ordem fixa
                const order = window.OWNER_ORDER || [];
                const currentOwner = window._isMaster ? 'mestre' : (window.PLAYER_INFO?.[window._currentUser?.email]?.id || '');
                const sortedForTabs = [...sheets].sort((a, b) => {
                    const ownerA = a.owner || currentOwner;
                    const ownerB = b.owner || currentOwner;
                    const posA = order.indexOf(ownerA) === -1 ? 999 : order.indexOf(ownerA);
                    const posB = order.indexOf(ownerB) === -1 ? 999 : order.indexOf(ownerB);
                    if (posA !== posB) return posA - posB;
                    return (a.name || '').localeCompare(b.name || '', 'pt-BR');
                });
                sortedForTabs.forEach(s => {
                    const btn = document.createElement('button');
                    const ownerInfo = Object.values(window.PLAYER_INFO || {}).find(i => i.id === s.owner);
                    const colorClass = ownerInfo ? ownerInfo.color : '';
                    const isMasterSheet = s.owner === 'mestre';
                    btn.className = `tab-btn ${colorClass}${s.id === activeSheetId ? ' active' : ''}`;
                    btn.innerHTML = `${isMasterSheet ? '👑 ' : ''}${s.name || 'Sem Nome'} <span class="remove-tab" onclick="event.stopPropagation(); removeSheet(${s.id})">✕</span>`;
                    btn.onclick = () => switchSheet(s.id);
                    tabsHeader.appendChild(btn);
                });
            }
            if (field === 'condition') {
                refreshSkillTotals(id, sheet);
            }
        }
    }

            const attrMod  = sheet.attributes[attr]?.mod || 0;
            const total    = attrMod + (sk.treinada ? 5 : 0) + (parseInt(sk.bonus) || 0) + condPenalty;

                totalEl.textContent = (total >= 0 ? '+' : '') + total;

    }

    function calculateDefense(sheet, defType) {
        const baseDefense = 10;
        const def = sheet.defenses[defType];
        let attrMod = 0;

        if (defType === 'REF') attrMod = sheet.attributes.DES.mod;
        else if (defType === 'FORT') attrMod = sheet.attributes.CON.mod;
        else if (defType === 'VON') attrMod = sheet.attributes.SAB.mod;

        return baseDefense + attrMod + (def?.level || 0) + (def?.class || 0) + (def?.hab || 0) + (def?.other || 0);
    }

    function refreshDefenseTotals(id, sheet) {
        const sheetEl = document.getElementById('sheet-' + id);
        if (!sheetEl) return;
        ['FORT', 'REF', 'VON'].forEach(def => {
            if (!sheet.defenses[def]) return;
            // Atualiza total
            const totalEl = sheetEl.querySelector(`[data-def-total="${def}"]`);
            if (totalEl) totalEl.textContent = calculateDefense(sheet, def);
            // Atualiza label do atributo
            const attrEl = sheetEl.querySelector(`[data-def-attr="${def}"]`);
            if (attrEl) {
                let attrMod = 0, attrName = '';
                if (def === 'REF') { attrMod = sheet.attributes.DES.mod; attrName = 'DES'; }
                else if (def === 'FORT') { attrMod = sheet.attributes.CON.mod; attrName = 'CON'; }
                else if (def === 'VON') { attrMod = sheet.attributes.SAB.mod; attrName = 'SAB'; }
                attrEl.textContent = `${attrName} (${attrMod >= 0 ? '+' : ''}${attrMod})`;
            }
        });
    }

        }
        document.getElementById('confirmMsg').innerHTML = message;
        modal.style.display = 'flex';

        const close = () => { modal.style.display = 'none'; };

    function loadFromLocalStorage() {
        const data = localStorage.getItem('swSheets');
        if (data) {
            sheets = JSON.parse(data);
            if (sheets.length > 0) {
                activeSheetId = sheets[0].id;
                // Garantir que todas as fichas carregadas tenham os campos necessários
                sheets.forEach(s => {
                    if (!s.imageState) s.imageState = { zoom: 1, offsetX: 0, offsetY: 0 };
                    if (!s.noteDetails) s.noteDetails = {};
                    if (s.generalNotes === undefined) s.generalNotes = '';
                    if (!s.customNotes) s.customNotes = [];
                    if (!s.activeTab) s.activeTab = 'ficha';
                });

        }

                </table>
            </div>
        `;

            btn.classList.remove('active');
            if (btn.textContent === className) {
                btn.classList.add('active');

        "Ataque Triplo (Triple Attack)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Ataque Duplo com o grupo de armas escolhido, bônus base de ataque +11.\n\nBenefício: Escolha um grupo de armas para o qual possua Ataque Duplo. Quando fizer um ataque total com uma arma desse grupo, você pode fazer dois ataques adicionais. Você sofre –10 de penalidade em todas as jogadas de ataque feitas nesse ataque total.\n\nEspecial: Você pode escolher este talento mais de uma vez. Cada vez que o escolher, aplique-o a um grupo de armas diferente."
        },
        "Ataque Turbilhão (Whirlwind Attack)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Destreza 13, Inteligência 13, Esquiva, Mobilidade, Ataque em Movimento, bônus base de ataque +4.\n\nBenefício: Como ação de rodada completa, você pode fazer um ataque corpo a corpo contra cada inimigo dentro do seu alcance. Você faz uma jogada de ataque separada contra cada alvo."
        },
        "Ataque Vantajoso (Advantageous Attack)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Bônus base de ataque +1.\n\nBenefício: Quando você faz um ataque bem-sucedido contra um inimigo que ainda não agiu no combate, adiciona seu nível heroico completo às rolagens de dano.\n\nNormal: Você normalmente adiciona apenas metade do seu nível heroico às rolagens de dano."
        },
        "Atirador de Bowcaster (Bowcaster Marksman)": {
                "source": "Star Wars Saga Edition Rebellion Era Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Wookiee.\n\nBenefício: Sempre que você gastar um Ponto da Força para somar ao ataque com um bowcaster, se acertar o alvo, recebe um bônus de competência na rolagem de dano igual ao valor somado à jogada de ataque pelo Ponto da Força."
        },
        "Atirador Oportunista (Opportunistic Shooter)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: Tiro à Queima-Roupa.\n\nBenefício: Quando um inimigo adjacente a você provoca um ataque de oportunidade, você pode fazer esse ataque de oportunidade com uma arma à distância que esteja empunhando. Esse ataque segue as regras normais de ataques de oportunidade e de armas à distância."
        },
        "Atualização Lógica: Autodefesa (Logic Upgrade: Self Defense)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisito: droide.\n\nBenefício: Uma vez por encontro, como ação rápida, você concede a si mesmo +2 de bônus em uma Defesa à sua escolha por 1 rodada."
        },
        "Atualização Lógica: Tático (Logic Upgrade: Tactician)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: droide, bônus base de ataque +4.\n\nBenefício: Quando você usa ajudar outro para auxiliar a jogada de ataque de um aliado e a tentativa é bem-sucedida, o aliado recebe +5 de bônus na jogada de ataque em vez do bônus normal de +2."
        },
        "Atualização Lógica: Troca de Perícia (Logic Upgrade: Skill Swap)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: droide.\n\nBenefício: Você pode trocar temporariamente uma perícia programada por outra. Escolha uma perícia na qual seja treinado; pelo restante do encontro, você deixa de tratá-la como treinada e passa a tratar outra perícia de classe como treinada."
        },
        "Barragem Coordenada (Coordinated Barrage)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisitos: Ataque Coordenado, bônus base de ataque +5.\n\nBenefício: Quando usa ajudar outro para auxiliar a jogada de ataque de um aliado e a tentativa é bem-sucedida, o aliado causa dano adicional se acertar. O dano adicional é igual a +1 dado de dano da arma usada pelo aliado."
        },
        "Barragem de Blaster (Blaster Barrage)": {
                "source": "Star Wars Saga Edition The Force Unleashed Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: Ataque Coordenado.\n\nBenefício: Quando você faz um ataque com uma arma em modo de fogo automático e causa dano a pelo menos um alvo dentro da área designada, seus aliados recebem +2 de bônus de circunstância em ataques de fogo automático contra esse mesmo alvo até o início do seu próximo turno."
        },
        "Bater Cabeças (Knock Heads)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Saga Edition RPG Omnibus",
                "text": "Pré-requisitos: Agarrão Múltiplo, Força 13.\n\nBenefício: Se você estiver agarrando dois inimigos ao mesmo tempo, pode bater um contra o outro como ação padrão. Faça uma jogada de ataque de agarrar contra cada alvo; se acertar, ambos sofrem dano contundente igual ao seu dano desarmado."
        },
        "Benefícios da Orla (Fringe Benefits)": {
                "source": "Star Wars Saga Edition Rebellion Era Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: Rodiano.\n\nBenefício: Ao comprar bens no mercado negro, reduza em 1 o multiplicador de custo aplicado ao item."
        },
        "Blindagem Iônica (Ion Shielding)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: droide com Força 13, ou ciborgue com Constituição 13.\n\nBenefício: Se o dano iônico sofrido antes de ser reduzido pela metade igualar ou superar seu limiar de dano, você desce apenas –1 passo na trilha de condição.\n\nNormal: Se dano iônico antes de ser reduzido pela metade iguala ou supera seu limiar de dano, você normalmente desce –2 passos na trilha de condição."
        },
        "Brado Devastador (Devastating Bellow)": {
                "source": "Star Wars Saga Edition Unknown Regions / Saga Edition RPG Omnibus",
                "text": "Pré-requisitos: Brado Poderoso, Constituição 13.\n\nBenefício: Quando usa Brado Poderoso, criaturas afetadas que sofrerem dano também descem –1 passo na trilha de condição se o dano igualar ou superar o limiar de dano delas."
        },
        "Brado Poderoso (Strong Bellow)": {
                "source": "Star Wars Saga Edition Unknown Regions / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: espécie ou característica capaz de produzir brado sônico poderoso.\n\nBenefício: Como ação padrão, você solta um brado em cone curto. Faça uma jogada de ataque contra a Defesa de Fortitude de cada criatura na área; se acertar, a criatura sofre dano sônico igual ao seu dano desarmado."
        },
        "Buscador da Justiça (Justice Seeker)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: treinado em Percepção.\n\nBenefício: Quando combate um inimigo que você viu cometer um crime grave, trair um aliado ou ferir um inocente na mesma aventura, você recebe +1 de bônus de moral nas jogadas de ataque contra esse inimigo até o fim do encontro."
        },
        "Caçador de Droides (Droid Hunter)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: proficiência com a arma escolhida.\n\nBenefício: Escolha um grupo de armas com o qual seja proficiente. Você causa +2 de dano contra inimigos droides ao usar uma arma desse grupo. Se a arma causar dano iônico, o bônus aumenta para +4."
        },
        "Caçador Esportivo (Sport Hunter)": {
                "source": "Star Wars Saga Edition Unknown Regions / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: treinado em Sobrevivência.\n\nBenefício: Quando estiver rastreando ou caçando uma criatura não inteligente, você recebe +2 de bônus de competência em testes de Sobrevivência e +1 de bônus nas jogadas de ataque contra essa criatura."
        },
        "Caçador Ungido (Annointed Hunter)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Nelvaanian.\n\nBenefício: Se você se mover 2 quadrados ou mais durante seu turno, recebe +1 de bônus nas jogadas de ataque com armas arremessadas até o fim do turno."
        },
        "Canalizar Fúria (Channel Rage)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: característica racial Fúria.\n\nBenefício: Você pode entrar em fúria como ação livre no seu turno. Depois de declarar o uso, a fúria dura até o fim do seu próximo turno."
        },
        "Catador (Scavenger)": {
                "source": "Star Wars Saga Edition Rebellion Era Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: treinado em Mecânica.\n\nBenefício: Você pode passar 1 hora catando peças e materiais. Ao fim desse período, faça um teste de Percepção; você obtém matéria-prima em valor igual ao resultado do teste × 30 créditos. Esses materiais podem ser usados na construção ou reparo de itens."
        },
        "Charme Desarmante (Disarming Charm)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: treinado em Persuasão.\n\nBenefício: Uma vez por encontro, quando fizer um teste de Persuasão para mudar a atitude de uma criatura ou convencê-la a cooperar, você pode rolar novamente o teste e ficar com o melhor resultado."
        },
        "Cirurgia Biotecnológica (Biotech Surgery)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: treinado em Tratar Ferimentos.\n\nBenefício: Você pode instalar uma prótese biotecnológica em um ser vivo. O procedimento exige 1 hora de trabalho ininterrupto e um teste de Tratar Ferimentos CD 20. Se tiver sucesso, a prótese é instalada corretamente. Se falhar, a prótese não é instalada corretamente; você pode tentar novamente após mais 1 hora ininterrupta de cirurgia.\n\nEspecial: Você pode instalar uma prótese biotecnológica em si mesmo, mas sofre –5 de penalidade no teste de Tratar Ferimentos. Se possuir Especialização Cirúrgica, pode instalar a prótese em 10 minutos em vez de 1 hora."
        },
        "Cirurgia Cibernética (Cybernetic Surgery)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: treinado em Tratar Ferimentos.\n\nBenefício: Você pode instalar uma prótese cibernética em um ser vivo. O procedimento exige 1 hora de trabalho ininterrupto e um teste de Tratar Ferimentos CD 20. Se tiver sucesso, a prótese é instalada corretamente. Se falhar, a prótese não é instalada corretamente; você pode tentar novamente após mais 1 hora ininterrupta de cirurgia.\n\nEspecial: Você pode instalar uma prótese cibernética em si mesmo, mas sofre –5 de penalidade no teste de Tratar Ferimentos. Se possuir Especialização Cirúrgica, pode instalar a prótese em 10 minutos em vez de 1 hora."
        },
        "Agressão Temperada (Tempered Aggression)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "descriptor": "[Forma de Sabre], [Lado Sombrio]",
                "text": "Tempo: Ação padrão\nAlvo: Um inimigo ao alcance do seu sabre de luz\n\nVocê canaliza agressividade pela Força para transformar um ataque de sabre de luz em um golpe de precisão brutal. Faça uma verificação de Usar a Força como parte do ataque corpo a corpo com sabre de luz. Compare o resultado da tabela abaixo para determinar quando o ataque passa a contar como acerto crítico.",
                "checks": [
                        {
                                "cd": "30",
                                "effect": "Faça um ataque corpo a corpo com sabre de luz. Se superar a Defesa de Reflexos do alvo por 10 ou mais, o ataque conta como acerto crítico."
                        },
                        {
                                "cd": "35",
                                "effect": "Como CD 30, porém basta superar a Defesa de Reflexos do alvo por 5 ou mais."
                        },
                        {
                                "cd": "40",
                                "effect": "Como CD 30, porém basta superar a Defesa de Reflexos do alvo por 2 ou mais."
                        }
                ]
        },
        "Aproximar (Draw Closer)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / documento da campanha",
                "descriptor": "[Forma de Sabre: Niman], [Telequinético]",
                "text": "Tempo: Ação padrão\nAlvo: Um inimigo a até 12 quadrados e em sua linha de visão\n\nVocê combina um puxão telequinético com ataques de sabre de luz, trazendo o inimigo para dentro do seu alcance e atacando em um movimento contínuo. Faça uma verificação de Usar a Força. O alvo pode resistir ao puxão com uma verificação de Força, somando bônus base de ataque, contra sua verificação de Usar a Força.",
                "checks": [
                        {
                                "cd": "20",
                                "effect": "Puxe o alvo até 4 quadrados em direção a você. Se o alvo terminar adjacente, faça um ataque com sabre de luz como bônus."
                        },
                        {
                                "cd": "25",
                                "effect": "Puxe o alvo até 6 quadrados. Se terminar adjacente, faça dois ataques com sabre de luz; o segundo sofre −5 de penalidade."
                        },
                        {
                                "cd": "30",
                                "effect": "Puxe o alvo até 8 quadrados e faça dois ataques com sabre de luz sem penalidade."
                        }
                ],
                "special": "Você pode gastar 1 Ponto da Força para impor −2 na verificação de resistência do alvo."
        },
        "Atordoamento da Força (Force Stun)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki Omnibus",
                "descriptor": "—",
                "text": "Tempo: Ação padrão\nAlvo: Uma criatura a até 6 quadrados ou em sua linha de visão\n\nVocê usa a Força para sobrecarregar os sentidos de um inimigo. Faça uma verificação de Usar a Força contra a Defesa de Fortitude do alvo. Se igualar ou superar a defesa, o alvo desce −1 passo na trilha de condição. Para cada 5 pontos completos acima da Defesa de Fortitude, o alvo desce mais −1 passo.\n\nModificador de tamanho na Defesa de Fortitude do alvo: Colossal +50, Imenso +20, Enorme +10, Grande +5, Médio ou menor +0.",
                "special": "Este é um efeito de área. Você pode gastar 1 Ponto da Força para mover o alvo mais −1 passo na trilha de condição."
        },
        "Avalanche Cadente (Falling Avalanche)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / documento da campanha",
                "descriptor": "[Forma de Sabre: Djem So]",
                "text": "Tempo: Ação padrão\nAlvo: Um inimigo ao alcance\n\nVocê concentra toda a força de um golpe descendente de sabre de luz em um ataque devastador, especialmente eficaz contra alvos que acabaram de bloquear seu ataque anterior. Faça uma verificação de Usar a Força antes de realizar o ataque.",
                "checks": [
                        {
                                "cd": "25",
                                "effect": "Faça um ataque corpo a corpo com sabre de luz. Se acertar, o ataque ignora 5 pontos de RD ou SR do alvo."
                        },
                        {
                                "cd": "30",
                                "effect": "Como CD 25, e o dano do ataque aumenta em +1d10. Se o alvo sofrer dano acima do limiar, ele desce −1 passo na trilha de condição."
                        }
                ],
                "special": "Se o alvo bloqueou ou desviou seu ataque imediatamente antes desta ação, o bônus de dano aumenta para +2d10. Você pode gastar 1 Ponto da Força para ignorar 10 pontos de RD ou SR."
        },
        "Balistocinese (Ballistakinesis)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / documento da campanha",
                "descriptor": "[Telequinético]",
                "text": "Tempo: Ação padrão\nAlvo: Todos os alvos em uma área de 2 x 2 quadrados a até 12 quadrados\n\nVocê arremessa telecineticamente uma saraivada de detritos, fragmentos ou projéteis contra todos os alvos em uma área. Escolha o tipo de dano ao ativar: impacto, perfuração ou corte. Faça uma verificação de Usar a Força contra a Defesa de Reflexos de cada alvo.",
                "checks": [
                        {
                                "cd": "20",
                                "effect": "3d8 de dano, e o alvo sofre −2 em jogadas de ataque até o início do seu próximo turno."
                        },
                        {
                                "cd": "25",
                                "effect": "4d8 de dano, e a penalidade em jogadas de ataque aumenta para −3."
                        },
                        {
                                "cd": "30",
                                "effect": "5d8 de dano, e a penalidade em jogadas de ataque aumenta para −4."
                        },
                        {
                                "cd": "35",
                                "effect": "6d8 de dano, e a penalidade em jogadas de ataque aumenta para −5."
                        }
                ],
                "special": "Alvos que resistem sofrem metade do dano e nenhuma penalidade em ataques. Se o alvo tiver RD, dobre a RD dele para reduzir o dano deste poder. Você pode gastar 1 Ponto da Força para aumentar a área para 3 x 3 quadrados."
        },
        "Barreira de Lâminas (Barrier of Blades)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / documento da campanha",
                "descriptor": "[Forma de Sabre: Soresu]",
                "text": "Tempo: Ação padrão\nAlvo: Você\n\nVocê gira seu sabre de luz em alta velocidade, criando uma barreira de energia que protege contra ataques à distância e ataques de área. Faça uma verificação de Usar a Força.",
                "checks": [
                        {
                                "cd": "25",
                                "effect": "Você ganha cobertura aprimorada, recebendo +8 na Defesa de Reflexos contra ataques à distância até o início do seu próximo turno."
                        },
                        {
                                "cd": "30",
                                "effect": "Como CD 25, e você pode usar sua reação para tentar defletir um ataque à distância, como a aptidão Defletir, mesmo que já tenha usado sua reação nesta rodada."
                        }
                ],
                "special": "Você pode manter Barreira de Lâminas de rodada em rodada com uma ação rápida. Você pode gastar 1 Ponto da Força para refletir automaticamente um projétil defletido de volta ao atacante."
        },
        "Bloqueio Desequilibrante (Unbalancing Block)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki Omnibus",
                "descriptor": "[Forma de Sabre]",
                "text": "Tempo: Reação\nAlvo: Um inimigo cujo ataque corpo a corpo você acabou de bloquear\n\nVocê usa a Força e sua técnica de sabre de luz para transformar uma defesa bem-sucedida em uma abertura contra o agressor. Após bloquear um ataque corpo a corpo, use este poder como técnica de Forma de Sabre em combate.",
                "special": "Exige sabre de luz ativado e acesso à Forma de Sabre correspondente."
        },
        "Bomba de Pensamento (Thought Bomb)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "descriptor": "[Afeta a Mente]",
                "text": "Tempo: Ação padrão\nAlvo: Todos os oponentes a até 2 quadrados de você\n\nVocê usa a Força para irradiar ondas telepáticas nocivas, ferindo a mente de inimigos próximos. Faça uma verificação de Usar a Força e compare o resultado com a Defesa de Vontade de cada alvo. Se o resultado igualar ou superar a Defesa de Vontade de um alvo, ele sofre 2d6 de dano de Força e perde sua ação rápida no próximo turno.",
                "checks": [
                        { "cd": "Defesa de Vontade do alvo", "effect": "O alvo sofre 2d6 de dano de Força e perde sua ação rápida no próximo turno." }
                ],
                "special": "Este é um efeito de área. Você pode gastar 1 Ponto da Força para aumentar o dano causado por este poder em +2d6."
        },
        "Cambalear (Stagger)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "descriptor": "[Telequinético]",
                "text": "Tempo: Ação rápida\nAlvo: Um alvo adjacente a você\n\nVocê usa a Força para golpear um inimigo próximo e fazê-lo cambalear. Faça uma verificação de Usar a Força contra a Defesa de Fortitude do alvo.",
                "checks": [
                        {
                                "cd": "Defesa de Fortitude do alvo",
                                "effect": "Se o resultado igualar ou superar a Defesa de Fortitude, o alvo sofre 2d6 de dano de Força e é empurrado 1 quadrado para longe de você. Esse movimento não provoca ataques de oportunidade."
                        }
                ],
                "special": "Você pode gastar 1 Ponto da Força ao ativar este poder para afetar todos os inimigos adjacentes. Nesse caso, compare sua verificação de Usar a Força com a Defesa de Fortitude de cada alvo."
        },
        "Camuflagem (Cloak)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / documento da campanha",
                "descriptor": "—",
                "text": "Tempo: Ação padrão\nAlvo: Você\n\nVocê dobra a luz ao redor de seu corpo, tornando-se invisível. Faça uma verificação de Usar a Força.",
                "checks": [
                        {
                                "cd": "20",
                                "effect": "Ocultação total contra todos os alvos até o início do seu próximo turno."
                        },
                        {
                                "cd": "25",
                                "effect": "Como CD 20, e você recebe +2 em Furtividade."
                        },
                        {
                                "cd": "30",
                                "effect": "Como CD 20, e você recebe +3 em Furtividade."
                        },
                        {
                                "cd": "35",
                                "effect": "Como CD 20, e você recebe +5 em Furtividade."
                        }
                ],
                "special": "Você pode manter Camuflagem de rodada em rodada como ação rápida."
        },
        "Carga Desimpedida (Unhindered Charge)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki Omnibus",
                "descriptor": "[Forma de Sabre]",
                "text": "Tempo: Ação padrão\nAlvo: Você\n\nVocê avança com a Força guiando seus movimentos, usando uma técnica de sabre de luz voltada para investidas agressivas e deslocamento em combate. Use este poder como técnica de Forma de Sabre em combate.",
                "special": "Exige sabre de luz ativado e acesso à Forma de Sabre correspondente."
        },
        "Cegueira (Blind)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "descriptor": "[Telequinético]",
                "text": "Tempo: Ação rápida\nAlvo: Uma criatura a até 12 quadrados e em sua linha de visão\n\nVocê arremessa sujeira, poeira e detritos contra o inimigo com a Força, prejudicando a visão dele. Faça uma verificação de Usar a Força contra a Defesa de Reflexos do alvo.",
                "checks": [
                        {
                                "cd": "Defesa de Reflexos do alvo",
                                "effect": "Se o resultado igualar ou superar a Defesa de Reflexos, o alvo fica desprevenido, e todas as outras criaturas têm ocultação contra ele até o início do seu próximo turno."
                        }
                ],
                "special": "Criaturas que não dependem da visão para perceber, como Miraluka, são imunes a este efeito. Você pode gastar 1 Ponto da Força para usar este poder como ação livre em vez de ação rápida."
        },
        "Círculo de Proteção (Circle of Shelter)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / documento da campanha",
                "descriptor": "[Forma de Sabre: Niman/Jar'Kai]",
                "text": "Tempo: Ação padrão\nAlvo: Você e todos os aliados a até 2 quadrados\n\nVocê defende ativamente os aliados próximos, estendendo sua presença com o sabre de luz para proteger a área ao redor. Faça uma verificação de Usar a Força.",
                "checks": [
                        {
                                "cd": "20",
                                "effect": "Você e aliados adjacentes recebem +2 na Defesa de Reflexos contra ataques à distância até o início do seu próximo turno."
                        },
                        {
                                "cd": "25",
                                "effect": "Como CD 20, e você pode usar sua reação para tentar defletir um ataque direcionado a um aliado adjacente."
                        },
                        {
                                "cd": "30",
                                "effect": "Como CD 20, e o bônus na Defesa de Reflexos aumenta para +4 para todos na área."
                        }
                ],

        "Combate Cinético (Kinetic Combat)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "descriptor": "[Telequinético]",
                "text": "Tempo: Ação padrão\nAlvo: Uma arma corpo a corpo de uma mão que você tenha sacado\n\nVocê usa a Força para manipular a arma escolhida, permitindo que ela opere independentemente de suas mãos. Faça uma verificação de Usar a Força CD 20. Se tiver sucesso, você pode mover telecineticamente a arma até 12 quadrados e fazer um ataque com ela. A arma é considerada empunhada por você, mesmo pairando perto de você ou distante de suas mãos. O ataque usa seu bônus base de ataque + seu modificador de Carisma, e o dano usa o dano corpo a corpo normal da arma, metade do seu nível heroico e seu modificador de Carisma no lugar do modificador de Força.",
                "checks": [
                        { "cd": "20", "effect": "Mova a arma até 12 quadrados e faça um ataque com ela usando bônus base de ataque + Carisma." }

                "special": "Benefícios de talentos e aptidões ligados ao uso normal da arma ficam suspensos enquanto ela é usada por Combate Cinético. A arma ameaça os quadrados adjacentes a ela e pode fazer ataques de oportunidade, que contam como seus. Você pode gastar 1 Ponto da Força para receber +1 nas jogadas de ataque com a arma. Pode manter o poder de rodada em rodada com uma ação rápida; como ação padrão em cada rodada, pode mover a arma até 6 quadrados e fazer um ataque contra alvo adjacente à arma, desde que ela permaneça a até 12 quadrados de você. Se sofrer dano enquanto mantém o poder, precisa passar em Usar a Força CD 15 + dano sofrido para continuar."
        },

                "text": "Tempo: Ação padrão\nAlvo: Um alvo a até 12 quadrados e em sua linha de visão\n\nVocê excita as moléculas do alvo com a Força até que ele irrompa em chamas. Faça uma verificação de Usar a Força contra a Defesa de Fortitude do alvo.",
