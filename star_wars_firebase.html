<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Saga Edition - Ficha de Personagem</title>
    <style>
        :root {
            --sw-yellow: #FFE81F;
            --sw-blue: #2E67F8;
            --sw-red: #D62828;
            --sw-bg: #000000;
            --sw-panel: #1A1A1A;
            --sw-border: #333333;
            --sw-text: #E0E0E0;
            --sw-accent: #4A4A4A;
        }

        body {
            background-color: var(--sw-bg);
            color: var(--sw-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        h1, h2, h3 {
            color: var(--sw-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--sw-yellow);
            padding-bottom: 5px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Tabs Styling */
        .tabs-container {
            margin-bottom: 20px;
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            border-bottom: 2px solid var(--sw-accent);
        }

        
        .tab-btn {
            background: var(--sw-panel);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            white-space: nowrap;
            display: inline-block;
            margin-right: 5px;
        }


        .tab-btn.active {
            background: var(--sw-yellow);
            color: black;
            font-weight: bold;
            border-color: var(--sw-yellow);
        }

        .add-tab-btn {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .remove-tab {
            color: var(--sw-red);
            font-weight: bold;
            cursor: pointer;
            padding: 0 5px;
        }

        /* Sheet Styling */
        .sheet-content {
            display: none;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid var(--sw-border);
            padding: 20px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 0 20px rgba(255, 232, 31, 0.1);
        }

        .sheet-content.active {
            display: block;
        }

        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            padding: 15px;
            border-radius: 5px;
        }

        .input-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.8em;
            color: var(--sw-yellow);
            margin-bottom: 3px;
            font-weight: bold;
        }

        input, select, textarea {
            background: #222;
            border: 1px solid var(--sw-accent);
            color: white;
            padding: 8px;
            border-radius: 3px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--sw-yellow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            font-size: 0.7em;
            color: var(--sw-yellow);
            padding: 5px;
            border-bottom: 1px solid var(--sw-accent);
        }

        td {
            padding: 5px;
            border-bottom: 1px solid var(--sw-accent);
        }

        .attr-input {
            width: 50px;
            text-align: center;
        }

        .dynamic-list {
            list-style: none;
            padding: 0;
        }

        .dynamic-item {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .dynamic-item input {
            flex-grow: 1;
        }

        .btn-add {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .btn-remove {
            background: var(--sw-red);
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        .condition-track {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .condition-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .save-load {
            margin-top: 20px;
            text-align: right;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }

        .btn-save { background: #28a745; color: white; border: none; }

        .class-row {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .class-row select, .class-row input {
            flex: 1;
        }

        /* Características Grid */
        .characteristics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .characteristics-grid .input-group {
            margin-bottom: 0;
        }

        /* Class Reference Styling */
        .class-reference {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .class-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .class-btn {
            background: var(--sw-panel);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }

        .class-btn.active {
            background: var(--sw-yellow);
            color: black;
            border-color: var(--sw-yellow);
        }

        .class-info {
            display: none;
        }

        .class-info.active {
            display: block;
        }

        .class-info h4 {
            color: var(--sw-yellow);
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 1em;
            border-bottom: 1px solid var(--sw-accent);
            padding-bottom: 5px;
        }

        .class-info p {
            font-size: 0.9em;
            line-height: 1.5;
            margin: 5px 0;
        }

        .class-info ul {
            margin: 5px 0;
            padding-left: 20px;
        }

        .class-info li {
            font-size: 0.9em;
            margin: 3px 0;
        }

        .library-layout {
            display: grid;
            grid-template-columns: minmax(220px, 280px) 1fr;
            gap: 20px;
        }

        .library-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .library-item-btn {
            background: rgba(0, 0, 0, 0.35);
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            border-radius: 3px;
            padding: 10px;
            text-align: left;
            cursor: pointer;
            font-weight: bold;
        }

        .library-item-btn:hover,
        .library-item-btn.active {
            border-color: var(--sw-yellow);
            color: var(--sw-yellow);
        }

        .library-search {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #0f0f0f;
            color: var(--sw-text);
            border: 1px solid var(--sw-border);
            border-radius: 4px;
            box-sizing: border-box;
        }

        .library-panel {
            background: rgba(255, 232, 31, 0.05);
            border-left: 3px solid var(--sw-yellow);
            padding: 15px;
            min-height: 180px;
        }

        .library-tree-title {
            color: var(--sw-yellow);
            margin-top: 0;
        }

        .class-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85em;
        }

        .class-table th {
            background: rgba(255, 232, 31, 0.1);
            color: var(--sw-yellow);
            padding: 8px;
            text-align: left;
            border: 1px solid var(--sw-accent);
        }

        .class-table td {
            padding: 6px 8px;
            border: 1px solid var(--sw-accent);
        }

        .class-table tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            overflow: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background-color: var(--sw-panel);
            margin: 3% auto;
            padding: 20px;
            border: 2px solid var(--sw-yellow);
            width: 95%;
            max-width: 1000px;
            border-radius: 5px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            color: var(--sw-yellow);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover {
            color: white;
        }

        .btn-reference {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        .class-description {
            background: rgba(255, 232, 31, 0.05);
            border-left: 3px solid var(--sw-yellow);
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }

        .feature-item {
            background: rgba(0, 0, 0, 0.3);
            border-left: 2px solid var(--sw-blue);
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 3px;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .character-image-panel {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--sw-blue);
            border-radius: 5px;
            padding: 10px;
            text-align: center;
        }

        .character-image-panel h4 {
            margin: 0 0 10px 0;
            color: var(--sw-yellow);
            font-size: 0.9em;
        }

        .image-upload-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .image-container-9-16 {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--sw-blue);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: grab;
        }

        .image-container-9-16.active {
            cursor: grabbing;
        }

        .image-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.1s ease-out;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px dashed var(--sw-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.85em;
            cursor: pointer;
            text-align: center;
            padding: 10px;
        }

        .image-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 8px;
        }

        .btn-control {
            padding: 6px 12px;
            background: var(--sw-blue);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75em;
            transition: background 0.2s;
        }

        .btn-control:hover {
            background: var(--sw-yellow);
            color: black;
        }

        .zoom-info {
            font-size: 0.75em;
            color: #999;
            margin-bottom: 6px;
            height: 16px;
        }

        .btn-upload {
            padding: 8px 12px;
            background: var(--sw-blue);
            color: #000;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
        }

        .btn-upload:hover {
            background: var(--sw-yellow);
        }

        .btn-remove-image {
            padding: 6px 10px;
            background: rgba(255, 0, 0, 0.6);
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            width: 100%;
        }

        .btn-remove-image:hover {
            background: rgba(255, 0, 0, 0.9);
        }

        .lore-textarea {
            width: 100%;
            height: 400px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-blue);
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 0.95em;
            border-radius: 3px;
            resize: vertical;
        }

        .lore-textarea:focus {
            outline: none;
            border-color: var(--sw-yellow);
            box-shadow: 0 0 10px rgba(255, 232, 31, 0.3);
        }

        /* Notas Tab Styles */
        /* Notas Tab Styles Unificadas */
        .note-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--sw-accent);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .note-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .note-card-badge {
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .badge-force {
            background: rgba(46, 103, 248, 0.3);
            border: 1px solid var(--sw-blue);
            color: #7aaeff;
        }

        .badge-talent {
            background: rgba(255, 232, 31, 0.15);
            border: 1px solid var(--sw-yellow);
            color: var(--sw-yellow);
        }

        .badge-note {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #999;
            color: #ccc;
        }

        .badge-aptitude {
            background: rgba(0, 200, 120, 0.15);
            border: 1px solid #00c878;
            color: #00c878;
        }

        .badge-technique {
            background: rgba(175, 120, 255, 0.16);
            border: 1px solid #af78ff;
            color: #d7c1ff;
        }

        .library-linked-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 8px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .library-linked-row select,
        .library-linked-row input {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            color: var(--sw-text);
            border-radius: 3px;
        }

        .library-linked-controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: stretch;
            width: 100%;
        }

        .library-action-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .library-action-row .btn-add {
            margin-top: 0;
        }

        .btn-library-small {
            background: rgba(255, 232, 31, 0.12);
            color: var(--sw-yellow);
            border: 1px solid var(--sw-yellow);
            padding: 7px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        .btn-library-small:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .library-note-link {
            background: transparent;
            border: none;
            color: var(--sw-yellow);
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            text-align: left;
            font-size: 1em;
        }

        .library-note-link:hover {
            text-decoration: underline;
        }

        .note-card-title-static {
            color: var(--sw-yellow);
            font-weight: bold;
            font-size: 1em;
            flex: 1;
        }

        .note-card-title-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            color: var(--sw-yellow);
            padding: 8px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.95em;
        }

        .note-card-title-input:focus {
            outline: none;
            border-color: var(--sw-yellow);
            box-shadow: 0 0 5px rgba(255, 232, 31, 0.2);
        }

        .note-card-remove-btn {
            background: var(--sw-red);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
        }

        .note-card-remove-btn:hover {
            background: rgba(214, 40, 40, 0.8);
        }

        .note-card-textarea {
            width: 100%;
            min-height: 150px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--sw-accent);
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 0.9em;
            border-radius: 3px;
            resize: vertical;
            box-sizing: border-box;
        }

        .note-card-textarea:focus {
            outline: none;
            border-color: var(--sw-yellow);
            box-shadow: 0 0 5px rgba(255, 232, 31, 0.2);
        }

        .notes-section-title {
            color: var(--sw-yellow);
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--sw-accent);
            padding-bottom: 8px;
            margin: 20px 0 12px 0;
        }

        .notes-empty-msg {
            color: #555;
            font-size: 0.85em;
            font-style: italic;
            text-align: center;
            padding: 15px;
        }

        .btn-add-note {
            background: var(--sw-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .btn-add-note:hover {
            background: rgba(46, 103, 248, 0.8);
        }

    /* Login Screen */
    #loginScreen {
        position: fixed; inset: 0; background: #000;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
        background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                          radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
        background-size: 550px 550px, 350px 350px;
    }
    #loginBox {
        background: rgba(26,26,26,0.97); border: 2px solid var(--sw-yellow);
        border-radius: 10px; padding: 40px; width: 340px;
        box-shadow: 0 0 40px rgba(255,232,31,0.15); text-align: center;
    }
    #loginBox h2 { color: var(--sw-yellow); margin-bottom: 5px; border: none; }
    #loginBox p  { color: #888; font-size: 0.85em; margin-bottom: 25px; }
    #loginBox input {
        width: 100%; margin-bottom: 12px; padding: 10px;
        background: #111; border: 1px solid var(--sw-accent);
        color: white; border-radius: 4px; box-sizing: border-box; font-size: 0.95em;
    }
    #loginBox input:focus { outline: none; border-color: var(--sw-yellow); }
    #btnLogin {
        width: 100%; padding: 11px; background: var(--sw-yellow); color: black;
        border: none; border-radius: 4px; font-weight: bold; font-size: 1em;
        cursor: pointer; margin-top: 4px;
    }
    #btnLogin:hover { background: #ffe000; }
    #loginError { color: #ff6b6b; font-size: 0.82em; margin-top: 10px; min-height: 18px; }
    #userBar {
        display: none; align-items: center; gap: 12px;
        font-size: 0.82em; color: #aaa; margin-bottom: 8px;
    }
    #btnLogout {
        background: transparent; border: 1px solid #555; color: #aaa;
        padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 0.8em;
    }
    #btnLogout:hover { border-color: #D62828; color: #D62828; }
    #syncStatus { font-size: 0.75em; color: #555; margin-left: auto; }

        /* ============================================
           RESPONSIVO MOBILE
        ============================================ */
        @media (max-width: 768px) {

            body {
                padding: 8px;
            }

            h1 {
                font-size: 1.2em;
                letter-spacing: 1px;
            }

            h2 { font-size: 1em; }
            h3 { font-size: 0.95em; }

            /* Header */
            header h1 { font-size: 1.3em; }
            header p  { font-size: 0.78em; }

            /* Abas de personagem no topo */
            .tabs-header {
                gap: 6px;
                padding: 6px 0;
            }
            .tab-btn {
                padding: 8px 12px;
                font-size: 0.82em;
            }
            .add-tab-btn {
                padding: 8px 10px;
                font-size: 0.82em;
            }

            /* Conteúdo da ficha */
            .sheet-content {
                padding: 10px;
            }

            /* Abas internas Ficha / História / Notas */
            .sheet-tabs {
                gap: 4px !important;
                flex-wrap: nowrap;
                overflow-x: auto;
            }
            .sheet-tabs .tab-btn {
                padding: 8px 12px !important;
                font-size: 0.82em;
                white-space: nowrap;
            }

            /* Grid de painéis — 1 coluna no mobile */
            .grid-section {
                grid-template-columns: 1fr !important;
                gap: 12px;
                margin-bottom: 16px;
            }

    authDomain:        "campanha-star-wars.firebaseapp.com",

    storageBucket:     "campanha-star-wars.firebasestorage.app",
    messagingSenderId: "158883017246",
    appId:             "1:158883017246:web:ccc0b90d1e77578256f40f"
};

const MASTER_EMAIL   = "mestre@campanhawill.com";
const PLAYER_INFO = {
    "mestre@campanhawill.com":   { id: "mestre",   color: "user-mestre",   label: "Mestre" },
    "dede@campanhawill.com":     { id: "dede",     color: "user-dede",     label: "Dedé" },
    "paulo@campanhawill.com":    { id: "paulo",    color: "user-paulo",    label: "Paulo" },

// Ordem fixa das abas: mestre sempre primeiro, depois alfabético por jogador
const OWNER_ORDER = ["mestre", "dede", "paulo", "vinicius"];
window.OWNER_ORDER = OWNER_ORDER;

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);

let unsubListeners = [];
window._creatingInitialSheet = false;

document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('btnLogin');
    errorEl.textContent = '';
    btn.disabled = true;
    try {
        await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
        errorEl.textContent = 'E-mail ou senha incorretos.';
        btn.disabled = false;
    }
});

document.getElementById('loginPass').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btnLogin').click();
});

document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, user => {
    unsubListeners.forEach(u => u());
    unsubListeners = [];
    window._sheets.splice(0, window._sheets.length);
    window._activeSheetId = null;
    if (user) {
        window._currentUser = user;
        window._isMaster = (user.email === MASTER_EMAIL);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('userBar').style.display = 'flex';
        document.getElementById('userEmail').textContent = window._isMaster ? '👑 Mestre' : user.email;
        document.getElementById('btnLogin').disabled = false;
        startListeners();
    } else {
        window._currentUser = null;
        window._isMaster = false;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('userBar').style.display = 'none';
        if (typeof window._debouncedRender === 'function') window._debouncedRender();
    }
});

function startListeners() {
    const userEmail = window._currentUser.email;
    const userInfo  = PLAYER_INFO[userEmail];

    if (window._isMaster) {
        // Mestre escuta apenas coleções de jogadores (não a própria)
        const playerIds = Object.entries(PLAYER_INFO)
            .filter(([, info]) => info.id !== 'mestre')
            .map(([, info]) => info.id);

        playerIds.forEach(ownerId => {
            const unsub = onSnapshot(collection(db, `sheets_${ownerId}`), snap => {
                // Remove fichas desse owner que sumiram do Firestore
                const currentIds = snap.docs.map(d => d.id);
                const toRemove1 = window._sheets.filter(s =>
                    s.owner === ownerId && !(s.firebaseId && currentIds.includes(s.firebaseId))
                );
                toRemove1.forEach(s => {
                    const i = window._sheets.indexOf(s);
                    if (i >= 0) window._sheets.splice(i, 1);
                });
                // Atualiza/adiciona as que existem
                let needsRender = toRemove1.length > 0;
                snap.docs.forEach(d => {
                    const data = { ...d.data(), firebaseId: d.id, owner: ownerId };
                    if (!Array.isArray(data.forceTechniques)) data.forceTechniques = [];
                    const existing = window._sheets.find(s => s.firebaseId === d.id);
                    if (!existing) needsRender = true; // nova ficha
                    const changed = mergeSheet(data);
                    if (changed) needsRender = true;
                });
                if (needsRender && typeof window._debouncedRender === 'function') window._debouncedRender();
            });
            unsubListeners.push(unsub);
        });

        // Mestre também escuta a própria coleção
        const unsub = onSnapshot(collection(db, 'sheets_mestre'), snap => {
            const currentIds = snap.docs.map(d => d.id);
            const toRemove2 = window._sheets.filter(s =>
                s.owner === 'mestre' && !(s.firebaseId && currentIds.includes(s.firebaseId))
            );
            toRemove2.forEach(s => {
                const i = window._sheets.indexOf(s);
                if (i >= 0) window._sheets.splice(i, 1);
            });
            let needsRender2 = toRemove2.length > 0;
            snap.docs.forEach(d => {
                const data = { ...d.data(), firebaseId: d.id, owner: 'mestre' };
                if (!Array.isArray(data.forceTechniques)) data.forceTechniques = [];
                const existing = window._sheets.find(s => s.firebaseId === d.id);
                if (!existing) needsRender2 = true;
                const changed = mergeSheet(data);
                if (changed) needsRender2 = true;
            });
            if (needsRender2 && typeof window._debouncedRender === 'function') window._debouncedRender();
        });
        unsubListeners.push(unsub);

    } else if (userInfo) {
        const unsub = onSnapshot(collection(db, `sheets_${userInfo.id}`), snap => {
            const currentIds = snap.docs.map(d => d.id);
            const toRemove3 = window._sheets.filter(s =>
                !(s.firebaseId && currentIds.includes(s.firebaseId))
            );
            toRemove3.forEach(s => {
                const i = window._sheets.indexOf(s);
                if (i >= 0) window._sheets.splice(i, 1);
            });
            let needsRender3 = toRemove3.length > 0;
            snap.docs.forEach(d => {
                const data = { ...d.data(), firebaseId: d.id, owner: userInfo.id };
                if (!Array.isArray(data.forceTechniques)) data.forceTechniques = [];
                const existing = window._sheets.find(s => s.firebaseId === d.id);
                if (!existing) needsRender3 = true;
                const changed = mergeSheet(data);
                if (changed) needsRender3 = true;
            });
            if (needsRender3 && typeof window._debouncedRender === 'function') window._debouncedRender();
        });
        unsubListeners.push(unsub);
    }
}

function mergeSheet(data) {
    if (!data.firebaseId) return false;
    const arr = window._sheets;
    const idx = arr.findIndex(s => s.firebaseId === data.firebaseId);
    if (idx >= 0) {
        // Se esse update veio do nosso próprio save, ignora silenciosamente
        if (window._suppressNextRender === data.firebaseId) {
            window._suppressNextRender = null;
            return false; // indica: não precisa re-render por este doc
        }
        Object.assign(arr[idx], data);
    } else {
        arr.push(data);
        if (!window._activeSheetId) window._activeSheetId = data.id;
    }
    return true; // indica: houve mudança real
}

window.PLAYER_INFO  = PLAYER_INFO;
window._fbSetDoc    = (col, id, data) => setDoc(doc(db, col, id), data);
window._fbDeleteDoc = (col, id)       => deleteDoc(doc(db, col, id));

// Debounced render para evitar cascata de re-renders
let _renderTimer = null;
window._debouncedRender = function() {
    clearTimeout(_renderTimer);
    _renderTimer = setTimeout(() => {
        if (typeof renderSheets === 'function') renderSheets();
    }, 50);
};

<script>
    let sheets = [];
    let activeSheetId = null;

    Object.defineProperty(window, '_sheets', {
        get() { return sheets; },
        set(value) { sheets = value; }
    });

    Object.defineProperty(window, '_activeSheetId', {
        get() { return activeSheetId; },
        set(value) { activeSheetId = value; }
    });


    let creatingSheet = false;
    window._sheetCreationLock = false;

    async function addNewSheet() {

        if (creatingSheet || window._sheetCreationLock) {
            return;
        }

        creatingSheet = true;
        window._sheetCreationLock = true;

        document.querySelectorAll('.add-tab-btn').forEach(btn => {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
        });

        try {

            const userEmail = window._currentUser.email;
            const userInfo = window.PLAYER_INFO[userEmail];

            if (!userInfo) return;

            const newSheet = createEmptySheet();

            newSheet.owner = userInfo.id;
            newSheet.firebaseId = crypto.randomUUID();

            await window._fbSetDoc(
                `sheets_${userInfo.id}`,
                newSheet.firebaseId,
                newSheet
            );

            activeSheetId = newSheet.id;

        } finally {

            setTimeout(() => {
                creatingSheet = false;
                window._sheetCreationLock = false;

                document.querySelectorAll('.add-tab-btn').forEach(btn => {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                });

            }, 2000);
        }
    }

    function removeSheet(id) {
        id = Number(id);

        const sheet = sheets.find(s => s.id === id);

        if (!sheet) return;

        const userEmail = window._currentUser.email;
        const userInfo = window.PLAYER_INFO[userEmail];

        if (!window._isMaster && sheet.owner !== userInfo.id) {
            setSyncStatus('⚠ Você só pode apagar suas próprias fichas.');
            return;
        }

        const nomeFicha = sheet.name || 'Sem Nome';
        const owner     = sheet.owner;
        const fbId      = sheet.firebaseId;

        // Usa modal de confirmação (confirm() não funciona em iframe)
        window._showConfirmModal(
            `Apagar a ficha "<strong>${nomeFicha}</strong>"? Esta ação não pode ser desfeita.`,
            () => window._fbDeleteDoc(`sheets_${owner}`, fbId)
        );
    }

    let saveTimeout;

    function saveToLocalStorage() {

        clearTimeout(saveTimeout);

        saveTimeout = setTimeout(() => {

            const sheet = sheets.find(
                s => s.id === activeSheetId
            );

            if (!sheet || !window._currentUser || !window._fbSetDoc) {
                return;
            }

            const statusEl = document.getElementById('syncStatus');

            if (statusEl) {
                statusEl.textContent = '💾 Salvando...';
            }

            // Suprime o re-render do onSnapshot para saves locais
            window._suppressNextRender = sheet.firebaseId;

            window._fbSetDoc(
                `sheets_${sheet.owner}`,
                sheet.firebaseId,
                sheet
            ).then(() => {

                if (statusEl) {

                    statusEl.textContent = '✓ Salvo';

                    setTimeout(() => {
                        statusEl.textContent = '';
                    }, 2000);
                }
            });

        }, 500);
    }
</script>

                        {

    // Persistir estado visual da imagem
    function updateImageTransform(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (!sheet) return;

        const img = document.querySelector(`#sheet-${sheetId} .character-image`);
        const info = document.querySelector(`#sheet-${sheetId} .zoom-info`);
        
        if (img) {
            img.style.transform = `scale(${sheet.imageState.zoom}) translate(${sheet.imageState.offsetX}px, ${sheet.imageState.offsetY}px)`;
        }
        if (info) {
            info.textContent = `Zoom: ${(sheet.imageState.zoom * 100).toFixed(0)}%`;
        }
    }

    function zoomIn(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (sheet) {
            sheet.imageState.zoom = Math.min(sheet.imageState.zoom + 0.2, 3);
            updateImageTransform(sheetId);
            saveToLocalStorage();
        }
    }

    function zoomOut(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (sheet) {
            sheet.imageState.zoom = Math.max(sheet.imageState.zoom - 0.2, 0.5);
            updateImageTransform(sheetId);
            saveToLocalStorage();
        }
    }

    function fitImageToContainer(sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (sheet) {
            sheet.imageState.zoom = 1;
            sheet.imageState.offsetX = 0;
            sheet.imageState.offsetY = 0;
            updateImageTransform(sheetId);
            saveToLocalStorage();
        }
    }

    function setupImagePanEvents(sheetId) {
        const container = document.querySelector(`#sheet-${sheetId} .image-container-9-16`);
        const sheet = sheets.find(s => s.id === sheetId);
        
        if (!container || !sheet) return;

        let isDragging = false;
        let startX, startY;

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            container.classList.add('active');
        });

        const handleMouseMove = (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            sheet.imageState.offsetX += deltaX / sheet.imageState.zoom;
            sheet.imageState.offsetY += deltaY / sheet.imageState.zoom;

            startX = e.clientX;
            startY = e.clientY;

            updateImageTransform(sheetId);
        };

        const handleMouseUp = () => {
            if (isDragging) {
                isDragging = false;
                container.classList.remove('active');
                saveToLocalStorage();
            }
        };

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) zoomIn(sheetId);
            else zoomOut(sheetId);
        });
    }

    function getLibraryChoicesForField(field) {
        const config = LIBRARY_FIELD_CONFIG[field];
        const category = config ? LIBRARY_DATA[config.categoryKey] : null;
        if (!category) return [];

        if (category.items) {
            return category.items.map(item => ({ value: item, label: item, kind: 'item' }));
        }

        if (category.trees) {
            const choices = [];
            category.trees.forEach(tree => {
                choices.push({ value: tree.name, label: tree.name, kind: 'tree' });
                (tree.items || []).forEach(item => {
                    if (!item || item === 'Conteúdo desta árvore ainda não preenchido.') return;
                    choices.push({ value: item, label: `${item} — ${tree.name}`, kind: 'item', treeName: tree.name });
                });
            });
            return choices;
        }

        return [];
    }

    function isLibraryField(field) {
        return Boolean(LIBRARY_FIELD_CONFIG[field]);
    }

    function hasLibraryDetail(itemName) {
        return Boolean(LIBRARY_ITEM_DETAILS[itemName] || findLibraryTreeByName(itemName) || Object.values(LIBRARY_DATA).some(category => (category.items || []).includes(itemName) || (category.trees || []).some(tree => (tree.items || []).includes(itemName))));
    }

function findLibraryTreeByName(treeName) {
        const aptitudes = LIBRARY_DATA.aptitudes;
        if (!aptitudes || !aptitudes.trees) return null;
        const index = aptitudes.trees.findIndex(tree => tree.name === treeName);
        return index >= 0 ? { tree: aptitudes.trees[index], index } : null;
    }

    function openLibraryItemFromSheet(field, itemName) {
        if (!itemName) return;
        const config = LIBRARY_FIELD_CONFIG[field];
        if (!config) return;

        document.getElementById('libraryModal').classList.add('active');
        showLibraryCategory(config.categoryKey);

        const treeMatch = findLibraryTreeByName(itemName);
        if (treeMatch && config.categoryKey === 'aptitudes') {
            showLibraryTree('aptitudes', treeMatch.index);
            return;
        }

        const category = LIBRARY_DATA[config.categoryKey];
        let treeName = '';
        if (category?.trees) {
            const parentTree = category.trees.find(tree => (tree.items || []).includes(itemName));
            if (parentTree) treeName = parentTree.name;
        }
        showLibraryItem(category.label, itemName, treeName, config.categoryKey);
    }

    function renderNotesSection(sheet, field, prefix, badgeLabel, badgeClass, placeholder, emptyMsg) {
        const items = sheet[field] ? sheet[field].filter(item => item && item.trim() !== '') : [];
        if (items.length === 0) {
            return `<div class="notes-empty-msg">${emptyMsg}</div>`;
        }
        return items.map(item => {
            const key = prefix + '_' + encodeURIComponent(item);
            const savedText = (sheet.noteDetails && sheet.noteDetails[key]) ? sheet.noteDetails[key] : '';
            const escapedItem = item.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;');
            const jsItem = item.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            const escapedKey = key.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            const escapedText = savedText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const hasDetail = hasLibraryDetail(item);
            const titleMarkup = hasDetail
                ? `<button class="library-note-link" onclick="openLibraryItemFromSheet('${field}', '${jsItem}')">${escapedItem}</button>`
                : `<span class="note-card-title-static">${escapedItem}</span>`;
            return `<div class="note-card">
                <div class="note-card-header">
                    <span class="note-card-badge ${badgeClass}">${badgeLabel}</span>
                    ${titleMarkup}
                </div>
                <textarea class="note-card-textarea" placeholder="${placeholder}" onchange="updateNoteDetail(${sheet.id}, '${escapedKey}', this.value)">${escapedText}</textarea>
            </div>`;
        }).join('');
    }

    function renderDynamicItem(sheetId, field, index, value) {
        const escapedValue = String(value || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;');
        const jsValue = String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        if (isLibraryField(field)) {
            const choices = getLibraryChoicesForField(field);
            const isKnownChoice = choices.some(choice => choice.value === value);
            const options = [
                `<option value="">Selecionar da Biblioteca...</option>`,
                ...choices.map(choice => {
                    const choiceValue = String((choice && choice.value) || '');
                    const choiceLabel = String((choice && choice.label) || choiceValue);
                    return `<option value="${choiceValue.replace(/"/g, '&quot;')}" ${choiceValue === value ? 'selected' : ''}>${choiceLabel.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</option>`;
                })
            ].join('');
            return `
                <div class="dynamic-item">
                    <div class="library-linked-row">
                        <select onchange="updateLibraryLinkedItem(${sheetId}, '${field}', ${index}, this.value)">
                            ${options}
                        </select>
                        <div class="library-linked-controls">
                            <input type="text" value="${escapedValue}" onchange="updateDynamicItem(${sheetId}, '${field}', ${index}, this.value)" placeholder="${isKnownChoice ? 'Nome vinculado à Biblioteca' : 'Item customizado'}">
                            <button class="btn-library-small" ${hasLibraryDetail(value) ? '' : 'disabled'} onclick="openLibraryItemFromSheet('${field}', '${jsValue}')">Ver</button>
                            <button class="btn-remove" onclick="removeDynamicItem(${sheetId}, '${field}', ${index})">✕</button>
                        </div>
                    </div>
                </div>
            `;
        }
        return `
            <div class="dynamic-item">
                <input type="text" value="${escapedValue}" onchange="updateDynamicItem(${sheetId}, '${field}', ${index}, this.value)">
                <button class="btn-remove" onclick="removeDynamicItem(${sheetId}, '${field}', ${index})">✕</button>
            </div>
        `;
    }

    // Logic Functions
    function uploadCharacterImage(id, input) {
        const sheet = sheets.find(s => s.id === id);

        if (!sheet || !input.files || !input.files[0]) return;

        const file = input.files[0];

        const reader = new FileReader();

        reader.onload = function(e) {

            const img = new Image();

            img.onload = function() {

                // comprime a imagem para caber no Firestore
                const canvas = document.createElement('canvas');

                let width = img.width;
                let height = img.height;

                const MAX_WIDTH = 600;

                if (width > MAX_WIDTH) {
                    height = Math.round(height * (MAX_WIDTH / width));
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d');

                ctx.drawImage(img, 0, 0, width, height);

                // jpeg comprimido
                const compressedData = canvas.toDataURL('image/jpeg', 0.65);

                sheet.image = compressedData;

                if (!sheet.imageState) {
                    sheet.imageState = {
                        zoom: 1,
                        offsetX: 0,
                        offsetY: 0
                    };
                }

                const container = document.querySelector(`#sheet-${id} .image-container-9-16`);

                if (container) {

                    container.innerHTML = `
                        <div class="image-wrapper">
                            <img
                                src="${compressedData}"
                                alt="Personagem"
                                class="character-image"
                                style="transform: scale(1) translate(0px, 0px)">
                        </div>
                    `;
                }

                saveImageNow(sheet);

                if (typeof renderSheets === 'function') {
                    setTimeout(() => {
                        renderSheets();
                    }, 100);
                }
            };

            img.src = e.target.result;
        };

        reader.readAsDataURL(file);
    }

    function saveImageNow(sheet) {
        if (!sheet || !window._currentUser || !window._fbSetDoc || !sheet.owner || !sheet.firebaseId) return;
        window._fbSetDoc(`sheets_${sheet.owner}`, sheet.firebaseId, sheet)
            .then(() => {
                const s = document.getElementById('syncStatus');
                if (s) { s.textContent = '✓ Salvo'; setTimeout(() => { s.textContent = ''; }, 2000); }
            })
            .catch(e => console.error('image save error:', e));
    }

    function removeCharacterImage(id) {
        const sheet = sheets.find(s => s.id === id);
        if (!sheet) return;
        showConfirmModal('Remover a imagem do personagem?', () => {
            sheet.image = '';
            sheet.imageState = { zoom: 1, offsetX: 0, offsetY: 0 };
            const container = document.querySelector(`#sheet-${id} .image-container-9-16`);
            if (container) {
                container.innerHTML = '<span style="color:#666;font-size:0.85em;">Clique para adicionar</span>';
                container.classList.remove('active');
            }
            saveImageNow(sheet);
        });
    }

    
    function switchSheetTab(id, tabName) {
        // 1. Atualizar dados (sem salvar — estado visual não precisa persistir)
        const sheet = sheets.find(s => s.id == id);
        if (sheet) {
            sheet.activeTab = tabName;
        }

        // 2. Localizar elementos da ficha
        const sheetDiv = document.getElementById('sheet-' + id);
        if (!sheetDiv) return;

        // 3. Trocar visibilidade dos conteúdos
        const contents = sheetDiv.getElementsByClassName('sheet-tab-content');
        for (let content of contents) {
            content.style.display = 'none';
        }
        
        const target = document.getElementById('tab-' + tabName + '-' + id);
        if (target) target.style.display = 'block';

        // 4. Trocar estilos dos botões
        const buttons = sheetDiv.getElementsByClassName('tab-btn');
        for (let btn of buttons) {
            btn.style.borderBottom = '3px solid transparent';
            btn.style.color = '#ccc';
            
            // Se o botão corresponde à aba, destaca
            const onclick = btn.getAttribute('onclick') || '';
            if (onclick.includes("'" + tabName + "'")) {
                btn.style.borderBottom = '3px solid var(--sw-blue)';
                btn.style.color = 'var(--sw-yellow)';
            }
        }
    }

    function updateSkill(id, skillKey, field, value) {
        const sheet = sheets.find(s => s.id === id);
        if (!sheet) return;
        if (!sheet.skills) sheet.skills = {};
        if (!sheet.skills[skillKey]) sheet.skills[skillKey] = { treinada: false, bonus: 0 };
        sheet.skills[skillKey][field] = field === 'treinada' ? value : (parseInt(value) || 0);
        // Atualiza o total no DOM sem re-renderizar
        const row = document.querySelector(`#tab-pericias-${id} [data-skill="${skillKey}"]`);
        if (row) {
            const sk = sheet.skills[skillKey];
            const attr = row.getAttribute('data-attr');
            const attrMod = sheet.attributes[attr]?.mod || 0;
            const condPenalty = sheet.condition === -99 ? -10 : (sheet.condition || 0);
            const total = attrMod + (sk.treinada ? 5 : 0) + (sk.bonus || 0) + condPenalty;
            const totalEl = row.querySelector('.skill-total');
            if (totalEl) {
                totalEl.textContent = (total >= 0 ? '+' : '') + total;
                totalEl.style.color = total >= 0 ? 'var(--sw-yellow)' : '#ff6b6b';
            }
        }
        saveToLocalStorage();
    }

    function updateNoteDetail(id, key, value) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet) {
            if (!sheet.noteDetails) sheet.noteDetails = {};
            sheet.noteDetails[key] = value;
            saveToLocalStorage();
        }
    }

    function updateField(id, field, value) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet) {
            sheet[field] = value;
            saveToLocalStorage();
            if (field === 'name') {
                const tabsHeader = document.getElementById('tabsHeader');
                tabsHeader.innerHTML = '<button class="add-tab-btn" onclick="addNewSheet()">+ Nova Ficha</button>';
                // Ordenar igual ao renderSheets: mestre primeiro, depois ordem fixa
                const order = window.OWNER_ORDER || [];
                const currentOwner = window._isMaster ? 'mestre' : (window.PLAYER_INFO?.[window._currentUser?.email]?.id || '');
                const sortedForTabs = [...sheets].sort((a, b) => {
                    const ownerA = a.owner || currentOwner;
                    const ownerB = b.owner || currentOwner;
                    const posA = order.indexOf(ownerA) === -1 ? 999 : order.indexOf(ownerA);
                    const posB = order.indexOf(ownerB) === -1 ? 999 : order.indexOf(ownerB);
                    if (posA !== posB) return posA - posB;
                    return (a.name || '').localeCompare(b.name || '', 'pt-BR');
                });
                sortedForTabs.forEach(s => {
                    const btn = document.createElement('button');
                    const ownerInfo = Object.values(window.PLAYER_INFO || {}).find(i => i.id === s.owner);
                    const colorClass = ownerInfo ? ownerInfo.color : '';
                    const isMasterSheet = s.owner === 'mestre';
                    btn.className = `tab-btn ${colorClass}${s.id === activeSheetId ? ' active' : ''}`;
                    btn.innerHTML = `${isMasterSheet ? '👑 ' : ''}${s.name || 'Sem Nome'} <span class="remove-tab" onclick="event.stopPropagation(); removeSheet(${s.id})">✕</span>`;
                    btn.onclick = () => switchSheet(s.id);
                    tabsHeader.appendChild(btn);
                });
            }
            if (field === 'condition') {
                refreshSkillTotals(id, sheet);
            }
        }
    }

    function refreshSkillTotals(id, sheet) {
        const condPenalty = sheet.condition === -99 ? -10 : (sheet.condition || 0);
        const rows = document.querySelectorAll(`#tab-pericias-${id} tr[data-skill]`);
        rows.forEach(row => {
            const skillKey = row.getAttribute('data-skill');
            const attr     = row.getAttribute('data-attr');
            const sk       = (sheet.skills && sheet.skills[skillKey]) || { treinada: false, bonus: 0 };
            const attrMod  = sheet.attributes[attr]?.mod || 0;
            const total    = attrMod + (sk.treinada ? 5 : 0) + (parseInt(sk.bonus) || 0) + condPenalty;
            const totalEl  = row.querySelector('.skill-total');
            if (totalEl) {
                totalEl.textContent = (total >= 0 ? '+' : '') + total;
                totalEl.style.color = total >= 0 ? 'var(--sw-yellow)' : '#ff6b6b';
            }
        });
    }


    function updateNestedField(id, parent, field, value) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet && sheet[parent]) {
            sheet[parent][field] = value;
            saveToLocalStorage();
        }
    }

    function updateAttr(id, attr, value) {
        const sheet = sheets.find(s => s.id === id);
        if (sheet) {
            const val = parseInt(value) || 0;
            const mod = Math.floor((val - 10) / 2);
            sheet.attributes[attr].val = val;
            sheet.attributes[attr].mod = mod;
            // Atualiza o modificador no DOM sem re-renderizar tudo
            const modEl = document.querySelector(`#sheet-${id} [data-attr-mod="${attr}"]`);

    function calculateDefense(sheet, defType) {
        const baseDefense = 10;
        const def = sheet.defenses[defType];
        let attrMod = 0;

        if (defType === 'REF') attrMod = sheet.attributes.DES.mod;
        else if (defType === 'FORT') attrMod = sheet.attributes.CON.mod;
        else if (defType === 'VON') attrMod = sheet.attributes.SAB.mod;

        return baseDefense + attrMod + (def?.level || 0) + (def?.class || 0) + (def?.hab || 0) + (def?.other || 0);
    }

    function refreshDefenseTotals(id, sheet) {
        const sheetEl = document.getElementById('sheet-' + id);
        if (!sheetEl) return;
        ['FORT', 'REF', 'VON'].forEach(def => {
            if (!sheet.defenses[def]) return;
            // Atualiza total
            const totalEl = sheetEl.querySelector(`[data-def-total="${def}"]`);
            if (totalEl) totalEl.textContent = calculateDefense(sheet, def);
            // Atualiza label do atributo
            const attrEl = sheetEl.querySelector(`[data-def-attr="${def}"]`);
            if (attrEl) {
                let attrMod = 0, attrName = '';
                if (def === 'REF') { attrMod = sheet.attributes.DES.mod; attrName = 'DES'; }
                else if (def === 'FORT') { attrMod = sheet.attributes.CON.mod; attrName = 'CON'; }
                else if (def === 'VON') { attrMod = sheet.attributes.SAB.mod; attrName = 'SAB'; }
                attrEl.textContent = `${attrName} (${attrMod >= 0 ? '+' : ''}${attrMod})`;
            }
        });
    }

    function removeSheet(id) {
        id = Number(id);
        const sheet = sheets.find(s => s.id === id);
        if (!sheet) return;
        showConfirmModal(
            'Apagar a ficha "<strong>' + (sheet.name || 'Sem Nome') + '</strong>"? Esta ação não pode ser desfeita.',
            () => {
                if (sheet.owner && sheet.firebaseId && window._fbDeleteDoc) {
                    window._fbDeleteDoc('sheets_' + sheet.owner, sheet.firebaseId);
                } else {
                    sheets = sheets.filter(s => s.id !== sheet.id);
                    if (activeSheetId === sheet.id)
                        activeSheetId = sheets.length > 0 ? sheets[0].id : null;
                    renderSheets();
                }
            }
        );
    }

    function showConfirmModal(message, onConfirm) {
        let modal = document.getElementById('confirmModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'confirmModal';
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:99999;';
            modal.innerHTML = '<div style="background:#1a1a1a;border:2px solid #FFE81F;border-radius:10px;padding:30px;max-width:380px;width:90%;text-align:center;"><p id="confirmMsg" style="color:#e0e0e0;margin-bottom:24px;line-height:1.5;"></p><div style="display:flex;gap:12px;justify-content:center;"><button id="confirmYes" style="padding:10px 24px;background:#D62828;color:white;border:none;border-radius:5px;cursor:pointer;font-weight:bold;">Apagar</button><button id="confirmNo" style="padding:10px 24px;background:#333;color:#ccc;border:1px solid #555;border-radius:5px;cursor:pointer;">Cancelar</button></div></div>';
            document.body.appendChild(modal);
        }
        document.getElementById('confirmMsg').innerHTML = message;
        modal.style.display = 'flex';
        const yes = document.getElementById('confirmYes');
        const no  = document.getElementById('confirmNo');
        const close = () => { modal.style.display = 'none'; };
        yes.onclick = () => { close(); onConfirm(); };
        no.onclick  = close;
        modal.onclick = (e) => { if (e.target === modal) close(); };
    }
    window._showConfirmModal = showConfirmModal;



















    function switchSheet(id) {
        activeSheetId = id;

        // Atualizar abas superiores (só classes, sem re-renderizar)
        const tabsHeader = document.getElementById('tabsHeader');
        if (tabsHeader) {
            tabsHeader.querySelectorAll('button.tab-btn').forEach(btn => {
                // Detecta pelo onclick capturado no closure
                const isActive = btn._sheetId !== undefined ? btn._sheetId == id : false;
                btn.classList.toggle('active', isActive);
            });
        }

        // Mostrar só a sheet correta
        document.querySelectorAll('.sheet-content').forEach(div => {
            const isActive = div.id === 'sheet-' + id;
            div.classList.toggle('active', isActive);
        });

        // Restaurar aba interna correta para a sheet ativa
        const sheet = sheets.find(s => s.id == id);
        if (sheet) switchSheetTab(id, sheet.activeTab || 'ficha');
    }

    // saveToLocalStorage definido no módulo Firebase (linha ~1179)

    function loadFromLocalStorage() {
        const data = localStorage.getItem('swSheets');
        if (data) {
            sheets = JSON.parse(data);
            if (sheets.length > 0) {
                activeSheetId = sheets[0].id;
                // Garantir que todas as fichas carregadas tenham os campos necessários
                sheets.forEach(s => {
                    if (!s.imageState) s.imageState = { zoom: 1, offsetX: 0, offsetY: 0 };
                    if (!s.noteDetails) s.noteDetails = {};
                    if (!Array.isArray(s.forceTechniques)) s.forceTechniques = [];
                    if (s.generalNotes === undefined) s.generalNotes = '';
                    if (!s.customNotes) s.customNotes = [];
                    if (!s.activeTab) s.activeTab = 'ficha';
                });
            }
        }
    }

    function openClassReference() {
        const modal = document.getElementById('classModal');
        const selector = document.getElementById('classSelector');
        const details = document.getElementById('classDetails');

        selector.innerHTML = '';
        details.innerHTML = '';

        HEROIC_CLASSES.forEach(className => {
            const btn = document.createElement('button');
            btn.className = 'class-btn active';
            btn.textContent = className;
            btn.onclick = () => showClassDetails(className);
            selector.appendChild(btn);
        });

        PRESTIGE_CLASSES.forEach(className => {
            const btn = document.createElement('button');
            btn.className = 'class-btn';
            btn.textContent = className;
            btn.onclick = () => showClassDetails(className);
            selector.appendChild(btn);
        });

        showClassDetails(HEROIC_CLASSES[0]);
        modal.classList.add('active');
    }

    function showClassDetails(className) {
        const details = document.getElementById('classDetails');
        let classData = CLASS_DATA[className];
        if (!classData) {
            classData = Object.values(CLASS_DATA).find(c => c.nome === className);
        }

        if (!classData) {
            details.innerHTML = `<p>Dados da classe "${className}" não disponíveis.</p>`;
            return;
        }

        details.innerHTML = `
            <div class="class-info active">
                <h3>${classData.nome}</h3>
                <div class="class-description">${classData.desc}</div>
                <h4>Pontos de Vida</h4>
                <p>${classData.hp}</p>
                <h4>Pontos de Força</h4>
                <p>${classData.forcePoints}</p>
                <h4>Bônus de Defesa</h4>
                <p>${classData.defenses}</p>
                <h4>Perícias</h4>
                <p>${classData.skills}</p>
                <h4>Talentos Iniciais</h4>
                <ul>${classData.initialTalents.map(t => '<li>' + t + '</li>').join('')}</ul>
                ${(classData.sections || []).map(section => '<h4>' + section.title + '</h4><p style="white-space: pre-line">' + section.text + '</p>').join('')}
                <h4>Progressão de Classe</h4>
                <table class="class-table">
                    <tbody>
                        ${classData.table.map((row, idx) => '<tr>' + row.map(cell => idx === 0 ? '<th>' + cell + '</th>' : '<td>' + cell + '</td>').join('') + '</tr>').join('')}
                    </tbody>
                </table>
            </div>
        `;

        // Atualizar botões
        document.querySelectorAll('.class-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.textContent === className) {
                btn.classList.add('active');
            }
        });
    }

        document.getElementById('classModal').classList.remove('active');
    }
