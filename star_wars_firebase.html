                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisitos: Sensibilidade à Força, treinado em Usar a Força.\n\nBenefício: Sua presença no Lado Sombrio oprime criaturas próximas. Uma vez por encontro, quando usar um poder da Força com descritor do Lado Sombrio, inimigos afetados ou próximos ao efeito sofrem penalidade em Defesas ou verificações contra medo, intimidação e influência sombria até o fim do seu próximo turno."
        },
        "Mau Pressentimento (Bad Feeling)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Sensibilidade à Força.\n\nBenefício: Quando uma surpresa, emboscada ou perigo iminente começa, você pode agir durante a rodada surpresa mesmo que normalmente fosse surpreendido. Se já pudesse agir, recebe +2 de bônus de percepção ou iniciativa para reagir ao perigo imediato."
        },
        "Mente Binária (Binary Mind)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: Droide.\n\nBenefício: Você recebe +5 de bônus de competência na Defesa de Vontade contra efeitos de afeta a mente, programação hostil, comandos falsos e tentativas de confusão lógica. Esse benefício representa processamento paralelo, rotinas de verificação e barreiras mentais digitais."
        },
        "Mente da Razão (Mind of Reason)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Inteligência 13.\n\nBenefício: Você pode usar seu modificador de Inteligência em vez do modificador de Sabedoria em verificações e resistências baseadas em análise racional, lógica e autocontrole. Esse benefício se aplica quando a situação permite responder por dedução, disciplina mental e interpretação objetiva dos fatos."
        },
        "Mentiroso Imperceptível (Imperceptible Liar)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Enganação treinada.\n\nBenefício: Quando mente, encobre informação ou sustenta uma identidade falsa, criaturas que tentem perceber sua mentira sofrem dificuldade adicional. Você recebe +5 de bônus de competência em Enganação para blefar, ocultar intenção e resistir a tentativas de detectar falsidade."
        },
        "Mergulhar para Cobertura (Dive for Cover)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Destreza 13.\n\nBenefício: Quando for alvo de um ataque de área, você pode cair prostrado como reação para reduzir o dano sofrido. Se o ataque permitir metade do dano em caso de falha ou acerto parcial, esse movimento melhora sua chance de evitar parte do efeito conforme as regras da cena."
        },
        "Mestre de Armas Gungan (Gungan Weapon Master)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Espécie Gungan.\n\nBenefício: Você recebe +1 de bônus em jogadas de ataque com armas tradicionais Gungan, como atlatls, bolas de energia, lanças e armas culturais equivalentes. Quando usa essas armas em ambiente aquático, pantanoso ou terreno familiar, o bônus aumenta para +2."
        },
        "Mestre dos Disfarces (Master of Disguise)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Enganação treinada.\n\nBenefício: Você pode criar disfarces mais rápido e com maior qualidade. Recebe +5 de bônus de competência em verificações de Enganação feitas para se disfarçar, imitar aparência, ocultar identidade ou sustentar uma persona visualmente convincente."
        },
        "Mestre dos Rifles (Riflemaster)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Proficiência com rifles, Foco em Arma com rifles ou bônus base de ataque +5.\n\nBenefício: Quando usa um rifle, você recebe benefícios adicionais em precisão, estabilidade e controle de disparo. Se mirar antes do ataque, causa +1 dado de dano ou recebe bônus adicional na jogada de ataque, conforme o uso apropriado da arma."
        },
        "Metamorfo (Metamorph)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Espécie ou habilidade natural de mudança de forma.\n\nBenefício: Você recebe +5 de bônus de competência em verificações feitas para alterar aparência, imitar traços físicos e sustentar uma forma assumida. Esse benefício se aplica a Enganação, resistência contra inspeção física e usos apropriados da habilidade natural de metamorfose."
        },
        "Metralhar (Strafe)": {
                "source": "Star Wars Saga Edition Starships of the Galaxy / Wiki-Fandom",
                "text": "Pré-requisitos: Combate Veicular, Pilotar treinado.\n\nBenefício: Quando pilota um veículo ou nave e faz um ataque com arma veicular contra alvos no solo ou em linha de passagem, pode distribuir fogo ao longo do movimento. O ataque representa uma rajada de passagem, cobrindo uma rota estreita com disparos sucessivos."
        },
        "Mira Múltipla (Multi‑Targeting)": {
                "source": "Star Wars Saga Edition Starships of the Galaxy / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +6 ou proficiência com armas veiculares.\n\nBenefício: Quando opera armas capazes de acompanhar múltiplos alvos, você pode dividir sensores, travas ou sequência de disparos com mais eficiência. Recebe +2 de bônus em ataques ou verificações feitas para atingir alvos diferentes no mesmo turno com sistemas compatíveis."
        },
        "Mobilidade (Mobility)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Destreza 13, Esquiva.\n\nBenefício: Você recebe +5 de bônus de esquiva na Defesa de Reflexos contra ataques de oportunidade provocados por movimento para dentro, para fora ou através de áreas ameaçadas. Esse bônus se aplica apenas enquanto você mantém mobilidade e capacidade de reagir."
        },
        "Modificação Apressada (Hasty Modification)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: Mecânica treinada.\n\nBenefício: Você pode instalar, ajustar ou improvisar uma modificação técnica em menos tempo que o normal. A modificação apressada funciona por tempo limitado ou até o fim do encontro, exigindo ferramentas e peças apropriadas para a alteração desejada."
        },
        "Movimento Impetuoso (Impetuous Move)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Iniciativa treinada.\n\nBenefício: No início de um encontro, antes de agir normalmente, você pode se mover 1 quadrado como reação ou ação livre apropriada. Esse movimento representa impulso imediato para alcançar cobertura, avançar sobre o inimigo ou reposicionar-se diante de perigo súbito."
        },
        "Nadador Perfeito (Perfect Swimmer)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Nadar treinado.\n\nBenefício: Uma vez por encontro, você pode repetir uma verificação de Nadar e ficar com o melhor resultado. Além disso, recebe +2 de bônus de competência em verificações de Nadar feitas em correnteza, combate submerso ou água turbulenta."
        },
        "Nadador Rápido (Fast Swimmer)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Deslocamento de natação ou Nadar treinado.\n\nBenefício: Seu deslocamento de natação aumenta em 2 quadrados. Se você não possuir deslocamento de natação, recebe +5 de bônus de competência em verificações de Nadar feitas para se mover rapidamente ou atravessar água sob pressão."
        },
        "Negociador Astuto (Shrewd Bargainer)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Persuasão treinada.\n\nBenefício: Você recebe +5 de bônus de competência em verificações de Persuasão feitas para negociar preços, trocar favores, barganhar contratos, avaliar concessões e obter condições comerciais melhores. Esse benefício se aplica a compras, vendas, acordos e tratativas sociais envolvendo recursos."
        },
        "Nunca se Render (Never Surrender)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Constituição 13 ou Tolerância treinada.\n\nBenefício: Uma vez por encontro, quando seria reduzido a 0 Pontos de Vida ou ficaria inconsciente por dano, você pode permanecer consciente até o fim do seu próximo turno. Durante esse período, ainda sofre as penalidades normais de condição e dano."
        },
        "Olho Morto (Deadeye)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Tiro à Queima-Roupa.\n\nBenefício: Se você mirar antes de fazer um ataque à distância, causa +1 dado de dano se o ataque acertar. Esse benefício se aplica apenas contra o alvo mirado e exige que você mantenha as condições normais para mirar."
        },
        "Operativos Secretos (Covert Operatives)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Furtividade treinada.\n\nBenefício: Você recebe +3 de bônus de competência em verificações de Furtividade. Para cada aliado a até 12 quadrados que também possua este Talento e esteja participando da infiltração, o bônus aumenta em +1, até o máximo de +7."
        },
        "Parar (Halt)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Persuasão treinada.\n\nBenefício: Como ação padrão, você pode ordenar que uma criatura pare, recue ou hesite. Faça uma verificação de Persuasão contra a Defesa de Vontade do alvo. Se tiver sucesso, o alvo perde parte do movimento ou fica impedido de se aproximar de você até o início do seu próximo turno, desde que possa entender sua ordem."
        },
        "Pegada Wookiee (Wookie Grip)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Espécie Wookiee.\n\nBenefício: Você recebe +5 de bônus de espécie em verificações feitas para agarrar, escalar, segurar objetos, impedir que uma arma seja arrancada de sua mão ou resistir a efeitos que tentem soltá-lo de uma superfície, veículo, cabo ou criatura."
        },
        "Pele Grossa (Thick Skin)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Constituição 13 ou espécie com pele resistente.\n\nBenefício: Você recebe +1 de bônus natural na Defesa de Fortitude e +1 de bônus de armadura natural na Defesa de Reflexos contra ataques físicos. Esse benefício representa couro espesso, placas naturais, pele endurecida ou resistência corporal incomum."
        },
        "Percepção Instintiva (Instinctive Perception)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Sabedoria 13.\n\nBenefício: Você pode repetir uma verificação de Percepção uma vez por encontro, ficando com o melhor resultado. Esse benefício se aplica a perceber emboscadas, notar movimento, reconhecer perigo imediato ou detectar algo fora do comum por instinto."
        },
        "Perícia Rápida (Quick Skill)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Treinado na perícia escolhida.\n\nBenefício: Escolha uma perícia treinada. Uma vez por encontro, você pode realizar uma aplicação dessa perícia como uma ação mais rápida que o normal, desde que a tarefa seja compatível com execução apressada e você tenha os instrumentos necessários."
        },
        "Permanecer de Pé (Stay Up)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Constituição 13 ou Tolerância treinada.\n\nBenefício: Quando um efeito faria você cair prostrado, pode fazer uma verificação de Tolerância como reação. Se o resultado superar a CD apropriada ou a jogada oposta do atacante, você permanece de pé."
        },
        "Personalidade Indomável (Indomitable Personality)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Carisma 13.\n\nBenefício: Você pode usar seu modificador de Carisma no lugar do modificador de Sabedoria ao determinar sua Defesa de Vontade, se ele for maior. Esse benefício representa presença dominante, autoconfiança e força de identidade."
        },
        "Personificar (Impersonate)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Enganação treinada.\n\nBenefício: Você recebe +5 de bônus de competência em verificações de Enganação feitas para imitar uma pessoa específica. O bônus se aplica a voz, postura, comportamento, etiqueta, maneirismos e pequenas respostas sociais ligadas à identidade copiada."
        },
        "Pés Ligeiros (Fleet‑Footed)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Nenhum.\n\nBenefício: Seu deslocamento aumenta em 2 quadrados. Esse aumento se aplica ao deslocamento terrestre normal e a outras formas de movimento quando a espécie ou equipamento permitir a mesma adaptação."
        },
        "Piloto Impecável (Flawless Pilot)": {
                "source": "Star Wars Saga Edition Starships of the Galaxy / Wiki-Fandom",
                "text": "Pré-requisitos: Pilotar treinado.\n\nBenefício: Uma vez por encontro, você pode repetir uma verificação de Pilotar, ficando com o melhor resultado. Esse benefício se aplica a manobras, evasões, perseguições, pousos difíceis, controle em alta velocidade e pilotagem sob fogo inimigo."
        },
        "Pinça (Pincer)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Quando você e um aliado atacam o mesmo inimigo a partir de lados opostos ou posições que limitem a fuga do alvo, você recebe +2 de bônus na jogada de ataque corpo a corpo contra esse inimigo."
        },
        "Pistoleiro (Pistoleer)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Proficiência com pistolas.\n\nBenefício: Quando usa uma pistola, você recebe +1 de bônus em jogadas de ataque feitas contra alvos a até 6 quadrados. Se mirar antes do ataque, também recebe +1 de bônus nas rolagens de dano com pistolas contra o alvo mirado."
        },
        "Posição Estabilizadora (Steadying Position)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Tiro Cuidadoso.\n\nBenefício: Quando está prostrado e mira antes de atacar, você pode negar o bônus de Destreza do alvo na Defesa de Reflexos contra esse ataque. Esse benefício representa uma posição firme, linha de tiro estável e paciência para explorar uma abertura."
        },
        "Postura Resoluta (Resolute Stance)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Constituição 13.\n\nBenefício: Enquanto estiver lutando defensivamente ou usando cobertura, você recebe +2 de bônus de competência na Defesa de Fortitude contra efeitos que empurrem, derrubem, enfraqueçam ou movam você na Trilha de Condição."
        },
        "Precisão Cirúrgica (Pinpoint Accuracy)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +6.\n\nBenefício: Quando mira antes de atacar, você pode ignorar parte da cobertura ou ocultação do alvo. Se o ataque acertar, o dano representa um golpe em ponto vulnerável, junta exposta, sensor, fresta de armadura ou órgão vital."
        },
        "Precisão de Mira (Aiming Accuracy)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Tiro à Queima-Roupa.\n\nBenefício: Quando você mira antes de fazer um ataque à distância, recebe +2 de bônus adicional na jogada de ataque contra o alvo mirado. Esse benefício exige linha de visão e as condições normais para a ação de mirar."
        },
        "Presença Perturbadora (Disturbing Presence)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Carisma 13.\n\nBenefício: Criaturas inimigas a até 6 quadrados que possam ver ou ouvir você sofrem –2 de penalidade em verificações de Persuasão feitas para melhorar atitudes, negociar ou inspirar confiança. Sua presença causa desconforto, medo ou desconfiança instintiva."
        },
        "Prestidigitação Aprimorada (Improved Sleight of Hand)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Prestidigitação treinada.\n\nBenefício: Você recebe +5 de bônus de competência em verificações de Prestidigitação feitas para ocultar objetos, sacar itens sem ser notado, plantar pequenos objetos, esconder armas leves ou executar truques manuais sob observação."
        },
        "Primeiros Socorros Selvagens (Wilderness First Aid)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Sobrevivência treinada, Tratar Ferimentos treinada.\n\nBenefício: Você pode prestar primeiros socorros usando materiais naturais, plantas, fibras, improvisos e recursos encontrados no ambiente. Quando não possui medpac, pode reduzir penalidades por falta de equipamento em verificações de Tratar Ferimentos feitas fora de instalações médicas."
        },
        "Proficiência com Arma (Weapon Proficiency)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Nenhum.\n\nBenefício: Escolha um grupo de armas, como armas simples, pistolas, rifles, armas pesadas, armas avançadas corpo a corpo ou sabres de luz. Você é proficiente com o grupo escolhido e não sofre a penalidade normal por falta de proficiência ao usá-lo.\n\nEspecial: Você pode escolher este Talento várias vezes. Cada vez, ele se aplica a um grupo de armas diferente."
        },
        "Proficiência com Arma Exótica (Exotic Weapon Proficiency)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Escolha uma arma exótica específica. Você é proficiente com essa arma e não sofre a penalidade normal por falta de proficiência ao usá-la.\n\nEspecial: Você pode escolher este Talento várias vezes. Cada vez, ele se aplica a uma arma exótica diferente."
        },
        "Proficiência com Armadura (Armor Proficiency)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Nenhum para armaduras leves; proficiência apropriada e requisitos indicados para categorias superiores.\n\nBenefício: Escolha uma categoria de armadura. Você sabe usar essa armadura de forma eficiente e reduz ou elimina penalidades por falta de proficiência ao vestir armaduras da categoria escolhida.\n\nEspecial: Pode ser escolhido várias vezes, cada vez para uma categoria diferente."
        },
        "Projetista de Naves (Starship Designer)": {
                "source": "Star Wars Saga Edition Starships of the Galaxy / Wiki-Fandom",
                "text": "Pré-requisitos: Mecânica treinada, Conhecimento apropriado treinado.\n\nBenefício: Você recebe +5 de bônus de competência em verificações feitas para projetar, modificar ou avaliar naves estelares. Também pode identificar falhas de projeto, oportunidades de melhoria e limitações estruturais durante construção ou reforma de uma nave."
        },
        "Prontidão da Força (Force Readiness)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "text": "Pré-requisitos: Sensibilidade à Força, Usar a Força treinada.\n\nBenefício: Uma vez por encontro, você pode recuperar um poder da Força gasto como uma ação rápida. Esse benefício representa disciplina mental, preparação espiritual e capacidade de reorganizar sua conexão com a Força durante combate."
        },
        "Prosseguir o Ataque (Follow Through)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Quando você reduz um inimigo a 0 Pontos de Vida com um ataque corpo a corpo, pode fazer um passo de 1 quadrado como ação livre e continuar pressionando outro inimigo ao seu alcance. Esse movimento não provoca ataques de oportunidade."
        },
        "Queda Enganosa (Deceptive Drop)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Enganação treinada.\n\nBenefício: Você pode se deixar cair, cambalear ou fingir vulnerabilidade para enganar um inimigo. Faça uma verificação de Enganação contra a Defesa de Vontade do alvo. Se tiver sucesso, seu próximo ataque contra esse alvo antes do fim do seu próximo turno recebe +2 de bônus."
        },
        "Rajada de Golpes (Flurry)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Quando faz um ataque corpo a corpo, você pode aceitar uma penalidade na jogada de ataque para realizar golpes rápidos e sucessivos. Se acertar, causa dano adicional conforme a arma e o estilo usados. Esse talento favorece volume de ataques sobre precisão."
        },
        "Rastreador Mestre (Master Tracker)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Sobrevivência treinada.\n\nBenefício: Você pode se mover em velocidade normal enquanto rastreia sem sofrer a penalidade comum por deslocamento. Também recebe +5 de bônus de competência em verificações de Sobrevivência feitas para seguir rastros difíceis, antigos ou parcialmente apagados."
        },
        "Reação Rápida (Rapid Reaction)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Nenhum.\n\nBenefício: Uma vez por encontro, você pode reagir duas vezes ao mesmo gatilho. As duas reações precisam ser válidas para a situação e resolvidas conforme a ordem definida pelo efeito que provocou a reação."
        },
        "Recordar (Recall)": {
                "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                "text": "Pré-requisitos: Inteligência 13.\n\nBenefício: Uma vez por encontro, você pode repetir uma verificação de Conhecimento ou uma verificação feita para lembrar informação, ficando com o melhor resultado. Esse benefício se aplica a fatos estudados, detalhes observados e informações memorizadas."
        },
        "Recuperação Fortificante (Fortifying Recovery)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Constituição 13.\n\nBenefício: Quando usa seu segundo fôlego, além de recuperar Pontos de Vida, recebe +2 de bônus de competência na Defesa de Fortitude até o início do seu próximo turno. Esse benefício representa recuperação física acompanhada de resistência imediata."
        }
,
        "Recuperação Vigorosa (Forceful Recovery)": {
          "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
          "text": "Pré-requisitos: Constituição 13.\n\nBenefício: Quando usa seu segundo fôlego, você recupera Pontos de Vida com vigor adicional. Além da cura normal do segundo fôlego, recebe Pontos de Vida extras iguais ao seu modificador de Constituição, mínimo de 1."
},
        "Recuperar o Fôlego Extra (Extra Second Wind)": {
          "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
          "text": "Pré-requisitos: Constituição 13, treinado em Tolerância.\n\nBenefício: Você pode usar seu segundo fôlego uma vez adicional por dia. Esse uso extra segue as regras normais de segundo fôlego, incluindo ação necessária, quantidade recuperada e limites aplicáveis."
},
        "Reflexos de Combate (Combat Reflexes)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                  "text": "Pré-requisitos: Nenhum.\n\nBenefício: Você pode fazer ataques de oportunidade adicionais por rodada em quantidade igual ao seu modificador de Destreza. Esses ataques se somam ao ataque de oportunidade que todo personagem pode fazer normalmente. Você também pode fazer ataques de oportunidade enquanto estiver desprevenido.\n\nNormal: Um personagem sem este Talento pode fazer apenas um ataque de oportunidade por rodada e não pode fazer ataques de oportunidade enquanto estiver desprevenido."
        },
        "Regimento Montado (Mounted Regiment)": {
          "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
          "text": "Pré-requisitos: Treinado em Cavalgar ou Pilotar.\n\nBenefício: Você sabe atuar em formação com montarias, speeders ou veículos leves. Enquanto estiver montado ou pilotando em formação com pelo menos um aliado próximo, recebe +2 de bônus de competência em verificações de Cavalgar ou Pilotar feitas para manter posição, avançar em grupo, evitar colisões e executar manobras coordenadas."
},
        "Resiliência Inata (Inborn Resilience)": {
          "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
          "text": "Pré-requisitos: Constituição 13 ou espécie resistente.\n\nBenefício: Você recebe +2 de bônus de competência em verificações de Tolerância contra fadiga, doença, veneno, ambientes hostis e efeitos que tentem enfraquecer seu corpo. Quando um desses efeitos permitir uma nova verificação para se recuperar, recebe o mesmo bônus nessa verificação."
},
        "Resistência a Agarrões (Grapple Resistance)": {
          "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
          "text": "Pré-requisitos: Força 13 ou Destreza 13.\n\nBenefício: Você recebe +5 de bônus em verificações e Defesas usadas para resistir a agarrões, escapar de imobilizações, impedir que seja preso por tentáculos, cabos, redes ou contenções corporais, e evitar ser movido enquanto está agarrado."
},
        "Resistência a Veneno (Poison Resistance)": {
          "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
          "text": "Pré-requisitos: Constituição 13.\n\nBenefício: Você recebe +5 de bônus de competência na Defesa de Fortitude contra venenos. Esse bônus também se aplica a verificações ou resistências feitas para reduzir, atrasar ou encerrar os efeitos de toxinas já presentes no organismo."
},
        "Resistência Aumentada (Increased Resistance)": {
          "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
          "text": "Pré-requisitos: Droide ou sistema de resistência instalado.\n\nBenefício: Escolha um tipo de dano ou efeito compatível com sua estrutura, blindagem ou sistemas internos. Sua resistência contra esse tipo aumenta, reduzindo o dano ou melhorando sua Defesa contra efeitos relacionados. A escolha deve representar uma modificação física, programação defensiva ou construção especializada."
},
        "Resolução Inabalável (Unwavering Resolve)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Treinado em Percepção.\n\nBenefício: Você recebe +5 de bônus na Defesa de Vontade contra usos de Enganação e Persuasão. Esse bônus representa atenção a blefes, pressão social, intimidação, sedução, manipulação verbal e tentativas de conduzir suas decisões por leitura falsa da situação."
        },
        "Ressurgência (Resurgence)": {
          "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
          "text": "Pré-requisitos: Constituição 13.\n\nBenefício: Uma vez por encontro, quando subir na Trilha de Condição ou recuperar Pontos de Vida por segundo fôlego, tratamento médico, poder da Força ou outro efeito de cura, você recebe +2 de bônus em jogadas de ataque e verificações de perícia até o fim do seu próximo turno."
},
        "Retirada Oportunista (Opportunistic Retreat)": {
          "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
          "text": "Pré-requisitos: Destreza 13 ou Acrobacia treinada.\n\nBenefício: Quando um inimigo adjacente erra um ataque contra você, você pode se mover 1 quadrado como reação. Esse movimento precisa terminar em um espaço legal e não provoca ataque de oportunidade do inimigo que errou o ataque."
},
        "Retorno Rápido (Quick Comeback)": {
          "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
          "text": "Pré-requisitos: Constituição 13 ou Tolerância treinada.\n\nBenefício: Quando se levanta de prostrado, se recupera de atordoamento ou remove uma penalidade temporária que limitava suas ações, você pode se mover 1 quadrado como ação livre. Esse movimento representa retomada imediata de equilíbrio e posição."
},
        "Robustez (Toughness)": {
          "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
          "text": "Pré-requisitos: Nenhum.\n\nBenefício: Você recebe Pontos de Vida adicionais iguais ao seu nível heroico. Sempre que ganhar um novo nível heroico, recebe +1 Ponto de Vida adicional por este Talento."
},
        "Sacudir o Efeito (Shake It Off)": {
          "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
          "text": "Pré-requisitos: Constituição 13, treinado em Tolerância.\n\nBenefício: Você pode gastar duas ações rápidas na mesma rodada para subir 1 passo na Trilha de Condição. Esse uso representa foco físico, controle da dor e esforço consciente para superar efeitos debilitantes."
},
        "Saque Rápido (Quick Draw)": {
          "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
          "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Você pode sacar ou guardar uma arma como uma ação rápida em vez de uma ação de movimento. Também pode sacar uma arma arremessável como parte do ataque feito com ela."
},
        "Saque Relâmpago (Lightning Draw)": {
          "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
          "text": "Pré-requisitos: Saque Rápido.\n\nBenefício: No início de um encontro, se ainda não estiver com a arma na mão, você pode sacar uma arma como reação antes de agir em seu primeiro turno. Se atacar com essa arma no primeiro turno, recebe +2 de bônus de competência na primeira jogada de ataque contra um alvo que ainda não tenha agido."
},
        "Sensibilidade à Força (Force Sensitivity)": {
          "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
          "text": "Pré-requisitos: Nenhum.\n\nBenefício: Você é sensível à Força e pode aprender a perícia Usar a Força como perícia de classe. Também pode escolher Talentos, Aptidões, poderes da Força e outros recursos que exigem Sensibilidade à Força, desde que cumpra os demais pré-requisitos."
},
        "Sentidos Aguçados (Sharp Senses)": {
          "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
          "text": "Pré-requisitos: Nenhum.\n\nBenefício: Você recebe +5 de bônus de competência em verificações de Percepção. Esse bônus se aplica a notar criaturas escondidas, ouvir sons distantes, perceber movimento, detectar emboscadas e reconhecer detalhes sutis no ambiente."
},
        "Sentinelas Cautelosas (Wary Sentries)": {
          "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
          "text": "Pré-requisitos: Percepção treinada.\n\nBenefício: Quando você e aliados montam guarda, patrulham uma área ou protegem um acampamento, todos os aliados participantes recebem +2 de bônus de competência em Percepção contra emboscadas e aproximação furtiva. O bônus exige comunicação mínima e divisão clara de setores de vigilância."
},
        "Sobrevivência Nikto (Nikto Survival)": {
          "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
          "text": "Pré-requisitos: Espécie Nikto.\n\nBenefício: Você recebe +2 de bônus de espécie em Tolerância e Sobrevivência em ambientes hostis, áridos, rochosos, desérticos ou perigosos. Esse bônus se aplica a resistir a sede, calor, fadiga, privação e riscos naturais semelhantes."
},
        "Sobrevivente de Ryloth (Survivor of Ryloth)": {
          "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
          "text": "Pré-requisitos: Twi'lek ou origem em Ryloth.\n\nBenefício: Você recebe +2 de bônus de competência em Tolerância e Sobrevivência contra calor extremo, tempestades, escassez de recursos e perigos ambientais de mundos áridos. Também recebe +2 em Persuasão ou Enganação ao lidar com comunidades marcadas por sobrevivência, escravidão, contrabando ou exílio."
},
        "Subespécie com Garras (Clawed Subspecies)": {
          "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
          "text": "Pré-requisitos: Espécie ou subespécie com garras naturais.\n\nBenefício: Suas garras naturais causam dano letal e podem ser usadas como armas naturais. Você é considerado proficiente com suas garras e pode usá-las para escalar, rasgar superfícies frágeis e atacar em combate corpo a corpo."
},
        "Subornador Especialista (Expert Briber)": {
                  "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                  "text": "Pré-requisitos: Carisma 13.\n\nBenefício: Você reduz o tempo necessário e o custo de tentativas de suborno. Ao negociar com guardas, oficiais, informantes, intermediários ou funcionários corruptíveis, consegue identificar mais rápido a oferta necessária e apresentar o suborno com menor risco de chamar atenção."
        },
        "Sucesso Confiante (Confident Success)": {
          "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
          "text": "Pré-requisitos: Carisma 13.\n\nBenefício: Quando obtém sucesso em uma verificação de perícia durante um encontro, recebe +1 de bônus de moral na próxima verificação da mesma perícia feita antes do fim do encontro. Esse bônus representa confiança crescente, ritmo favorável e domínio da situação."
},
        "Sucesso Recorrente (Recurring Success)": {
          "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
          "text": "Pré-requisitos: Treinado na perícia escolhida.\n\nBenefício: Escolha uma perícia treinada. Uma vez por encontro, quando falhar em uma verificação dessa perícia por 5 ou menos, você pode tratar a falha como sucesso com consequência reduzida, atraso, custo adicional ou resultado parcial adequado à cena."
},
        "Surto de Escudo (Shield Surge)": {
                  "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                  "text": "Pré-requisitos: Droide ou híbrido ciborgue, treinado em Mecânica.\n\nBenefício: Quando sofre dano enquanto pilota ou controla um veículo com Escudo ativo, você pode transferir parte da pressão para o escudo do veículo. Reduza o Escudo do veículo para absorver dano que seria aplicado a você, conforme os limites definidos pelo valor de escudo disponível."
        },
        "Surto de Recuperação (Recovering Surge)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Nenhum.\n\nBenefício: Quando usa seu segundo fôlego, você também sobe 1 passo na Trilha de Condição. Esse benefício representa recuperação física imediata, controle da dor e retomada de equilíbrio durante o combate."
        },
        "Surto de Vitalidade (Vitality Surge)": {
          "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
          "text": "Pré-requisitos: Constituição 13.\n\nBenefício: Quando recupera Pontos de Vida por segundo fôlego ou tratamento médico durante um encontro, recebe Pontos de Vida temporários iguais ao seu modificador de Constituição, mínimo de 1. Esses Pontos de Vida temporários duram até o fim do encontro."
},
        "Surto do Espacial (Spacer’s Surge)": {
          "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
          "text": "Pré-requisitos: Treinado em Pilotar ou Mecânica.\n\nBenefício: Quando está a bordo de uma nave, estação espacial ou veículo pressurizado, você pode usar seu segundo fôlego com eficiência em condições de gravidade instável, descompressão parcial, fumaça, alarmes ou combate confinado. Ao fazê-lo, recebe +2 de bônus em Pilotar, Mecânica ou Tolerância até o fim do seu próximo turno."
},
        "Surto Rápido (Fast Surge)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Nenhum.\n\nBenefício: Você pode usar seu segundo fôlego como ação livre no seu turno. Esse benefício permite recuperar Pontos de Vida sem gastar sua ação padrão, de movimento ou rápida daquele turno."
        },
        "Surto Veicular (Vehicular Surge)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Treinado em Pilotar.\n\nBenefício: Uma vez por dia, quando pilota um veículo, você pode conceder Pontos de Vida bônus ao veículo que está pilotando. Esses Pontos de Vida representam manobras defensivas, redistribuição de energia, controle de avarias e uso eficiente dos sistemas durante o combate."
        },
        "Talento Adaptável (Adaptable Talent)": {
                  "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                  "text": "Pré-requisitos: Nenhum.\n\nBenefício: Escolha um Talento para o qual você cumpra os pré-requisitos e que represente treinamento flexível, contatos, técnica social ou adaptação cultural. Uma vez por dia, após 5 minutos de preparação, você pode trocar o benefício escolhido por outro Talento adequado ao mesmo tipo de situação até o fim do encontro ou cena."
        },
        "Táticas de Nave (Starship Tactics)": {
                  "source": "Star Wars Saga Edition Starships of the Galaxy / Wiki-Fandom",
                  "text": "Pré-requisitos: Combate Veicular, treinado em Pilotar.\n\nBenefício: Você adiciona à sua suíte de manobras de nave estelar um número de manobras igual a 1 + seu modificador de Sabedoria, mínimo de 1. Essas manobras seguem as regras normais de manobras de nave estelar.\n\nEspecial: Você pode escolher este Talento mais de uma vez. Cada vez, adiciona novas manobras de nave estelar em quantidade igual a 1 + seu modificador de Sabedoria, mínimo de 1. Se seu modificador de Sabedoria aumentar permanentemente, você ganha manobras adicionais conforme o número de vezes que escolheu este Talento."
        },
        "Tecnologia Superior (Superior Tech)": {
                  "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                  "text": "Pré-requisitos: Inteligência 17, Especialista em Tecnologia, 9º nível.\n\nBenefício: Você pode instalar aprimoramentos superiores em equipamentos. Esses aprimoramentos excedem modificações técnicas comuns e exigem tempo, ferramentas, peças e custo compatíveis com a melhoria escolhida."
        },
        "Tiro à Queima-Roupa (Point Blank Shot)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Nenhum.\n\nBenefício: Você recebe +1 de bônus nas jogadas de ataque e +1 de bônus nas rolagens de dano com armas à distância contra alvos dentro do alcance à queima-roupa da arma.\n\nEspecial: Este Talento funciona normalmente com armas veiculares. Se você usa um míssil ou torpedo e erra a jogada de ataque, o projétil não recebe o benefício deste Talento na segunda jogada de ataque.\n\nTelêmetros e miras: Telêmetros e miras telescópicas não mudam a distância real do alvo. Se o alvo está fora do alcance à queima-roupa da arma, você não recebe o bônus deste Talento apenas por usar mira ou por negar a penalidade de alcance curto."
        },
        "Tiro Cuidadoso (Careful Shot)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                  "text": "Pré-requisitos: Tiro à Queima-Roupa, bônus base de ataque +2.\n\nBenefício: Se você mirar antes de fazer um ataque à distância, recebe +1 de bônus na jogada de ataque contra o alvo mirado. Esse bônus se soma aos benefícios normais da ação de mirar.\n\nEspecial: Um piloto pode usar este Talento, mas como precisa gastar pelo menos uma ação de movimento operando o veículo, normalmente precisa dividir a ação de mirar e o ataque entre turnos diferentes. Isso aumenta a chance de o alvo sair da linha de visão ou evitar o ataque antes do disparo."
        },
        "Tiro de Franco-Atirador (Sniper Shot)": {
                  "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Nenhum.\n\nBenefício: Quando empunha apenas armas à distância com as quais seja proficiente, você recebe +2 de bônus em todos os seus ataques à distância até o início do seu próximo turno. Até lá, você sofre –5 de penalidade na Defesa de Reflexos.\n\nEspecial: Este Talento não pode ser usado com armas veiculares nem com armas pesadas."
        },
        "Tiro de Raspão (Grazing Shot)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Tiro à Queima-Roupa.\n\nBenefício: Você pode fazer um ataque à distância que atinge dois alvos em linha direta de visão. Se o ataque acertar, cada alvo sofre metade do dano normal do ataque."
        },
        "Tiro Distante (Far Shot)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Starships of the Galaxy / Wiki-Fandom",
                  "text": "Pré-requisitos: Tiro à Queima-Roupa.\n\nBenefício: Quando usa uma arma à distância contra alvos em alcance curto, médio ou longo, a categoria de alcance é considerada uma categoria menor. Assim, você não sofre penalidade em ataques à distância contra alvos em alcance curto, sofre –2 contra alvos em alcance médio e sofre –5 contra alvos em alcance longo.\n\nNormal: Sem este Talento, um ataque à distância sofre –2 contra alvos em alcance curto, –5 contra alvos em alcance médio e –10 contra alvos em alcance longo.\n\nEfeito adicional em combate veicular: Este Talento funciona normalmente com armas veiculares. Se você usa um míssil ou torpedo e erra a jogada de ataque, o projétil não recebe o benefício deste Talento na segunda jogada de ataque."
        },
        "Tiro em Leque (Spray Shot)": {
                  "source": "Star Wars Saga Edition Scum and Villainy / Wiki-Fandom",
                  "text": "Pré-requisitos: Nenhum.\n\nBenefício: Quando usa fogo automático, você pode reduzir a área afetada para 1 quadrado. Esse uso concentra os disparos em uma área menor, facilitando atingir um alvo específico sem espalhar tiros por uma zona ampla."
        },
        "Tiro Preciso (Precise Shot)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                  "text": "Pré-requisitos: Tiro à Queima-Roupa.\n\nBenefício: Você pode disparar ou arremessar uma arma à distância contra um oponente envolvido em combate corpo a corpo com um ou mais aliados sem sofrer a penalidade padrão de –5.\n\nEspecial: Se outro veículo dispara contra uma briga aérea, sofre –5 de penalidade na jogada de ataque, salvo se o artilheiro possuir este Talento."
        },
        "Tiro Principal (Prime Shot)": {
                  "source": "Star Wars Saga Edition Rebellion Era Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Tiro à Queima-Roupa.\n\nBenefício: Se nenhum dos seus aliados estiver mais perto do alvo do que você quando fizer um ataque à distância, você recebe +1 de bônus de circunstância na jogada de ataque. O alvo precisa estar em alcance curto ou mais perto para que você receba esse bônus."
        },
        "Tiro Rápido (Rapid Shot)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Starships of the Galaxy / Wiki-Fandom",
                  "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Quando usa uma arma à distância com a qual seja proficiente, você pode disparar dois tiros como um único ataque contra um único alvo. Você sofre –2 de penalidade na jogada de ataque, mas causa +1 dado de dano se acertar.\n\nEspecial: Usar este Talento consome dois disparos e exige munição suficiente. O dano extra deste Talento não se acumula com o dano extra de Fogo de Rajada ou Olho Mortal. Se você não tiver Força 13 ou maior, a penalidade aumenta para –5 ao usar este Talento com armas que não sejam veiculares.\n\nEfeito adicional em combate veicular: Este Talento funciona normalmente com armas veiculares. Se você usa um míssil ou torpedo e erra a jogada de ataque, o projétil não recebe o benefício deste Talento na segunda jogada de ataque."
        },
        "Treinamento com Bastão (Stave Training)": {
                  "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                  "text": "Pré-requisitos: Proficiência com a arma apropriada.\n\nBenefício: Você recebe treinamento especial com bastões, cajados, armas de haste e armas semelhantes. Quando usa uma dessas armas, melhora seu controle defensivo e ofensivo, podendo aplicar manobras de bloqueio, alcance, desequilíbrio ou ataque com as duas extremidades quando a arma permitir."
        },
        "Treinamento com Implantes (Implant Training)": {
                  "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                  "text": "Pré-requisitos: Possuir implante cibernético, biotecnológico ou alienígena apropriado.\n\nBenefício: Você aprende a integrar melhor seus implantes ao corpo e ao treinamento. Recebe +2 de bônus de competência em verificações relacionadas ao uso do implante e reduz dificuldades causadas por rejeição, controle impreciso, adaptação sensorial ou resposta corporal instável."
        },
        "Treinamento da Força (Force Training)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                  "text": "Pré-requisitos: Sensibilidade à Força, treinado em Usar a Força.\n\nBenefício: Você aprende um número de poderes da Força igual a 1 + seu modificador de Sabedoria, mínimo de 1. Esses poderes formam sua suíte de poderes disponíveis.\n\nEspecial: Você pode escolher este Talento várias vezes. Cada vez que escolher, aprende novos poderes da Força."
        },
        "Treinamento de Candidatura a Oficial (Officer Candidacy Training)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Carisma 13 ou Inteligência 13.\n\nBenefício: Você recebeu preparação formal para liderança militar. Recebe +2 de bônus de competência em Conhecimento tático, Persuasão ou Iniciativa ao coordenar tropas, transmitir ordens, reconhecer hierarquia, organizar patrulhas ou avaliar uma situação de campo de batalha."
        },
        "Treinamento Echani (Echani Training)": {
                  "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Você domina fundamentos marciais Echani, baseados em leitura corporal, movimento limpo e combate corpo a corpo disciplinado. Recebe +1 de bônus em ataques corpo a corpo desarmados ou com armas leves apropriadas, e +2 em Percepção ou Iniciativa para interpretar postura e intenção de um oponente em combate próximo."
        },
        "Treinamento em Perícia (Skill Training)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                  "text": "Pré-requisitos: A perícia escolhida deve ser perícia de classe para você.\n\nBenefício: Escolha uma perícia de classe não treinada. Você se torna treinado nessa perícia.\n\nEspecial: Você pode escolher este Talento várias vezes. Cada vez, ele se aplica a uma perícia diferente."
        },
        "Treinamento Hijkata (Hijkata Training)": {
                  "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Você aprendeu técnicas Hijkata de combate direto, controle de distância e golpes pesados. Quando luta corpo a corpo contra inimigos adjacentes, recebe +1 de bônus em verificações ou ataques ligados a empurrar, derrubar, pressionar ou impedir avanço."
        },
        "Treinamento K’tara (K’tara Training)": {
                  "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Bônus base de ataque +1.\n\nBenefício: Você domina técnicas K’tara baseadas em ataques rápidos, alvos vulneráveis e transição entre defesa e ofensiva. Quando faz um ataque corpo a corpo após se mover pelo menos 2 quadrados no mesmo turno, recebe +1 de bônus na jogada de ataque ou na rolagem de dano."
        },
        "Treinamento K’thri (K’thri Training)": {
                  "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Destreza 13.\n\nBenefício: Você treinou o estilo K’thri, marcado por saltos, giros, chutes e movimentos acrobáticos. Recebe +2 de bônus de competência em Acrobacia durante combate corpo a corpo e pode usar esse treinamento para melhorar ataques desarmados, reposicionamento e evasão em espaços apertados."
        },
        "Treinamento Mandaloriano (Mandalorian Training)": {
                  "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Proficiência com armadura ou treinamento militar mandaloriano.\n\nBenefício: Você recebeu instrução marcial mandaloriana, com foco em armas, armadura, disciplina de combate e adaptação tática. Recebe +1 de bônus em ataques com armas à distância quando usa armadura, capacete ou equipamento de combate apropriado à tradição mandaloriana."
        },
        "Treinamento Militar da Aliança Galáctica (Galactic Alliance Military Training)": {
                  "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Treinamento militar ou vínculo com a Aliança Galáctica.\n\nBenefício: Você recebeu treinamento padronizado da Aliança Galáctica. Recebe +2 de bônus de competência em Iniciativa, Percepção ou Pilotar quando atua em operações militares coordenadas, defesa de posição, combate espacial ou missões conjuntas com aliados treinados."
        },
        "Treinamento Militar do Grande Exército da República (Grand Army of the Republic Training)": {
                  "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Proficiência com Armadura Leve.\n\nBenefício: Enquanto usa armadura com a qual seja proficiente, você pode aplicar o bônus de equipamento da armadura também à sua Defesa de Vontade. Esse treinamento representa disciplina clone, condicionamento militar e resistência mental sob comando."
        },
        "Treinamento Militar Imperial (Imperial Military Training)": {
                  "source": "Star Wars Saga Edition Rebellion Era Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Treinamento militar imperial ou vínculo com forças imperiais.\n\nBenefício: Você recebeu treinamento rígido das forças imperiais. Recebe +2 de bônus de competência em Percepção, Iniciativa ou ataques à distância quando mantém formação, protege uma posição, executa ordens diretas ou participa de fogo coordenado."
        },
        "Treinamento Militar Rebelde (Rebel Military Training)": {
                  "source": "Star Wars Saga Edition Rebellion Era Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Treinamento militar rebelde ou vínculo com a Aliança Rebelde.\n\nBenefício: Você aprendeu táticas de guerrilha, emboscada, improviso e retirada rápida. Recebe +2 de bônus de competência em Furtividade, Mecânica ou ataques à distância quando luta em inferioridade numérica, usa cobertura improvisada ou executa uma ação coordenada contra força superior."
        },
        "Treinamento Militar Republicano (Republic Military Training)": {
                  "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Treinamento militar republicano ou vínculo com forças da República.\n\nBenefício: Você recebeu instrução militar da República, com foco em disciplina, defesa de civis, patrulha e combate em unidade. Recebe +2 de bônus de competência em Iniciativa, Percepção ou Persuasão quando comanda, apoia ou coordena aliados em missão oficial."
        },
        "Treinamento Militar Separatista (Separatist Military Training)": {
                  "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Nenhum.\n\nBenefício: Enquanto estiver adjacente a pelo menos um aliado, você recebe +1 de bônus nas jogadas de ataque. Esse benefício representa doutrina separatista de pressão em grupo, avanço coordenado e apoio tático próximo."
        },
        "Treinamento Militar Sith (Sith Military Training)": {
                  "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Treinamento militar Sith ou vínculo com forças Sith.\n\nBenefício: Você foi treinado em disciplina brutal, obediência hierárquica e ofensiva agressiva. Recebe +2 de bônus de competência em Iniciativa, Persuasão para intimidar ou ataques corpo a corpo quando avança contra inimigos enfraquecidos, cercados ou afetados por medo."
        },
        "Treinamento Tae-Jitsu (Tae‑Jitsu Training)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Esquiva, Artes Marciais I, treinado em Iniciativa.\n\nBenefício: Quando obtém um acerto crítico com um ataque desarmado, o dano do ataque aumenta em um passo de dado, até o máximo de d12. Uma vez por encontro, quando acerta um ataque desarmado contra um inimigo, pode gastar uma ação rápida para designar esse inimigo como seu adversário principal. Até o fim do encontro, você recebe o benefício de Esquiva contra esse inimigo e contra outro inimigo à sua escolha.\n\nEspecial: Se tiver a Aptidão Especialização em Tae-Jitsu, quando obtém um acerto crítico contra um inimigo designado como adversário principal, esse inimigo sofre –2 de penalidade nas jogadas de ataque até o fim do seu próximo turno."
        },
        "Treinamento Teräs Käsi (Teräs Käsi Training)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Força 13, Artes Marciais I.\n\nBenefício: Você recebeu treinamento em Teräs Käsi, uma arte marcial voltada a golpes diretos e pressão corporal extrema. Quando acerta um ataque desarmado, trata o limiar de dano do alvo como menor para determinar se o dano move o alvo na Trilha de Condição."
        },
        "Treinamento Wrruushi (Wrruushi Training)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                  "text": "Pré-requisitos: Constituição 13, Artes Marciais I, Wookiee.\n\nBenefício: Você aprendeu Wrruushi, estilo marcial Wookiee baseado em força, resistência e golpes esmagadores. Quando acerta ataques desarmados, pode receber Pontos de Vida bônus ligados ao impacto do golpe. Seu treinamento também permite negar parte do bônus de equipamento do alvo em situações apropriadas de combate corpo a corpo."
        },
        "Trespassar (Cleave)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                  "text": "Pré-requisitos: Força 13, Ataque Poderoso.\n\nBenefício: Uma vez por rodada, quando você reduz um inimigo a 0 Pontos de Vida com um ataque corpo a corpo, pode fazer imediatamente um ataque corpo a corpo adicional contra outro inimigo ao seu alcance. O ataque adicional usa o mesmo bônus de ataque da jogada que derrubou o primeiro alvo."
        },
        "Trespassar Assustador (Frightening Cleave)": {
                  "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                  "text": "Pré-requisitos: Força 13, Trespassar, Ataque Poderoso, bônus base de ataque +4.\n\nBenefício: Quando usa Trespassar, cada inimigo a até 6 quadrados que tenha linha de visão até você sofre penalidade na Defesa de Reflexos, em verificações de perícia e em jogadas de ataque contra você até o início do seu próximo turno."
        },
        "Trespassar Maior (Great Cleave)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                  "text": "Pré-requisitos: Força 13, Ataque Poderoso, Trespassar, bônus base de ataque +4.\n\nBenefício: Você pode usar Trespassar mais de uma vez por rodada. Sempre que reduzir um inimigo a 0 Pontos de Vida com um ataque corpo a corpo, pode fazer outro ataque corpo a corpo contra um inimigo diferente ao seu alcance. Você não pode atacar o mesmo inimigo mais de uma vez por sequência de Trespassar Maior."
        },
        "Truque com Faca (Knife Trick)": {
                  "source": "Star Wars Saga Edition Scum and Villainy / Wiki-Fandom",
                  "text": "Pré-requisitos: Saque Relâmpago, Saque Rápido, treinado em Furtividade.\n\nBenefício: Você pode usar uma arma escondida para fazer um ataque de oportunidade com maior eficiência. Quando faz um ataque de oportunidade com uma faca, lâmina curta ou arma pequena escondida, o ataque recebe benefício adicional por surpresa, saque rápido e uso de uma arma que o inimigo não percebeu a tempo."
        },
        "Truque de Combate (Combat Trickery)": {
                  "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                  "text": "Pré-requisitos: Treinado em Enganação.\n\nBenefício: Você pode gastar duas ações rápidas na mesma rodada para fazer uma verificação de Enganação contra a Defesa de Vontade de um inimigo. Se tiver sucesso, o alvo fica desprevenido contra o seu próximo ataque feito antes do fim do seu turno."
        },
        "Truque Oportunista (Opportunistic Trickery)": {
                  "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                  "text": "Pré-requisitos: Reflexos de Combate, Ataque Furtivo.\n\nBenefício: Quando poderia fazer um ataque de oportunidade contra um inimigo, você pode abrir mão desse ataque para reduzir a Defesa de Reflexos do alvo em 2 até o início do seu próximo turno."
        },
        "Truque Oportunista Aprimorado (Improved Opportunistic Trickery)": {
                  "source": "Star Wars Saga Edition Galaxy of Intrigue / Wiki-Fandom",
                  "text": "Pré-requisitos: Reflexos de Combate, Truque Oportunista.\n\nBenefício: Quando poderia fazer um ataque de oportunidade contra um inimigo, você pode abrir mão desse ataque para reduzir a Defesa de Reflexos do alvo em 5 até o início do seu próximo turno."
        },
        "Vantagem Tática (Tactical Advantage)": {
                  "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",

    function openLibrary() {
        document.getElementById('libraryModal').classList.add('active');
        showLibraryCategory('forcePowers');
    }

    function closeLibrary() {
        document.getElementById('libraryModal').classList.remove('active');
    }

    function clearElement(el) {
        while (el.firstChild) el.removeChild(el.firstChild);
    }

    function showLibraryCategory(categoryKey) {
        const tabs = document.getElementById('libraryTabs');
        const list = document.getElementById('libraryList');
        const details = document.getElementById('libraryDetails');
        clearElement(tabs);
        clearElement(list);
        clearElement(details);
        const initial = document.createElement('p');
        initial.textContent = 'Selecione uma opção da lista para ver os detalhes.';
        details.appendChild(initial);

        Object.entries(LIBRARY_DATA).forEach(([key, category]) => {
            const btn = document.createElement('button');
            btn.className = 'class-btn' + (key === categoryKey ? ' active' : '');
            btn.textContent = category.label;
            btn.onclick = () => showLibraryCategory(key);
            tabs.appendChild(btn);
        });

        const category = LIBRARY_DATA[categoryKey];
        if (!category) return;

        const search = document.createElement('input');
        search.className = 'library-search';
        search.type = 'search';
        search.placeholder = 'Pesquisar nesta lista...';
        list.appendChild(search);

        const results = document.createElement('div');
        results.className = 'library-list-results';
        list.appendChild(results);

        const normalize = value => String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        if (category.trees) {
            const renderTreeButtons = () => {
                clearElement(results);
                const query = normalize(search.value);
                category.trees.forEach((tree, index) => {
                    const treeItems = tree.items || [];
                    const searchable = normalize([tree.name, ...treeItems].join(' '));
                    if (query && !searchable.includes(query)) return;
                    const btn = document.createElement('button');
                    btn.className = 'library-item-btn';
                    btn.textContent = tree.name;
                    btn.onclick = () => showLibraryTree(categoryKey, index);
                    results.appendChild(btn);
                });
                if (!results.children.length) {
                    const empty = document.createElement('p');
                    empty.textContent = 'Nenhum resultado encontrado.';
                    results.appendChild(empty);
                }
            };
            search.oninput = renderTreeButtons;
            renderTreeButtons();
            if (category.trees.length) showLibraryTree(categoryKey, 0);
            return;
        }

        const renderItemButtons = () => {
            clearElement(results);
            const query = normalize(search.value);
            (category.items || []).forEach(item => {
                if (query && !normalize(item).includes(query)) return;
                const btn = document.createElement('button');
                btn.className = 'library-item-btn';
                btn.textContent = item;
                btn.onclick = () => showLibraryItem(category.label, item, '', categoryKey);
                results.appendChild(btn);
            });
            if (!results.children.length) {
                const empty = document.createElement('p');
                empty.textContent = 'Nenhum resultado encontrado.';
                results.appendChild(empty);
            }
        };
        search.oninput = renderItemButtons;
        renderItemButtons();
    }

    function showLibraryTree(categoryKey, treeIndex) {
        const category = LIBRARY_DATA[categoryKey];
        const tree = category.trees[treeIndex];
        const details = document.getElementById('libraryDetails');
        clearElement(details);
        document.querySelectorAll('#libraryList .library-item-btn').forEach((btn, index) => {
            btn.classList.toggle('active', index === treeIndex);
        });
        const title = document.createElement('h3');
        title.className = 'library-tree-title';
        title.textContent = tree.name;
        details.appendChild(title);
        const box = document.createElement('div');
        box.className = 'library-list';
        (tree.items || []).forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'library-item-btn';
            btn.textContent = item;
            btn.onclick = () => showLibraryItem(category.label, item, tree.name, categoryKey);
            box.appendChild(btn);
        });
        details.appendChild(box);
    }

    function escapeLibraryText(value) {
        return String(value || '').replace(/[&<>]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[char]));
    }

    function getLibraryCopyText(categoryLabel, itemName, treeName, detail) {
        const parts = [itemName, 'Categoria: ' + categoryLabel];
        if (treeName) parts.push('Árvore: ' + treeName);
        if (detail && detail.source) parts.push('Fonte: ' + detail.source);
        parts.push('');
        parts.push((detail && detail.text) || 'Conteúdo ainda não preenchido.');
        return parts.join(String.fromCharCode(10));
    }

    function copyLibraryItem(categoryLabel, itemName, treeName) {
        const detail = LIBRARY_ITEM_DETAILS[itemName];
        const text = getLibraryCopyText(categoryLabel, itemName, treeName, detail);
        navigator.clipboard.writeText(text).catch(() => {});
    }

    function addLibraryItemToActiveSheet(categoryKey, itemName) {
        const fieldMap = { forcePowers: 'forcePowers', forceTechniques: 'forceTechniques', talents: 'talents', aptitudes: 'aptitudes' };
        const field = fieldMap[categoryKey];
        const sheet = sheets.find(s => s.id === activeSheetId);
        if (!field || !sheet) return;
        if (!Array.isArray(sheet[field])) sheet[field] = [];
        if (!sheet[field].includes(itemName)) sheet[field].push(itemName);
        renderSheets();
        saveToLocalStorage();
    }

    function showLibraryItem(categoryLabel, itemName, treeName, categoryKey = '') {
        const details = document.getElementById('libraryDetails');
        const detail = LIBRARY_ITEM_DETAILS[itemName];
        clearElement(details);
        const title = document.createElement('h3');
        title.className = 'library-tree-title';
        title.textContent = itemName;
        details.appendChild(title);
        const cat = document.createElement('p');
        cat.textContent = 'Categoria: ' + categoryLabel;
        details.appendChild(cat);
        if (treeName) {
            const tree = document.createElement('p');
            tree.textContent = 'Árvore: ' + treeName;
            details.appendChild(tree);
        }
        const body = document.createElement('p');
        body.textContent = (detail && detail.text) || 'Conteúdo ainda não preenchido.';
        details.appendChild(body);
        if (['forcePowers', 'forceTechniques', 'talents', 'aptitudes'].includes(categoryKey)) {
            const add = document.createElement('button');
            add.className = 'btn-action btn-reference';
            add.textContent = '➕ Adicionar à ficha ativa';
            add.onclick = () => addLibraryItemToActiveSheet(categoryKey, itemName);
            details.appendChild(add);
        }
        const copy = document.createElement('button');
        copy.className = 'btn-action btn-reference';
        copy.textContent = '📋 Copiar texto';
        copy.onclick = () => copyLibraryItem(categoryLabel, itemName, treeName);
        details.appendChild(copy);
    }

    // Inicializar
    // Dados carregados pelo Firebase via onSnapshot
    renderSheets();
</script>
