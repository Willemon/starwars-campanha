                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Force_Slam",
                "text": "Efeito: Ao usar Impacto da Força, você pode aumentar o tempo de ativação para uma ação de rodada completa. Dessa forma, o poder afeta todos os alvos em um raio de 2 quadrados, com origem no seu quadrado.\n\nPonto de Força: Você pode gastar 1 Ponto de Força para ampliar a área para uma explosão de raio de 4 quadrados, também com origem no seu quadrado."
        },
        "Atordoamento da Força Aprimorado (Improved Force Stun)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Force_Stun",
                "text": "Efeito: Quando Atordoamento da Força for bem-sucedido, o alvo também fica temporariamente imobilizado por 1 rodada."
        },
        "Ionizar Aprimorado (Improved Ionize)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Ionize",
                "text": "Efeito: Ao usar Ionizar, você pode gastar 1 Ponto de Força para que o alvo sofra o dano iônico integral.\n\nNormal: O dano iônico é reduzido à metade depois de ser comparado ao limiar de dano do alvo."
        },
        "Combate Cinético Aprimorado (Improved Kinetic Combat)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Kinetic_Combat",
                "text": "Efeito: Combate Cinético permite empunhar até três armas simultaneamente. Mover e atacar com uma dessas armas continua exigindo uma ação padrão."
        },
        "Resistir à Força Aprimorado (Improved Resist Force)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Resist_Force",
                "text": "Efeito: Ao ativar Resistir à Força, você pode escolher que o poder afete um aliado a até 6 quadrados de você, em seu lugar."
        },
        "Valor Aprimorado (Improved Valor)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Valor",
                "text": "Efeito: Ao ativar Valor, você também recebe os benefícios desse poder da Força."
        },
        "Transferência Vital Aprimorada (Improved Vital Transfer)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Vital_Transfer",
                "text": "Efeito: Transferência Vital pode ser usada em um alvo a até 6 quadrados de você, desde que ele esteja dentro da sua linha de visão."
        },
        "Absorção de Idioma (Language Absorption)": {
                "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Language_Absorption",
                "text": "Efeito: Você pode usar telepatia para aprender um idioma à força a partir de outra criatura. Se ela não estiver disposta, faça um teste de Usar a Força contra a Defesa de Vontade dela, conforme a aplicação Telepatia dessa perícia. Se for bem-sucedido, você conserva a capacidade de falar e compreender o idioma por 24 horas."
        },
        "Golpe de Batalha Aprimorado (Improved Battle Strike)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Battle_Strike",
                "text": "Efeito: Ao usar Golpe de Batalha, você pode aplicar os bônus nas jogadas de ataque e nas rolagens de dano a todos os ataques realizados durante uma ação de ataque total."
        },
        "Fúria Sombria Aprimorada (Improved Dark Rage)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Dark_Rage",
                "text": "Efeito: Ao usar Fúria Sombria, você ignora a restrição que impede o uso de perícias e a realização de tarefas que exijam paciência e concentração. Você também pode ativar Fúria Sombria na rodada de surpresa, inclusive quando estiver surpreendido."
        },
        "Desarmar com a Força Aprimorado (Improved Force Disarm)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Force_Disarm",
                "text": "Efeito: Ao usar Desarmar com a Força, você pode aumentar a ativação para uma ação de rodada completa. Se fizer isso, o oponente deixa de receber o bônus normal de +10 na Defesa de Reflexos associado ao desarme."
        },
        "Empurrão da Força Aprimorado (Improved Force Thrust)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Force_Thrust",
                "text": "Efeito: Ao usar Empurrão da Força, você pode aumentar a ativação para uma ação de rodada completa e gastar 1 Ponto de Força para afetar todas as criaturas em um cone de 6 quadrados, com origem no seu quadrado."
        },
        "Aperto da Força Aprimorado (Improved Force Grip)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Force_Grip",
                "text": "Efeito: Ao usar Aperto da Força, você pode gastar 1 Ponto de Força como ação livre para manter o poder por 1 rodada adicional sem concentração. Ao terminar essa rodada adicional, você não pode retomar a concentração para continuar mantendo esse uso do poder."
        },
        "Relâmpago da Força Aprimorado (Improved Force Lightning)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Force_Lightning",
                "text": "Efeito: Ao usar Relâmpago da Força, você pode aumentar a ativação para uma ação de rodada completa. Nesse caso, o alvo faz um teste de Força. Se seu teste de Usar a Força superar o resultado dele, empurre-o 1 quadrado, mais 1 quadrado adicional para cada 5 pontos pelos quais seu resultado superar o teste dele. Se o empurrão lançar o alvo contra um objeto maior que ele, o alvo sofre 1d6 pontos de dano.\n\nTeste de resistência ao empurrão: O alvo soma seu bônus base de ataque e o modificador de tamanho ao teste de Força. Os modificadores são: Colossal +20; Imenso +15; Enorme +10; Grande +5; Médio +0; Pequeno −5; Minúsculo −10; Diminuto −15; Ínfimo −20. Criaturas com mais de duas pernas, ou excepcionalmente estáveis por outro motivo, recebem também +5 de bônus de estabilidade."
        },
        "Truque Mental Aprimorado (Improved Mind Trick)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Mind_Trick",
                "text": "Efeito: Ao usar Truque Mental, você pode aumentar a ativação para uma ação de rodada completa para afetar todas as criaturas em um cone de 6 quadrados, com origem no seu quadrado.\n\nPonto de Força: Você pode gastar 1 Ponto de Força para ampliar esse cone para 12 quadrados, mantendo a origem no seu quadrado."
        },
        "Repreensão Aprimorada (Improved Rebuke)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Rebuke",
                "text": "Efeito: Quando um aliado a até 12 quadrados de você e dentro da sua linha de visão for alvo de um poder da Força, você pode usar Repreensão como se você fosse o alvo desse poder."
        },
        "Repulsão Aprimorada (Improved Repulse)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Repulse",
                "text": "Efeito: Ao usar Repulsão, você pode aumentar a ativação para uma ação de rodada completa para afetar todas as criaturas em uma explosão de raio de 2 quadrados, com origem no seu quadrado.\n\nPonto de Força: Você pode gastar 1 Ponto de Força para ampliar a explosão para um raio de 4 quadrados, mantendo a origem no seu quadrado."
        },
        "Transferência Vital Avançada (Advanced Vital Transfer)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Advanced_Vital_Transfer",
                "text": "Efeito: Ao usar Transferência Vital, você pode gastar 1 Ponto de Destino para curar todo o dano do alvo e remover todas as condições debilitantes dele."
        },
        "Manto Aprimorado (Improved Cloak)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Cloak",
                "text": "Efeito: Manter o poder Manto passa a exigir uma ação de movimento, em lugar de uma ação padrão."
        },
        "Levitação Aprimorada (Improved Levitate)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Levitate",
                "text": "Efeito: Se for movido involuntariamente para um fosso ou para fora de uma superfície elevada, por exemplo por Empurrão da Força ou Investida Bantha, você pode gastar 1 Ponto de Força para ativar Levitação como reação. Ao fazer isso, seu movimento forçado termina no último quadrado antes da borda do precipício."
        },
        "Malacia Aprimorada (Improved Malacia)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Malacia",
                "text": "Efeito: Você pode manter a penalidade ao limiar de dano causada por Malacia com uma ação rápida, em lugar de uma ação padrão."
        },
        "Fase Aprimorada (Improved Phase)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Phase",
                "text": "Efeito: Ao usar Fase, você pode encerrar uma ação de movimento individual dentro de um quadrado ocupado. Você ainda precisa terminar seu turno em um quadrado desocupado no qual possa permanecer legalmente."
        },
        "Rasgar Aprimorado (Improved Rend)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Rend",
                "text": "Efeito: O alcance de Rasgar aumenta para 12 quadrados. Ao usar esse poder em uma criatura ou objeto, você pode ignorar a Redução de Dano desse alvo."
        },
        "Ponto de Ruptura Aprimorado (Improved Shatterpoint)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Shatterpoint",
                "text": "Efeito: Quando um ataque beneficiado por Ponto de Ruptura fizer um alvo descer na Trilha de Condição, você pode gastar 1 Ponto de Força para tornar a condição dele persistente. Essa condição persistente só pode ser removida por cirurgia, no caso de seres vivos, ou por reparos, no caso de droides, objetos e veículos."
        },
        "Tecnometria Aprimorada (Improved Technometry)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Technometry",
                "text": "Efeito: Ao usar Tecnometria, você pode aumentar a ativação para uma ação de rodada completa e afetar todos os droides em um cone de 6 quadrados, com origem no seu quadrado."
        },
        "Desintoxicar Veneno (Detoxify Poison)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Detoxify_Poison",
                "text": "Efeito: Você pode usar Transferência Vital para tratar um veneno que esteja afetando o alvo. Substitua os efeitos normais do poder pela comparação do resultado do seu teste de Usar a Força com a CD do veneno. Se igualar ou superar essa CD, você desintoxica o veneno conforme a aplicação correspondente da perícia Tratar Ferimentos."
        },
        "Balistacinese Aprimorada (Improved Ballistakinesis)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Ballistakinesis",
                "text": "Efeito: Ao usar Balistacinese, você pode gastar 1 Ponto de Força para afetar uma área de 3 × 3 quadrados, em lugar da área de 2 × 2 quadrados."
        },
        "Transferência Sombria Aprimorada (Improved Dark Transfer)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Dark_Transfer",
                "text": "Efeito: Ao usar Transferência Sombria, você pode gastar 1 Ponto de Força para revivificar uma criatura que tenha morrido desde o fim do seu último turno. Faça um teste de Usar a Força com CD 25. Se for bem-sucedido, o alvo fica inconsciente em vez de morto, e esse uso de Transferência Sombria não recupera Pontos de Vida dele."
        },
        "Detonar Aprimorado (Improved Detonate)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Detonate",
                "text": "Efeito: Ao usar Detonar, você também causa dano aos inimigos próximos do objeto escolhido como alvo. Compare o resultado do teste de Usar a Força com a Defesa de Reflexos de cada inimigo a até 2 quadrados do objeto. Cada inimigo cuja defesa seja igualada ou superada sofre dano cortante igual à metade do dano sofrido pelo objeto. Esse efeito é um ataque de área."
        },
        "Iluminar Aprimorado (Improved Enlighten)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Enlighten",
                "text": "Efeito: Ao usar Iluminar, você pode gastar 1 Ponto de Força para afetar um aliado adicional."
        },
        "Explosão de Relâmpagos Aprimorada (Improved Lightning Burst)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Lightning_Burst",
                "text": "Efeito: Ao usar Explosão de Relâmpagos, compare também o resultado do seu teste de Usar a Força com a Defesa de Fortitude de cada alvo. Se o resultado igualar ou superar tanto a Defesa de Reflexos quanto a de Fortitude de um alvo, empurre-o 1 quadrado para longe de você e derrube-o, deixando-o prostrado. Esse movimento não provoca ataques de oportunidade."
        },
        "Obscurecer Aprimorado (Improved Obscure)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Obscure",
                "text": "Efeito: Ao usar Obscurecer, você pode gastar 1 Ponto de Força para receber +5 de bônus da Força no teste de Usar a Força."
        },
        "Escudo da Força Aprimorado (Improved Force Shield)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Force_Shield",
                "text": "Efeito: Ao usar Escudo da Força, você pode gastar 1 Ponto de Força para expandir a proteção, de modo que ela cubra você e todos os aliados adjacentes.\n\nPonto de Destino: Como alternativa, você pode gastar 1 Ponto de Destino para proteger um veículo que esteja ocupando, independentemente do tamanho dele. Se o veículo já possuir um valor de escudo, esse valor e o concedido pelo poder não se acumulam."
        },
        "Desequilibrar Aprimorado (Improved Stagger)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Stagger",
                "text": "Efeito: Ao usar Desequilibrar, você pode gastar 1 Ponto de Força para empurrar o alvo 2 quadrados para longe de você, em lugar de 1 quadrado."
        },
        "Curar Doença (Cure Disease)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Cure_Disease",
                "text": "Efeito: Ao usar Transferência Vital, se seu teste de Usar a Força igualar ou superar a CD de Tratar Ferimentos de uma doença que esteja afetando o alvo, você pode gastar 1 Ponto de Força para curar essa doença."
        },
        "Cegar Estendido (Extended Blind)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Extended_Blind",
                "text": "Efeito: O alcance básico de Cegar aumenta de 12 para 18 quadrados."
        },
        "Desarmar com a Força Estendido (Extended Force Disarm)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Extended_Force_Disarm",
                "text": "Efeito: O alcance básico de Desarmar com a Força aumenta de 12 para 18 quadrados."
        },
        "Aperto da Força Estendido (Extended Force Grip)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Extended_Force_Grip",
                "text": "Efeito: O alcance básico de Aperto da Força aumenta de 12 para 18 quadrados."
        },
        "Empurrão da Força Estendido (Extended Force Thrust)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Extended_Force_Thrust",
                "text": "Efeito: O alcance básico de Empurrão da Força aumenta de 12 para 18 quadrados."
        },
        "Mover Objeto Estendido (Extended Move Object)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Extended_Move_Object",
                "text": "Efeito: O alcance básico de Mover Objeto aumenta de 12 para 18 quadrados."
        },
        "Convecção Aprimorada (Improved Convection)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Convection",
                "text": "Efeito: Quando um alvo sofre dano de fogo de Convecção, o fogo usa seu bônus base de ataque na jogada contra a Defesa de Fortitude do alvo, em lugar do bônus normal de +5."
        },
        "Crucitorn Aprimorado (Improved Crucitorn)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Crucitorn",
                "text": "Efeito: Se você usar Crucitorn e o ataque ou poder da Força ainda causar dano superior ao seu limiar de dano, esse uso de Crucitorn não é consumido. O poder permanece na sua suíte de poderes da Força."
        },
        "Criocinese Aprimorada (Improved Cryokinesis)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Cryokinesis",
                "text": "Efeito: Você pode usar Criocinese em veículos ocupados que estejam dentro do alcance. O veículo só desce na Trilha de Condição se o resultado do seu teste de Usar a Força também superar a Defesa de Fortitude dele."
        },
        "Dobrar Espaço Aprimorado (Improved Fold Space)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Fold_Space",
                "text": "Efeito: Ao usar Dobrar Espaço, você pode gastar 1 Ponto de Força para mover o objeto para qualquer lugar dentro da sua linha de visão.\n\nPonto de Destino: Como alternativa, você pode gastar 1 Ponto de Destino para mover o objeto para qualquer lugar dentro do mesmo sistema estelar."
        },
        "Luz da Força Aprimorada (Improved Force Light)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Force_Light",
                "text": "Efeito: Você pode gastar 1 Ponto de Força para que Luz da Força cegue as criaturas às quais causar dano. Cada criatura que sofrer dano do poder concede ocultação a todos os demais alvos até o fim do próximo turno dela.\n\nPonto de Destino: Você pode gastar 1 Ponto de Destino para que a ocultação concedida seja total."
        },
        "Tempestade da Força Aprimorada (Improved Force Storm)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Force_Storm",
                "text": "Efeito: Ao ativar Tempestade da Força, você pode gastar 1 Ponto de Força para preencher a tempestade com relâmpagos da Força. Na ativação, e novamente cada vez que gastar uma ação padrão para manter o poder, compare o resultado do seu teste de Usar a Força com a Defesa de Reflexos de um alvo dentro da área da tempestade. Se o resultado igualar ou superar essa defesa, esse alvo sofre 3d6 pontos de dano da Força.\n\nPonto de Destino: Você pode gastar 1 Ponto de Destino para aumentar esse dano para 6d6."
        },
        "Surto Vegetal Aprimorado (Improved Plant Surge)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Plant_Surge",
                "text": "Efeito: Você pode gastar 1 Ponto de Força para que Surto Vegetal afete todos os inimigos em uma área de 5 × 5 quadrados. Pelo menos um quadrado da área precisa estar dentro do alcance do poder.\n\nPonto de Destino: Como alternativa, você pode gastar 1 Ponto de Destino para afetar todos os inimigos em uma área de 10 × 10 quadrados."
        },
        "Bomba Mental Aprimorada (Improved Thought Bomb)": {
                "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                "sourceUrl": "https://swse.fandom.com/wiki/Improved_Thought_Bomb",
                "text": "Efeito: Você pode gastar 1 Ponto de Força para que Bomba Mental afete todos os inimigos a até 5 quadrados de você.\n\nPonto de Destino: Como alternativa, você pode gastar 1 Ponto de Destino para afetar todos os inimigos dentro da sua linha de visão."
        }
,

        "À Beira da Morte (Brink of Death)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Quando você causa dano suficiente com um ataque para matar um alvo, pode escolher reduzir esse alvo a 0 pontos de vida, deixando-o inconsciente e vivo. As regras normais para estar com 0 pontos de vida se aplicam."
        },
        "Abaixar e Cobrir (Duck and Cover)": {
                "source": "Star Wars Saga Edition Scum and Villainy / Wiki-Fandom",
                "text": "Pré-requisito: Treinado em Furtividade.\n\nBenefício: Sempre que você for alvo de um ataque de área que erre você, uma vez por turno pode se mover 2 quadrados como reação. Esse movimento não provoca ataques de oportunidade."
        },
        "Acerto Fatal (Fatal Hit)": {
                  "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisitos: Força 13, Destreza 13.\n\nBenefício: Quando seu ataque reduz um alvo a 0 Pontos de Vida, você pode escolher matar esse alvo automaticamente mesmo que o dano causado não iguale nem supere o limiar de dano dele. Além disso, você pode realizar um golpe de misericórdia como ação padrão.\n\nNormal: Uma criatura reduzida a 0 Pontos de Vida fica inconsciente se o dano causado não igualar nem superar seu limiar de dano. Realizar um golpe de misericórdia normalmente exige uma ação de rodada completa."
        },
        "Acuidade com Arma (Weapon Finesse)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisito: Bônus base de ataque +1.\n\nBenefício: Ao usar uma arma corpo a corpo leve ou um sabre de luz, você pode usar seu modificador de Destreza no lugar do modificador de Força nas jogadas de ataque.\n\nEfeito combinado: Se estiver empunhando uma única arma de uma mão para a qual possua Foco em Arma, você pode tratar essa arma como arma leve para fins deste Talento."
        },
        "Afinidade (Rapport)": {
                "source": "Star Wars Saga Edition The Force Unleashed Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Sabedoria 13.\n\nBenefício: Quando você usa a ação ajudar outro, concede +2 de bônus de intuição adicional em testes de perícia e jogadas de ataque ao personagem que está auxiliando. Esse bônus adicional não se acumula com o bônus concedido pela aptidão Coordenar do nobre."
        },
        "Agarrão Múltiplo (Multi‑Grab)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: Destreza 13.\n\nBenefício: Como ação padrão, você pode fazer um ataque de agarrar contra dois alvos adjacentes a você. Faça uma jogada de ataque separada contra cada alvo. Você precisa ter duas mãos livres para usar este talento."
        },
        "Agilidade Aumentada (Increased Agility)": {
                  "source": "Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisito: Condicionamento.\n\nBenefício: Sua velocidade de escalada aumenta em 2 quadrados, sua velocidade de natação aumenta em 2 quadrados e a distância que você consegue saltar aumenta em 2 quadrados. Além disso, você não perde seu bônus de Destreza na Defesa de Reflexos enquanto estiver escalando."
        },
        "Alcance Zero (Zero Range)": {
                  "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                  "text": "Pré-requisito: Tiro à Queima-Roupa.\n\nBenefício: Ao disparar uma arma à distância contra um alvo dentro do seu espaço de luta ou adjacente a ele, você recebe +1 na jogada de ataque e causa +1 dado de dano se acertar.\n\nEspecial: O dano adicional deste Talento não se acumula com o dano extra concedido por Fogo de Rajada ou Tiro Rápido. Este Talento não se aplica a armas pesadas, armas veiculares ou combate veicular."
        },
        "Algumas Manobras (A Few Maneuvers)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Threats of the Galaxy / Wiki-Fandom',
            text: `Pré-requisitos: Esquiva, Combate Veicular.

Benefício: Enquanto pilota um veículo de tamanho Colossal ou menor, você concede +2 de bônus de Esquiva à Defesa de Reflexos do veículo. Além disso, se você for alvo de um ataque de míssil ou torpedo e a jogada de ataque errar por 5 ou mais, o projétil se autodestrói sem causar dano.`
        },
        "Aliado Acrobático (Acrobatic Ally)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisitos: Destreza 13, Força 13, treinado em Acrobacia.\n\nBenefício: Você pode erguer ou arremessar um aliado do seu tamanho ou menor até 2 quadrados. Você e o aliado devem agir no mesmo valor de iniciativa e começar em quadrados adjacentes. Com uma ação padrão, faça um teste de Acrobacia CD 20; se tiver sucesso, o aliado termina em um quadrado à sua escolha até 2 quadrados acima ou distante de você. Isso conta como ação livre para o aliado e encerra seu turno. Se falhar, você e o aliado ficam prostrados no seu quadrado; seu turno termina, e o aliado pode agir normalmente.\n\nEspecial: Este talento pode provocar ataques de oportunidade contra qualquer um dos dois personagens."
        },
        "Alvo em Movimento (Moving Target)": {
                "source": "Star Wars Saga Edition Rebellion Era Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Esquiva.\n\nBenefício: Se você terminar seu turno a pelo menos 3 quadrados de distância do quadrado onde começou, recebe +1 de bônus de esquiva na Defesa de Reflexos até o início do seu próximo turno."
        },
        "Alvo Errático (Erratic Target)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: droide equipado com locomoção de voo ou flutuação, Destreza 13, Esquiva.\n\nBenefício: No seu turno, você pode reduzir sua velocidade em até 2 quadrados. Para cada quadrado de velocidade que reduzir dessa forma, aumente em +1 o bônus de esquiva que recebe na Defesa de Reflexos."
        },
        "Amigos em Lugares Baixos (Friends in Low Places)": {
                  "source": "Star Wars Saga Edition Scum and Villainy / Wiki-Fandom",
                  "text": "Pré-requisito: Treinado em Obter Informação.\n\nBenefício: Você pode usar Obter Informação para adquirir licenças e localizar itens restritos por canais informais. Ao procurar itens restritos no mercado negro, reduza em 1 o multiplicador de custo aplicado a esses itens."
        },
        "Aproximação Desimpedida (Unhindered Approach)": {
                "source": "Star Wars Saga Edition Galaxy at War / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: Treinado em Saltar.\n\nBenefício: Você recebe +3 de bônus de competência em testes de Saltar. No momento em que fizer o teste, para cada aliado a até 12 quadrados que também possua este talento, o bônus de competência aumenta em +1, até o máximo de +7. Além disso, quando usa a perícia Saltar, adicione 1 quadrado à distância total do salto."
        },
        "Área Direcionada (Targeted Area)": {
                "source": "Star Wars Saga Edition Unknown Regions / Wiki-Fandom",
                "text": "Pré-requisito: Bônus base de ataque +5.\n\nBenefício: Quando você faz um ataque de área bem-sucedido com uma arma com a qual é proficiente, escolha um alvo atingido pelo ataque. Esse alvo sofre 5 pontos de dano adicionais antes de aplicar o efeito da aptidão Evasão."
        },
        "Arremessar (Throw)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisitos: Derrubar, bônus base de ataque +1.\n\nBenefício: Se você derrubar um oponente com sucesso usando um ataque de agarrar, o oponente cai prostrado em qualquer espaço desocupado à sua escolha até 1 quadrado além do seu alcance e sofre dano contundente igual ao dano do seu ataque desarmado. Um oponente arremessado deixa de estar agarrado."
        },
        "Arremesso Angulado (Angled Throw)": {
                "source": "Star Wars Saga Edition The Force Unleashed Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Destreza 13.\n\nBenefício: Ao arremessar uma granada ou arma semelhante a granada, você pode tentar fazê-la ricochetear em uma parede ou outra superfície próxima ao alvo. Se sua jogada de ataque exceder Defesa de Reflexos 15, você ignora cobertura e cobertura aprimorada com esse ataque, exceto cobertura total."
        },
        "Arremesso Poderoso (Mighty Throw)": {
                "source": "Star Wars Saga Edition The Force Unleashed Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Força 13.\n\nBenefício: Ao fazer ataques à distância com armas arremessadas, incluindo granadas e armas semelhantes a granadas, você adiciona seu bônus de Força ao bônus de ataque, além do bônus de Destreza. Além disso, aumenta o comprimento de cada categoria de alcance da arma em um número de quadrados igual ao seu modificador de Força."
        },
        "Artes Marciais (I, II e III) (Martial Arts (I, II, and III))": {
                  "source": "Star Wars Saga Edition Core Rulebook / Saga Edition FAQ / Wiki-Fandom",
                  "text": "Artes Marciais I — Pré-requisito: nenhum. Benefício: o dano dos seus ataques desarmados aumenta em um passo de dado, você recebe +1 de bônus de esquiva na Defesa de Reflexos e seus ataques desarmados não provocam ataques de oportunidade.\n\nArtes Marciais II — Pré-requisitos: Artes Marciais I, bônus base de ataque +3. Benefício: o dano dos seus ataques desarmados aumenta em mais um passo de dado, e o bônus de esquiva na Defesa de Reflexos concedido por Artes Marciais aumenta para +2.\n\nArtes Marciais III — Pré-requisitos: Artes Marciais II, bônus base de ataque +6. Benefício: o dano dos seus ataques desarmados aumenta em mais um passo de dado, e o bônus de esquiva na Defesa de Reflexos concedido por Artes Marciais aumenta para +3.\n\nNormal: O dano desarmado normal depende do tamanho da criatura: Pequeno 1d3, Médio 1d4 e Grande 1d6. Sem Artes Marciais I, ataques desarmados provocam ataques de oportunidade.\n\nEspecial: Se uma situação faz você perder o bônus de Destreza na Defesa de Reflexos, você também perde bônus de esquiva. Bônus de esquiva se acumulam entre si. Artes Marciais também aumenta o dado de dano de armas naturais, como garras e mordidas."
        },
        "Artes Marciais Mecânicas (Mechanical Martial Arts)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisitos: droide, Artes Marciais I, bônus base de ataque +1.\n\nBenefício: Quando você causa dano com sucesso a um inimigo usando um ataque desarmado, esse inimigo sofre –5 de penalidade em todas as jogadas de ataque corpo a corpo e rolagens de dano corpo a corpo até o início do seu próximo turno.\n\nEspecial: Se você atingir um inimigo orgânico com este talento durante um ataque de oportunidade, a penalidade dura até o início do próximo turno desse inimigo."
        },
        "Aspecto Horrendo (Hideous Visage)": {
                  "source": "Star Wars Saga Edition Scum and Villainy / Wiki-Fandom",
                  "text": "Pré-requisito: traço de espécie Metamorfo.\n\nBenefício: Uma vez por encontro, como ação rápida, você pode distorcer sua aparência para assustar um oponente que possa vê-lo. Faça uma verificação de Enganação contra a Defesa de Vontade do alvo. Se tiver sucesso, o alvo se move 1 quadrado para longe de você e sofre –1 de penalidade em todas as jogadas de ataque até o início do seu próximo turno. Este é um efeito de medo e de afetar a mente."
        },
        "Assalto com Fogo Automático (Autofire Assault)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom',
            text: `Pré-requisito: Foco em Arma com a arma escolhida.

Benefício: Quando empunha uma arma para a qual possui Foco em Arma e mira com fogo automático a mesma área que atingiu com fogo automático no seu último turno, a penalidade do ataque de fogo automático é reduzida para –2. A penalidade é reduzida para –1 se você estiver usando uma arma exclusiva de fogo automático apoiada ou a Aptidão Rajada Controlada. Se acertar, você causa +1 dado de dano.

Normal: Ataques de fogo automático sofrem –5 de penalidade, e não há bônus por disparar contra os mesmos quadrados em rodadas consecutivas.

Especial: Este Talento não pode ser usado com Varredura com Fogo Automático ou Fogo de Rajada.`
        },
        "Assumir Riscos (Risk Taker)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisito: treinado em Escalar ou Saltar.\n\nBenefício: Uma vez por encontro, quando fizer um teste de Escalar ou Saltar, você pode rolar novamente o teste e ficar com o melhor resultado."
        },
        "Ataque Astuto (Cunning Attack)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Você recebe +2 de bônus nas jogadas de ataque contra inimigos desprevenidos."
        },
        "Ataque Avassalador (Overwhelming Attack)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Nenhum.\n\nBenefício: Você deve gastar duas ações rápidas na mesma rodada para ativar este talento. Se o alvo do seu próximo ataque, feito antes do fim da mesma rodada, tentar usar uma aptidão, talento ou outra habilidade para negar o ataque, como Bloquear, Defletir ou Combate Veicular, ele sofre –5 de penalidade na jogada de ataque ou teste de perícia usado para negar esse ataque."
        },
        "Ataque Coordenado (Coordinated Attack)": {
                  "source": "Star Wars Saga Edition Core Rulebook / Starships of the Galaxy / Wiki-Fandom",
                  "text": "Pré-requisito: Bônus base de ataque +2.\n\nBenefício: Você tem sucesso automático ao usar a ação ajudar outro para auxiliar a jogada de ataque de um aliado ou suprimir o ataque de um inimigo, desde que o alvo esteja adjacente a você ou dentro do alcance à queima-roupa.\n\nNormal: Sem este Talento, você precisa fazer uma jogada de ataque contra Defesa de Reflexos 10 para receber os benefícios da ação ajudar outro.\n\nEfeito adicional em combate veicular: Você pode usar este Talento para ajudar o ataque veicular de um aliado. Você não pode usar ajudar outro para suprimir um veículo inteiro, mas pode suprimir um artilheiro específico, como o artilheiro principal de uma bateria de armas. Você também pode usar este Talento ao ajudar como operador de sensores com Usar Computadores ou como comandante com Conhecimento (táticas)."
        },
        "Ataque Demolidor (Battering Attack)": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Bantha Rush, Derrubar.\n\nBenefício: Sempre que você mover uma criatura com sucesso usando o talento Bantha Rush, também derruba essa criatura, deixando-a prostrada."
        },
        "Ataque Desestabilizador (Scum) (Staggering Attack (Scum))": {
                "source": "Star Wars Saga Edition Scum and Villainy / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: aptidão Ataque Furtivo, ou Tiro Rápido, ou Golpe Rápido.\n\nBenefício: Sempre que você causaria dano adicional de um talento que concede um ou mais dados extras de dano, pode abrir mão desses dados extras para mover o alvo 2 quadrados para cada dado extra sacrificado. Esse movimento não provoca ataques de oportunidade."
        },
        "Ataque Desestabilizador (War) (Staggering Attack (War))": {
                "source": "Star Wars Saga Edition Galaxy at War / Wiki-Fandom",
                "text": "Pré-requisitos: Bônus base de ataque +1, proficiência com a arma usada.\n\nBenefício: Ao usar uma arma corpo a corpo, você pode fazer um ataque para atrapalhar a concentração do inimigo. Você sofre –2 de penalidade na jogada de ataque; se o ataque causar dano, o alvo sofre –2 de penalidade em testes de perícia até o fim do seu próximo turno. Você também pode sofrer –5 de penalidade na jogada de ataque; se causar dano, o alvo sofre –5 de penalidade em testes de perícia até o fim do seu próximo turno."
        },
        "Ataque Duplo (Double Attack)": {
                "source": "Star Wars Saga Edition Core Rulebook / Wiki-Fandom",
                "text": "Pré-requisito: Bônus base de ataque +6.\n\nBenefício: Escolha um grupo de armas com o qual seja proficiente. Quando fizer um ataque total com uma arma desse grupo, você pode fazer um ataque adicional. Você sofre –5 de penalidade em todas as jogadas de ataque feitas nesse ataque total.\n\nEspecial: Você pode escolher este talento mais de uma vez. Cada vez que o escolher, aplique-o a um grupo de armas diferente."
        },
        "Ataque em Corrida (Running Attack)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Core Rulebook / Knights of the Old Republic Campaign Guide / Wiki-Fandom',
            text: `Pré-requisito: Destreza 13.

Benefício: Quando faz um ataque com uma arma corpo a corpo ou à distância, você pode se mover antes e depois do ataque, desde que a distância total movida não exceda sua velocidade.

Efeito adicional — Esquiva combinada: Se também possuir Esquiva, você pode somar seu bônus de Esquiva à Defesa de Reflexos contra qualquer ataque de oportunidade provocado enquanto usa Ataque em Corrida.`
        },
        "Ataque Garantido (Assured Attack)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Rebellion Era Campaign Guide / Wiki-Fandom',
            text: `Pré-requisito: Nenhum.

Benefício: Sempre que causar dano a um alvo com um ataque e rolar múltiplos dados de dano, você pode rolar novamente o dado de menor resultado. Você deve manter o segundo resultado, mesmo que ele seja pior.`
        },
        "Ataque Implacável (Relentless Attack)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom',
            text: `Pré-requisito: Ataque Duplo com a arma escolhida.

Benefício: Escolha um grupo de armas ou uma arma exótica para o qual possua Ataque Duplo. Sempre que errar um alvo com essa arma, você recebe +2 de bônus de competência na próxima jogada de ataque contra o alvo que errou, desde que esse ataque seja feito antes do fim do seu próximo turno.

Especial: Você pode escolher este talento mais de uma vez. Cada vez que o escolher, aplique-o a um grupo de armas ou arma exótica diferente.`
        },
        "Ataque Instintivo (Instinctive Attack)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Unknown Regions / Wiki-Fandom',
            text: `Pré-requisito: não droide.

Benefício: Quando gastar um Ponto da Força ao fazer uma jogada de ataque, você pode rolar novamente o ataque e ficar com o melhor resultado. A rolagem do Ponto da Força é aplicada ao melhor resultado.`
        },
        "Ataque Poderoso (Power Attack)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Core Rulebook / Wiki-Fandom',
            text: `Pré-requisito: Força 13.

Benefício: Em seu turno, antes de fazer uma jogada de ataque corpo a corpo, você pode escolher subtrair um número de todas as suas jogadas de ataque corpo a corpo e somar o mesmo número às rolagens de dano corpo a corpo. O número escolhido não pode exceder seu bônus base de ataque. A penalidade e o bônus duram até o início do seu próximo turno.

Especial: Se atacar com uma arma de duas mãos, ou com uma arma de uma mão empunhada com as duas mãos, some ao dano o dobro do número subtraído da jogada de ataque. O bônus de Ataque Poderoso não se aplica ao dano causado contra objetos ou veículos.`
        },
        "Ataque Selvagem (Savage Attack)": {
                "source": "Star Wars Saga Edition Force Unleashed Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisitos: Ataque Duplo com a arma escolhida, proficiência com a arma escolhida.\n\nBenefício: Escolha um grupo de armas ou arma exótica para o qual possua Ataque Duplo. Quando usa uma ação de ataque total e acerta o alvo com seu primeiro ataque, cada ataque restante bem-sucedido contra esse mesmo alvo causa +1 dado de dano."
        },
        "Ataque Triplo (Triple Attack)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Core Rulebook / Starships of the Galaxy / Wiki-Fandom',
            text: `Pré-requisitos: bônus base de ataque +11, Ataque Duplo com a arma escolhida.

Benefício: Escolha uma arma exótica ou um grupo de armas. Quando usa a ação ataque total empunhando essa arma, você pode fazer um ataque adicional. Você sofre –5 de penalidade em todas as jogadas de ataque até o seu próximo turno; esse ataque extra e essa penalidade se acumulam com Ataque Duplo.

Normal: Fazer um único ataque é uma ação padrão.

Especial: Você pode escolher este talento mais de uma vez. Cada vez que o escolher, aplique-o a uma arma exótica ou grupo de armas diferente. Se escolher este talento para Armas Pesadas, ele funciona normalmente com armas veiculares.`
        },
        "Ataque Turbilhão (Whirlwind Attack)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Core Rulebook / Wiki-Fandom',
            text: `Pré-requisitos: Destreza 13, Inteligência 13, Defesa Corpo a Corpo, bônus base de ataque +4.

Benefício: Como ação de rodada completa, você pode fazer um ataque de área com sua arma corpo a corpo, atingindo todos os alvos dentro do seu alcance. Esse Ataque Turbilhão usa as regras de ataques de área: faça uma única jogada de ataque e aplique o resultado a todos os alvos dentro do alcance.`
        },
        "Ataque Vantajoso (Advantageous Attack)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Bônus base de ataque +1.\n\nBenefício: Quando você faz um ataque bem-sucedido contra um inimigo que ainda não agiu no combate, adiciona seu nível heroico completo às rolagens de dano.\n\nNormal: Você normalmente adiciona apenas metade do seu nível heroico às rolagens de dano."
        },
        "Atirador de Bowcaster (Bowcaster Marksman)": {
                "source": "Star Wars Saga Edition Rebellion Era Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisito: Wookiee.\n\nBenefício: Sempre que você gastar um Ponto da Força para somar ao ataque com um bowcaster, se acertar o alvo, recebe um bônus de competência na rolagem de dano igual ao valor somado à jogada de ataque pelo Ponto da Força."
        },
        "Atirador Oportunista (Opportunistic Shooter)": {
                "source": "Star Wars Saga Edition Legacy Era Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: Tiro à Queima-Roupa.\n\nBenefício: Quando um inimigo adjacente a você provoca um ataque de oportunidade, você pode fazer esse ataque de oportunidade com uma arma à distância que esteja empunhando. Esse ataque segue as regras normais de ataques de oportunidade e de armas à distância."
        },
        "Atualização Lógica: Autodefesa (Logic Upgrade: Self Defense)": {
                "source": "Star Wars Saga Edition Scavenger's Guide to Droids / Wiki-Fandom",
                "text": "Pré-requisito: droide.\n\nBenefício: Uma vez por encontro, como ação rápida, você concede a si mesmo +2 de bônus em uma Defesa à sua escolha por 1 rodada."
        },
        "Atualização Lógica: Tático (Logic Upgrade: Tactician)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Knights of the Old Republic Campaign Guide / Wiki-Fandom',
            text: `Pré-requisitos: droide, bônus base de ataque +4.

Benefício: Uma vez por encontro, você pode usar a ação ajudar outro para conceder a um único aliado +5 de bônus na próxima jogada de ataque contra um oponente.

Normal: Uma tentativa bem-sucedida de ajudar uma jogada de ataque normalmente concede +2 de bônus à próxima jogada de ataque do aliado contra o oponente.`
        },
        "Atualização Lógica: Troca de Perícia (Logic Upgrade: Skill Swap)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Scavenger’s Guide to Droids / Wiki-Fandom',
            text: `Pré-requisitos: droide, processador básico.

Benefício: Escolha uma perícia na qual você não seja treinado, exceto Usar a Força. Como ação de rodada completa, você pode trocar essa perícia por uma perícia na qual seja treinado. Enquanto a troca durar, você perde os benefícios da perícia treinada original. A perícia escolhida para entrar não conta como treinada; por isso, você não pode usar opções exclusivas de treinado nem recebe o bônus por treinamento. Você ainda soma metade do nível e o modificador de habilidade associado normalmente.

Especial: Se você se tornar treinado na perícia escolhida para este talento, pode escolher outra perícia para substituí-la. Você pode escolher este talento mais de uma vez, selecionando uma perícia diferente a cada vez.`
        },
        "Barragem Coordenada (Coordinated Barrage)": {
                "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                "text": "Pré-requisitos: Ataque Coordenado, bônus base de ataque +5.\n\nBenefício: Quando usa ajudar outro para auxiliar a jogada de ataque de um aliado e a tentativa é bem-sucedida, o aliado causa dano adicional se acertar. O dano adicional é igual a +1 dado de dano da arma usada pelo aliado."
        },
        "Barragem de Blaster (Blaster Barrage)": {
                "source": "Star Wars Saga Edition The Force Unleashed Campaign Guide / Saga Edition RPG Omnibus",
                "text": "Pré-requisito: Ataque Coordenado.\n\nBenefício: Quando você faz um ataque com uma arma em modo de fogo automático e causa dano a pelo menos um alvo dentro da área designada, seus aliados recebem +2 de bônus de circunstância em ataques de fogo automático contra esse mesmo alvo até o início do seu próximo turno."
        },
        "Bater Cabeças (Knock Heads)": {
            category: 'Talentos',
            source: 'Star Wars Saga Edition Legacy Era Campaign Guide / Wiki-Fandom',

                "text": "Tempo: Ação padrão\nAlvo: Uma criatura a até 12 quadrados e em sua linha de visão\n\nVocê puxa ou torce uma arma com a Força para arrancá-la das mãos do alvo. Faça uma verificação de Usar a Força contra a Defesa de Reflexos do alvo. Se tiver sucesso, o alvo é desarmado.",

                        "text": "Tempo: Reação\nAlvo: Um inimigo ao seu alcance cujo ataque corpo a corpo errou você\n\nVocê transforma esquiva e deslocamento em contra-ataque fluido. Faça uma verificação de Usar a Força depois que um ataque corpo a corpo contra você errar. O resultado determina o benefício do riposte.",
                        "checks": [
                                        {
                                                        "cd": "20",
                                                        "effect": "Faça um ataque com sabre de luz contra o atacante."
                                        },
                                        {
                                                        "cd": "25",
                                                        "effect": "Como CD 20, e receba +1 no ataque."
                                        },
                                        {
                                                        "cd": "30",
                                                        "effect": "Como CD 20, e receba +2 no ataque e +2 na Defesa de Reflexos contra o atacante até o início do seu próximo turno."
                                        }
                        ],
                        "special": "Exige sabre de luz ativado. Você pode gastar 1 Ponto da Força para dar 1 passo antes do contra-ataque."
        },
        "Riposte Makashi (Makashi Riposte)": {
                        "source": "Star Wars Saga Edition Jedi Academy Training Manual / Wiki-Fandom",
                        "descriptor": "[Forma de Sabre]",
                        "text": "Tempo: Reação\nAlvo: Um inimigo ao seu alcance cujo ataque corpo a corpo você evitou ou bloqueou\n\nVocê usa a precisão da Forma Makashi para responder imediatamente a uma abertura do oponente. Faça uma verificação de Usar a Força e um ataque corpo a corpo com sabre de luz contra o alvo.",
                        "checks": [

        },
        "Surgimento de Plantas (Plant Surge)": {
                        "source": "Star Wars Saga Edition Clone Wars Campaign Guide / Wiki-Fandom",
                        "descriptor": "—",
                        "text": "Tempo: Ação padrão\nAlvo: Plantas em uma área a até 12 quadrados e em sua linha de visão\n\nVocê acelera o crescimento vegetal por meio da Força, fazendo raízes, galhos e vinhas se moverem em ritmo impossível. Faça uma verificação de Usar a Força. O resultado determina a área e a intensidade do terreno criado.",
                        "checks": [
                                        {
                                                        "cd": "15",
                                                        "effect": "Crie terreno difícil em uma área de 2 x 2 quadrados até o início do seu próximo turno."
                                        },
                                        {
                                                        "cd": "20",
                                                        "effect": "Crie terreno difícil em uma área de 4 x 4 quadrados; criaturas na área sofrem −2 em Acrobacia e Saltar."
                                        },
                                        {
                                                        "cd": "25",
                                                        "effect": "Como CD 20, e criaturas que começarem o turno na área têm deslocamento reduzido em 2 quadrados."
